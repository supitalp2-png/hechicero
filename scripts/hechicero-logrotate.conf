# Rotation des logs Hechicero — TICKET-010 (2026-07-18)
# Installation : sudo cp scripts/hechicero-logrotate.conf /etc/logrotate.d/hechicero
# Test à blanc : sudo logrotate -d /etc/logrotate.d/hechicero
# Forcer une rotation immédiate : sudo logrotate -f /etc/logrotate.d/hechicero
#
# Ne couvre PAS les services systemd (battery_tracker, battery_watchdog,
# play_tracker, buttons_daemon, hechicero-idle) : leurs logs passent par
# journald, qui a sa propre rétention (voir /etc/systemd/journald.conf,
# SystemMaxUse). Rien à faire ici pour eux.
#
# "su thomas www-data" : /tmp et ~/hechicero/data sont group-writable
# (convention du projet, umask 002 / chgrp www-data) donc logrotate refuse
# par défaut d'y toucher en root ("insecure permissions" sinon) — su lui dit
# d'agir avec cet utilisateur/groupe à la place.

su thomas www-data

/tmp/hechicero_ingest.log {
    daily
    rotate 7
    compress
    delaycompress
    missingok
    notifempty
    copytruncate
    create 0664 thomas www-data
}

/home/thomas/hechicero/data/sleep_debug.log {
    daily
    rotate 14
    compress
    delaycompress
    missingok
    notifempty
    copytruncate
    create 0664 www-data www-data
}

# TICKET-109 — logger diagnostic Wi-Fi (wifi_watch.service), temporaire
/home/thomas/hechicero/data/wifi_watch.log {
    daily
    rotate 7
    compress
    delaycompress
    missingok
    notifempty
    copytruncate
    create 0664 thomas thomas
}

# TICKET-110 — roaming auto multi-AP (wifi_roam.service)
/home/thomas/hechicero/data/wifi_roam.log {
    daily
    rotate 7
    compress
    delaycompress
    missingok
    notifempty
    copytruncate
    create 0664 root root
}
