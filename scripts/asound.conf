# asound.conf — copie versionnée de /etc/asound.conf (TICKET-125, 2026-08-17)
#
# ── POURQUOI CE FICHIER EST DANS LE DÉPÔT ────────────────────────────────────
# Il vit en réalité dans /etc/, donc **hors du dépôt** : il ne suivrait pas sur
# une image SD fraîche, et toute la chaîne d'égalisation serait à réécrire de
# mémoire. Même raison que scripts/apache-hechicero-nocache.conf.
#
#   sudo cp /etc/asound.conf /etc/asound.conf.bak-$(date +%Y%m%d)
#   sudo cp scripts/asound.conf /etc/asound.conf
#   sudo systemctl restart mpd
#   aplay -l                                  # vérifier les noms de cartes
#
# ── NUMÉROS DE CARTE : LE PIÈGE ─────────────────────────────────────────────
# Les numéros de carte ALSA **dérivent d'un boot à l'autre** (vécu le
# 2026-07-03 : cartes 2 et 3 inversées). Toute référence par numéro finit par
# désigner la mauvaise carte. On nomme donc TOUT par `CARD=`.
#
# État relevé le 2026-08-17 :
#   0 vc4hdmi0        — HDMI
#   1 vc4hdmi1        — HDMI
#   2 Audio           — KT USB Audio  (DAC du CASQUE)
#   3 sndrpihifiberry — HiFiBerry DAC+ (HAUT-PARLEURS)
#
# ⚠️ PIÈGE ÉVITÉ DE JUSTESSE (TICKET-125) : la version numérotée disait
# `hw:2,0` et `card 2`. Le message du smoke test conseillait de remplacer par
# `CARD=sndrpihifiberry` — c'était FAUX. La carte 2 est le DAC USB du casque,
# pas la HiFiBerry. Appliquer ce conseil aurait déplacé la sortie par défaut
# des écouteurs vers les haut-parleurs : un changement de comportement
# déguisé en correction. On écrit donc `CARD=Audio`, qui préserve exactement
# le comportement actuel tout en devenant insensible à la renumérotation.
#
# ⚠️ Et c'est bien un périphérique USB : contrairement à la HiFiBerry, il peut
# être débranché. Dans ce cas toute la numérotation glisse — raison de plus de
# ne jamais le désigner par un chiffre.
#
# ── QUI UTILISE RÉELLEMENT LE PÉRIPHÉRIQUE PAR DÉFAUT ? ─────────────────────
# Presque personne, vérifié le 2026-08-17 :
#   - MPD : NON. Ses deux sorties pointent sur les plugins eqhp / eqcasque.
#   - Le son de démarrage : NON. `scripts/play_chime.py` passe par MPD
#     (« via MPD, pas de click DAC » — sa docstring le dit).
#   - `audio_eq_apply.py` : NON. Tous ses appels amixer précisent `-D`.
#   - Reste : un `aplay` ou un `amixer` tapé à la main en SSH.
# L'enjeu est donc faible — mais un réglage juste ne coûte rien à maintenir,
# et il évite de diagnostiquer un jour un « aplay qui sort du HDMI ».

pcm.!default {
    type plug
    slave.pcm "hw:CARD=Audio,DEV=0"
}
ctl.!default {
    type hw
    card "Audio"
}

# ⚠️ Note du 2026-08-17 : le DAC casque a peut-être changé de port USB le matin
# même (remplacement des cellules, TICKET-126). `CARD=Audio` y est insensible —
# l'identifiant vient du nom du périphérique, pas de la prise. Seul le NUMÉRO
# bouge, ce qui signifie que l'ancien `hw:2,0` ne désignait peut-être pas la
# même carte la veille. Preuve que le nommage fonctionne : le casque marche
# parfaitement après le changement de port, parce que `pcm.plugequal_casque`
# le désigne déjà par `CARD=Audio`.

# TICKET-030 — égaliseur alsaequal, une instance par sortie
ctl.eqhp {
  type equal;
  controls "/home/thomas/hechicero/data/alsaequal_hp.bin";
}
pcm.plugequal_hp {
  type equal;
  slave.pcm "plughw:CARD=sndrpihifiberry,DEV=0";
  controls "/home/thomas/hechicero/data/alsaequal_hp.bin";
}
pcm.eqhp {
  type plug;
  slave.pcm plugequal_hp;
}
ctl.eqcasque {
  type equal;
  controls "/home/thomas/hechicero/data/alsaequal_casque.bin";
}
pcm.plugequal_casque {
  type equal;
  slave.pcm "plughw:CARD=Audio,DEV=0";
  controls "/home/thomas/hechicero/data/alsaequal_casque.bin";
}
pcm.eqcasque {
  type plug;
  slave.pcm plugequal_casque;
}

# ═══════════════════════════════════════════════════════════════════════════
# TICKET-151 — Traitement du son des haut-parleurs (chaîne DSP)
# ═══════════════════════════════════════════════════════════════════════════
#
# POURQUOI
# ────────
# Les drivers font 38 mm de membrane. Sous ~150 Hz ils ne produisent rien
# d'audible : l'énergie qu'on y envoie ne fait que du débattement de cône, elle
# vole de la marge et brouille le médium par intermodulation. Résultat, un son
# qui « manque de profondeur » (Thomas, 2026-08-26) — et qui craquait tant que
# l'égaliseur amplifiait ces fréquences (TICKET-150).
#
# CE QUE FAIT LA CHAÎNE, ET DANS QUEL ORDRE
# ─────────────────────────────────────────
#   1. harmonicGen   — crée les harmoniques des fondamentales graves
#   2. butthigh_iir  — coupe les fondamentales, garde les harmoniques
#   3. fastLookaheadLimiter — plafonne les crêtes
#
# ⚠️ L'ORDRE EST LE MÉCANISME, pas un détail. Un vrai système type MaxxBass
# sépare la bande grave, lui génère des harmoniques, puis remélange —
# `asound.conf` ne sait pas dériver en parallèle. On obtient l'équivalent en
# série : on génère les harmoniques AVANT de couper, si bien qu'il ne reste
# que les harmoniques quand la fondamentale disparaît. L'oreille reconstruit
# alors une fondamentale qui n'est plus émise. Inverser 1 et 2 supprimerait
# tout l'effet : il n'y aurait plus de grave à harmoniser.
#
# ⚠️ Contrepartie assumée : le générateur agit aussi sur le médium, où ses
# harmoniques s'entendent comme une légère saturation. D'où des magnitudes
# faibles (0,15 et 0,12) et un interrupteur dans l'admin.
#
# ⚠️ Le limiteur est le DERNIER étage, après l'égaliseur — c'est lui qui rend
# l'écrêtage impossible quelle que soit la courbe. C'est ce qui manquait au
# TICKET-150.
#
# SÛRETÉ
# ──────
# Rien de ce qui existait n'est modifié : `eqhp` reste intact et reste la
# sortie MPD 0. Cette chaîne est la sortie MPD 2. Si elle est mal réglée ou si
# un greffon disparaît, il suffit de réactiver la sortie 0 — le filet de
# sécurité est structurel, pas une procédure à se rappeler.
#
# Dépendance : paquet `swh-plugins` (greffons 1220, 1904, 1913).

pcm.eqhp_dsp {
  type plug;
  slave.pcm {
    type ladspa;
    # ⚠️ L'esclave est le MATÉRIEL, pas `eqhp` — et ce n'est pas un raccourci.
    # `alsaequal` et `type ladspa` ne se combinent PAS, dans aucun des deux
    # sens : quatre variantes essayées le 2026-08-26 (LADSPA au-dessus de
    # l'égaliseur, égaliseur au-dessus de LADSPA, un seul greffon mono, la
    # chaîne complète) échouent toutes sur
    #     snd1_pcm_hw_param_get_min: Assertion `!snd_interval_empty(i)' failed
    # tandis que LADSPA branché directement sur le matériel fonctionne.
    # `alsaequal` négocie mal les formats ; il faut choisir l'un ou l'autre.
    #
    # 📌 CONSÉQUENCE À CONNAÎTRE : sur cette voie, les réglages d'égaliseur de
    # l'admin ne s'appliquent PAS. C'est signalé dans l'interface, sans quoi on
    # tournerait les curseurs sans rien entendre changer.
    slave.pcm "plughw:CARD=sndrpihifiberry,DEV=0";
    path "/usr/lib/ladspa";
    plugins [
      {
        # Harmonic generator (1220) — fondamentale, puis rangs 2 à 10.
        # AVANT le passe-haut : c'est l'ordre qui fait tout le mécanisme. On
        # crée les harmoniques des fondamentales graves, puis on supprime les
        # fondamentales — il ne reste que les harmoniques, et l'oreille
        # reconstruit un grave qui n'est plus émis. Inverser les deux étages
        # supprimerait l'effet : il n'y aurait plus de grave à harmoniser.
        # Rangs 2 et 3 seulement : au-delà, ça s'entend comme de la distorsion
        # sur le médium.
        #
        # 0,15 / 0,12 à la première écoute → « meilleur mais manque de basses »
        # (Thomas, 2026-08-26). Montés à 0,24 / 0,18. C'est LE bon levier pour
        # ça : il fabrique la sensation de grave sans un micron d'excursion
        # supplémentaire. Rouvrir le passe-haut aurait rendu du grave réel —
        # et ramené le débattement, donc le problème qu'on vient de régler.
        label harmonicGen;
        policy duplicate;
        input { controls [ 1.0 0.24 0.18 0 0 0 0 0 0 0 ]; }
      }
      {
        # GLAME Butterworth Highpass (1904) — fréquence, résonance.
        # 140 Hz : sous cette valeur une membrane de 38 mm ne produit rien
        # d'audible, elle ne fait que du débattement qui vole de la marge et
        # brouille le médium.
        # 0.707 = Butterworth : la pente sans bosse ni creux à la coupure.
        label butthigh_iir;
        policy duplicate;
        input { controls [ 140 0.707 ]; }
      }
      {
        # Fast Lookahead limiter (1913) — gain d'entrée, plafond, relâchement.
        # DERNIER étage, et c'est ce qui manquait au TICKET-150 : plus rien ne
        # peut écrêter en aval. Stéréo natif, donc pas de `policy duplicate`.
        #
        # Gain d'entrée à −6 dB : le générateur d'harmoniques AJOUTE de
        # l'énergie, donc la voie traitée sortait plus fort que la voie directe
        # et saturait l'ampli (Thomas, 2026-08-26). Ce n'était pas un écrêtage
        # numérique — le limiteur l'interdit — mais bien l'étage analogique et
        # les membranes poussés trop loin.
        # ⚠️ Ce réglage sert AUSSI à comparer honnêtement : à niveau inégal, la
        # voie la plus forte paraît toujours meilleure. Il faut égaliser les
        # niveaux avant de juger un timbre.
        label fastLookaheadLimiter;
        input { controls [ -6.0 -1.5 0.15 ]; }
      }
    ];
  }
}
