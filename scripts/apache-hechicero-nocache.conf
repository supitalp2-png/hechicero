# apache-hechicero-nocache.conf — TICKET-127 (2026-08-17)
#
# ── LE BUG QUE CETTE CONFIG EMPÊCHE ──────────────────────────────────────────
# Le 2026-08-17, une modification d'`index.html` a été déployée, vérifiée sur le
# disque, validée par le smoke test… et n'a jamais atteint l'écran. Chromium
# servait sa copie en cache. Il a fallu deux allers-retours de diagnostic pour
# s'en apercevoir, parce que RIEN ne le signalait : le fichier était bon, PHP
# était bon, Apache répondait 200.
#
# C'est la pire famille de panne de ce projet : on croit avoir corrigé, et c'est
# l'ancien code qui tourne. Pire encore, ça fausse tous les diagnostics
# suivants — on cherche un bug dans du code qui n'est pas exécuté.
#
# `restart-kiosk.sh` ne lance pas Chromium en `--incognito` (contrairement au
# `.desktop` du mode kiosque), donc son profil et son cache HTTP survivent aux
# relances. Plutôt que de dépendre du mode de lancement, on règle le problème à
# la source : le serveur interdit la mise en cache des pages du lecteur.
#
# ── POURQUOI `<LocationMatch>` ET PAS `<Directory>` ─────────────────────────
# `<LocationMatch>` filtre sur l'URL, pas sur un chemin du disque. Cette config
# est donc indépendante du `DocumentRoot` et du vhost — elle fonctionnera sur
# une réinstallation sans avoir à retrouver comment `~/hechicero/web` est servi.
# (Un `.htaccess` était exclu : `AllowOverride None` dans apache2.conf.)
#
# ── POURQUOI LE `<IfModule>` ────────────────────────────────────────────────
# Sans lui, si `mod_headers` n'est pas chargé, Apache refuse de démarrer et
# l'IHM de l'enfant est morte — écran d'erreur, appareil inutilisable. Avec
# lui, l'échec est silencieux : la config ne s'applique pas, mais rien ne
# tombe. C'est le bon compromis pour un appareil sans écran d'administration,
# À CONDITION que quelque chose détecte le silence : c'est le rôle du contrôle
# §3 du smoke test, qui lit les en-têtes réellement servis.
#
# ── INSTALLATION ────────────────────────────────────────────────────────────
#   sudo a2enmod headers
#   sudo cp scripts/apache-hechicero-nocache.conf /etc/apache2/conf-available/
#   sudo a2enconf apache-hechicero-nocache
#   sudo apachectl configtest        # DOIT dire "Syntax OK" avant de recharger
#   sudo systemctl reload apache2

<IfModule headers_module>

    # L'URL réellement chargée par le kiosque (`http://localhost/lecteur`,
    # qu'Apache redirige vers `/lecteur/`, servie par l'index du répertoire).
    <LocationMatch "^/lecteur/?$">
        Header set Cache-Control "no-store, no-cache, must-revalidate, max-age=0"
        Header set Pragma "no-cache"
        Header set Expires "0"
    </LocationMatch>

    # Les pages nommées explicitement : index.html, chambre.html, etc.
    <LocationMatch "^/lecteur/.+\.html$">
        Header set Cache-Control "no-store, no-cache, must-revalidate, max-age=0"
        Header set Pragma "no-cache"
        Header set Expires "0"
    </LocationMatch>

    # ⚠️ Volontairement limité au HTML. Les polices, images et sons du lecteur
    # continuent d'être mis en cache : ce sont eux qui pèsent, ils ne changent
    # presque jamais, et le kiosque démarre plus vite avec. Seul le document
    # qui porte le code doit être frais à chaque chargement.
    # Les réponses de radio.php ne sont pas concernées non plus : les fetch de
    # l'IHM passent déjà en `cache: 'no-store'` côté navigateur.

</IfModule>
