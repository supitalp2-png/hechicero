<!doctype html>
<html lang="fr">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <title>Hechicero</title>
  <link rel="preload" href="../fonts/GreatVibes-Regular.woff2" as="font" type="font/woff2" crossorigin>
  <style>
    /* ── VARIABLES ── */
    :root {
      --bg: #0d1117;
      --surface: #0f1e2e;
      --border: #1e3a5f;
      --accent: #00c8ff;
      --accent-radio: #c8a050;
      --text: #e6eef6;
      --muted: #7fa8c8;
      --green: #3dba6a;
      --sb-h: 32px;
    }

    /* ── RESET ── */
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
    html, body {
      width: 100%; height: 100%;
      font-family: system-ui, -apple-system, "Segoe UI", Roboto, "Helvetica Neue", Arial, sans-serif;
      background: var(--bg);
      color: var(--text);
      overflow: hidden;
    }
    button { cursor: pointer; font-family: inherit; border: none; background: none; color: inherit; }
    img { -webkit-user-drag: none; user-drag: none; user-select: none; }
    .hidden { display: none !important; }

    /* ── STATUS BAR ── */
    #statusbar {
      position: fixed; top: 0; left: 0; right: 0;
      height: var(--sb-h);
      background: #080d13;
      display: flex; align-items: center; justify-content: space-between;
      padding: 0 14px;
      font-size: 0.78rem; color: var(--muted);
      z-index: 100;
    }
    #sb-time    { font-size: 20px; font-weight: 600; }
    #bat-display { font-size: 18px; }
    #sb-battery { display: flex; align-items: center; gap: 5px; }

    /* ── APP CONTAINER ── */
    #app { position: fixed; inset: 0; }

    /* ── SCREENS ── */
    .screen {
      position: absolute; inset: 0;
      display: flex; flex-direction: column;
      padding-top: var(--sb-h);
      box-sizing: border-box;
    }

    /* ── BACK BUTTON ── */
    .btn-back {
      display: inline-flex; align-items: center; gap: 4px;
      height: 52px; padding: 0 18px 0 6px;
      border-radius: 26px;
      background: var(--surface); border: 1.5px solid var(--border);
      color: var(--text); font-size: 1rem;
      flex-shrink: 0;
    }
    .btn-back .chev {
      width: 28px; height: 28px; border-radius: 50%;
      display: flex; align-items: center; justify-content: center;
      color: var(--accent); font-size: 1.15rem; font-weight: 700;
    }

    /* ── SCREEN HEADER ── */
    .s-header {
      display: flex; align-items: center; gap: 10px;
      padding: 10px 14px; flex-shrink: 0;
    }
    .s-header .s-title {
      font-size: 1.1rem; font-weight: 600;
      white-space: nowrap; overflow: hidden; text-overflow: ellipsis;
      flex: 1;
    }

    /* ── SCROLL AREA ── */
    .s-body {
      flex: 1; overflow-y: scroll; overflow-x: hidden; padding: 6px 14px 14px;
      touch-action: none; /* scroll 100% géré par JS Pointer Events */
      scrollbar-width: none;
    }
    .s-body::-webkit-scrollbar { display: none; }
    body.has-mini .s-body { padding-bottom: 84px; }

    /* ══════════════════════════════ */
    /* SCREEN 1 — HOME               */
    /* ══════════════════════════════ */
    #home {
      align-items: center; justify-content: center; gap: 36px;
    }
    .home-brand {
      font-family: 'Great Vibes', 'Palatino Linotype', Palatino, serif;
      font-size: clamp(48px, 10vw, 90px); font-weight: 400;
      background: linear-gradient(180deg,
        #7a4e08 0%,#c88820 12%,#f0cc58 26%,#fff098 40%,
        #f0cc50 54%,#c08018 65%,#eec850 76%,#d09828 88%,#7a4e08 100%);
      -webkit-background-clip: text; -webkit-text-fill-color: transparent; background-clip: text;
    }
    .flags-row { display: flex; gap: 28px; align-items: center; justify-content: center; }
    .flag-btn {
      display: flex; flex-direction: column; align-items: center; gap: 12px;
      min-width: 200px; min-height: 140px;
      background: var(--surface); border: 2px solid var(--border);
      border-radius: 20px; padding: 18px 20px;
      font-size: 18px; font-weight: 600;
      transition: border-color 150ms, transform 120ms;
    }
    .flag-btn:active { transform: scale(0.96); }
    .flag-btn:hover  { border-color: var(--accent); }
    .lang-locked { opacity: 0.35; pointer-events: none; filter: grayscale(1); }
    /* ── Écran de veille ── */
    @font-face {
      font-family: 'Great Vibes';
      src: url('../fonts/GreatVibes-Regular.ttf') format('truetype');
      font-weight: normal; font-style: normal; font-display: block;
    }
    /* Gradient or réutilisé */
    .gv-gold {
      background: linear-gradient(180deg,
        #7a4e08 0%,#c88820 12%,#f0cc58 26%,#fff098 40%,
        #f0cc50 54%,#c08018 65%,#eec850 76%,#d09828 88%,#7a4e08 100%);
      -webkit-background-clip: text; -webkit-text-fill-color: transparent; background-clip: text;
    }
    .gv-chrome {
      background: linear-gradient(180deg,
        #383838 0%,#7a7a7a 12%,#d4d4d4 25%,#ffffff 38%,
        #d0d0d0 52%,#888888 65%,#e4e4e4 76%,#b8b8b8 88%,#484848 100%);
      -webkit-background-clip: text; -webkit-text-fill-color: transparent; background-clip: text;
    }
    #sleep-overlay {
      display: none; position: fixed; inset: 0; z-index: 9999;
      align-items: center; justify-content: center; cursor: pointer;
      background-image: repeating-linear-gradient(
        0deg, transparent, transparent 2px, rgba(0,0,0,.07) 2px, rgba(0,0,0,.07) 3px);
    }
    #sleep-overlay.active { display: flex; }
    /* Thème Rétro Or */
    #sleep-overlay.retro  { background-color: #070503; }
    /* Thème Chrome */
    #sleep-overlay.modern { background-color: #040608; }
    /* Thème Classique */
    #sleep-overlay.classic { background-color: #050810; }
    /* Halo radial */
    #sleep-glow {
      position: absolute; inset: 0; pointer-events: none;
    }
    #sleep-overlay.retro  #sleep-glow { background: radial-gradient(ellipse 55% 45% at 50% 50%, rgba(110,65,8,.28), transparent 65%); }
    #sleep-overlay.modern #sleep-glow { background: radial-gradient(ellipse 55% 45% at 50% 50%, rgba(30,45,80,.26), transparent 65%); }
    #sleep-overlay.classic #sleep-glow { background: radial-gradient(ellipse 55% 45% at 50% 50%, rgba(20,30,60,.22), transparent 65%); }
    /* Cadre */
    #sleep-frame {
      position: absolute; inset: 5%; pointer-events: none;
    }
    #sleep-overlay.retro  #sleep-frame { border: 1px solid rgba(140,95,18,.40); }
    #sleep-overlay.modern #sleep-frame { border: 1px solid rgba(90,100,130,.36); }
    #sleep-overlay.classic #sleep-frame { border: 1px solid rgba(255,255,255,.08); }
    /* Centre */
    #sleep-center {
      display: grid; place-items: center; position: relative; z-index: 2;
    }
    /* Logo glow (couche floue derrière) */
    #sleep-brand-glow {
      grid-area: 1/1;
      font-family: 'Great Vibes', 'Palatino Linotype', Palatino, serif;
      font-size: clamp(80px, 13vw, 145px); font-weight: 400; white-space: nowrap;
      filter: blur(22px); user-select: none; pointer-events: none;
    }
    #sleep-overlay.retro  #sleep-brand-glow { color: rgba(210,140,12,.35); }
    #sleep-overlay.modern #sleep-brand-glow { color: rgba(150,170,220,.25); }
    #sleep-overlay.classic #sleep-brand-glow { color: rgba(200,210,255,.12); }
    /* Logo net */
    #sleep-brand {
      grid-area: 1/1;
      font-family: 'Great Vibes', 'Palatino Linotype', Palatino, serif;
      font-size: clamp(80px, 13vw, 145px); font-weight: 400; white-space: nowrap;
    }
    #sleep-overlay.classic #sleep-brand {
      font-family: inherit; font-size: clamp(24px, 5vw, 48px);
      letter-spacing: 0.55em; color: rgba(255,255,255,0.90);
      text-transform: uppercase; font-weight: 200;
      -webkit-text-fill-color: unset; background: none;
    }
    /* Ligne décorative sous le logo */
    #sleep-rule {
      position: absolute; z-index: 2;
      top: calc(50% + clamp(50px, 8vw, 88px));
      left: 50%; transform: translateX(-50%);
      width: 280px; height: 1px; pointer-events: none;
    }
    #sleep-overlay.retro  #sleep-rule { background: linear-gradient(90deg, transparent, rgba(200,136,32,.6), transparent); }
    #sleep-overlay.modern #sleep-rule { background: linear-gradient(90deg, transparent, rgba(140,160,210,.5), transparent); }
    #sleep-overlay.classic #sleep-rule { background: linear-gradient(90deg, transparent, rgba(255,255,255,.2), transparent); }
    /* Horloge */
    #sleep-clock {
      position: absolute; z-index: 2;
      top: calc(50% + clamp(70px, 11vw, 120px));
      left: 50%; transform: translateX(-50%);
      white-space: nowrap;
    }
    #sleep-clock .clock-time {
      font-family: 'Great Vibes', 'Palatino Linotype', Palatino, serif;
      font-size: clamp(36px, 6vw, 72px); font-weight: 400;
    }
    #sleep-overlay.classic #sleep-clock .clock-time {
      font-family: inherit; font-size: clamp(20px, 4vw, 42px);
      letter-spacing: 0.3em; color: rgba(255,255,255,0.65);
      text-transform: uppercase; font-weight: 200;
      -webkit-text-fill-color: unset; background: none;
    }

    .ep-num-badge {
      position: absolute; bottom: 8px; right: 10px;
      background: rgba(0,0,0,0.52); color: rgba(255,255,255,0.78);
      font-size: 28px; font-weight: 700; padding: 2px 10px;
      border-radius: 6px; letter-spacing: -1px;
      pointer-events: none; backdrop-filter: blur(3px);
    }
    .flag-svg { width: 120px; height: 80px; border-radius: 8px; overflow: hidden; }
    .flag-svg svg { width: 100%; height: 100%; display: block; }

    /* ══════════════════════════════ */
    /* SCREEN 2 — PODCASTS GRID      */
    /* ══════════════════════════════ */
    #pod-grid {
      display: grid;
      grid-template-columns: repeat(auto-fill, minmax(180px, 1fr));
      gap: 16px;
    }
    .pod-card {
      background: var(--surface); border: 1.5px solid var(--border);
      border-radius: 16px; overflow: hidden; cursor: pointer;
      transition: border-color 130ms, transform 130ms;
    }
    .pod-card:active { transform: scale(0.97); }
    .pod-card:hover  { border-color: var(--accent); }
    .pod-card img    { width: 100%; aspect-ratio: 1/1; object-fit: cover; display: block; }
    .pod-label       { padding: 10px 10px; font-size: 1.1rem; font-weight: 600; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }

    /* Webradio tile */
    .pod-card.webradio           { background: #1a1208; border-color: #3d2a08; }
    .pod-card.webradio:hover     { border-color: var(--accent-radio); }
    .pod-card.webradio .pod-label{ color: var(--accent-radio); }
    .webradio-art {
      width: 100%; aspect-ratio: 1/1;
      display: flex; align-items: center; justify-content: center;
      background: #120d04;
    }

    /* ══════════════════════════════ */
    /* SCREEN 3a — RADIO CATALOG     */
    /* ══════════════════════════════ */
    .radio-list { display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 12px; width: 100%; box-sizing: border-box; }
    .radio-row {
      display: flex; align-items: center; gap: 14px;
      background: var(--surface); border: 1.5px solid var(--border);
      border-radius: 14px; padding: 12px 14px;
      min-height: 80px; cursor: pointer;
      transition: border-color 120ms;
    }
    .radio-row:hover { border-color: var(--accent-radio); }
    .radio-dot {
      width: 10px; height: 10px; border-radius: 50%;
      background: var(--green); flex-shrink: 0;
      animation: pulse 2s ease-in-out infinite;
    }
    @keyframes pulse {
      0%, 100% { opacity: 1; transform: scale(1); }
      50%       { opacity: 0.35; transform: scale(0.7); }
    }
    .radio-info      { flex: 1; min-width: 0; }
    .radio-name      { font-weight: 600; font-size: 1.1rem; }
    .radio-desc      { font-size: 1rem; color: var(--muted); margin-top: 2px; }
    .btn-play-radio  {
      width: 40px; height: 40px; border-radius: 50%;
      background: var(--accent); color: #000; font-size: 0.95rem;
      display: flex; align-items: center; justify-content: center;
      flex-shrink: 0; pointer-events: none;
    }

    /* ══════════════════════════════ */
    /* SCREEN 3b — CHAPTERS          */
    /* ══════════════════════════════ */
    .ep-list { display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 12px; width: 100%; box-sizing: border-box; }
    .ep-row {
      display: flex; align-items: stretch; gap: 0;
      background: var(--surface); border: 1.5px solid var(--border);
      border-radius: 16px; overflow: hidden; cursor: pointer;
      transition: border-color 130ms, transform 130ms;
      min-height: 143px;
    }
    .ep-row:active { transform: scale(0.97); }
    .ep-row:hover  { border-color: var(--accent); }
    .ep-thumb      { width: 143px; min-width: 143px; height: 143px; object-fit: cover; display: block; flex-shrink: 0; }
    .ep-meta       { flex: 1; min-width: 0; padding: 12px 14px; display: flex; flex-direction: column; justify-content: center; }
    .ep-titre      { font-weight: 600; font-size: 1rem; overflow: hidden; display: -webkit-box; -webkit-line-clamp: 3; -webkit-box-orient: vertical; }
    .ep-duree      { font-size: 0.9rem; color: var(--muted); margin-top: 6px; flex-shrink: 0; }
    .radio-thumb {
      width: 52px; height: 52px; border-radius: 8px;
      object-fit: cover; flex-shrink: 0;
    }

    /* ══════════════════════════════ */
    /* SCREEN 4 — PLAYER             */
    /* ══════════════════════════════ */
    #player-inner {
      flex: 1; display: flex; min-height: calc(100vh - var(--sb-h)); align-items: center;
    }
    /* Left: artwork */
    .art-wrap {
      width: 45%; display: flex; align-items: center; justify-content: center;
      padding: 14px;
    }
    .art-box {
      position: relative; width: 100%; max-width: 310px;
      aspect-ratio: 1/1; border-radius: 16px; overflow: hidden; cursor: pointer;
    }
    .art-box img { width: 100%; height: 100%; object-fit: cover; display: block; }
    .art-overlay {
      position: absolute; inset: 0;
      background: rgba(0,0,0,0.38);
      display: flex; align-items: center; justify-content: center;
      opacity: 0; transition: opacity 170ms;
    }
    .art-box:hover .art-overlay { opacity: 1; }
    .art-overlay.show             { opacity: 1; }
    .ov-icon {
      width: 64px; height: 64px; border-radius: 50%;
      background: rgba(0,0,0,0.52);
      display: flex; align-items: center; justify-content: center;
      font-size: 1.8rem; color: #fff;
    }
    /* Right: controls */
    .ctrl-wrap {
      flex: 1; display: flex; flex-direction: column; justify-content: center;
      padding: 24px 20px 24px 8px; gap: 18px; min-width: 0;
    }
    .ctrl-pod-name { font-size: 1rem; color: var(--muted); white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
    .ctrl-ep-name  { font-size: 1.2rem; font-weight: 500; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
    /* Progress */
    .prog-wrap { display: flex; flex-direction: column; gap: 5px; }
    .prog-bg   { height: 44px; position: relative; cursor: pointer; touch-action: none; }
    .prog-bg::before {
      content: ''; position: absolute; inset: 12px 0;
      background: var(--border); border-radius: 10px; pointer-events: none;
    }
    .prog-fill {
      position: absolute; left: 0; top: 12px; bottom: 12px; width: 0%;
      background: var(--accent); border-radius: 10px;
      transition: width 1s linear; pointer-events: none;
    }
    .prog-fill { height: 20px; width: 0%; background: var(--accent); border-radius: 10px; transition: width 1s linear; }
    .prog-times { display: flex; justify-content: space-between; font-size: 1rem; color: var(--muted); font-variant-numeric: tabular-nums; }
    /* Buttons row */
    .ctrl-btns { display: flex; align-items: center; justify-content: center; gap: 16px; }
    .btn-prev, .btn-next {
      width: 80px; height: 80px; border-radius: 50%;
      background: var(--surface); border: 1.5px solid var(--border);
      display: flex; align-items: center; justify-content: center; font-size: 28px;
    }
    .btn-pp {
      width: 96px; height: 96px; border-radius: 50%;
      background: var(--accent); border: 2px solid var(--accent);
      color: #000; font-size: 36px;
      display: flex; align-items: center; justify-content: center;
      transition: transform 100ms;
    }
    .btn-pp:active { transform: scale(0.92); }
    /* Volume */
    .vol-row { display: flex; gap: 10px; align-items: center; justify-content: center; }
    .btn-vol {
      background: var(--surface); border: 1.5px solid var(--border);
      border-radius: 14px; height: 80px; min-width: 80px; padding: 0 14px; font-size: 24px;
      display: flex; align-items: center; justify-content: center;
    }
    .btn-vol:active { background: var(--border); }
    .vol-bar-wrap { display: flex; align-items: center; gap: 8px; flex: 1; min-width: 0; }
    .vol-bar-bg   { flex: 1; height: 44px; position: relative; cursor: pointer; touch-action: none; }
    .vol-bar-bg::before {
      content: ''; position: absolute; inset: 12px 0;
      background: var(--border); border-radius: 10px; pointer-events: none;
    }
    .vol-bar-fill {
      position: absolute; left: 0; top: 12px; bottom: 12px; width: 0%;
      background: var(--accent); border-radius: 10px;
      transition: width 300ms ease; pointer-events: none;
    }
    .vol-pct      { font-size: 1rem; color: var(--muted); min-width: 40px; text-align: right; font-variant-numeric: tabular-nums; }

    .battery-notice {
      position: fixed;
      left: 50%;
      transform: translateX(-50%);
      z-index: 500;
      min-width: min(92vw, 520px);
      max-width: min(92vw, 520px);
      background: rgba(15, 30, 46, 0.96);
      border: 1.5px solid var(--border);
      border-radius: 16px;
      box-shadow: 0 18px 60px rgba(0, 0, 0, 0.35);
      padding: 14px 18px;
      color: var(--text);
      backdrop-filter: blur(10px);
    }
    #battery-popup { top: 56px; }
    #resume-prompt { top: 56px; }
    #battery-alert {
      bottom: 96px;
      min-width: min(92vw, 640px);
      max-width: min(92vw, 640px);
    }
    .battery-notice.warn { border-color: rgba(245, 166, 35, 0.55); }
    .battery-notice.critical { border-color: rgba(226, 75, 74, 0.72); background: rgba(64, 20, 22, 0.96); }
    .battery-notice-title { font-size: 0.9rem; color: var(--muted); margin-bottom: 4px; }
    .battery-notice-msg { font-size: 1.12rem; font-weight: 600; }
    .resume-actions {
      display: flex;
      gap: 10px;
      margin-top: 12px;
      justify-content: flex-end;
    }
    .resume-btn {
      border-radius: 12px;
      padding: 10px 14px;
      border: 1.5px solid var(--border);
      background: var(--surface);
      color: var(--text);
      font-size: 1rem;
      font-weight: 600;
    }
    .resume-btn.primary {
      background: var(--accent);
      border-color: var(--accent);
      color: #03111b;
    }

    @media (max-width: 640px) {
      #battery-alert { bottom: 88px; }
      .resume-actions { flex-direction: column; }
      .resume-btn { width: 100%; }
    }

    /* ══════════════════════════════ */
    /* SCREEN 5 — RADIO PLAYER       */
    /* ══════════════════════════════ */
    #rp-inner { flex: 1; display: flex; min-height: calc(100vh - var(--sb-h)); align-items: center; }
    .rp-art-box {
      width: 100%; max-width: 310px;
      aspect-ratio: 1/1; border-radius: 16px; overflow: hidden;
    }
    .rp-art-box img { width: 100%; height: 100%; object-fit: cover; display: block; }
    .rp-art-fallback {
      width: 100%; height: 100%;
      display: flex; align-items: center; justify-content: center;
      background: #120d04;
    }
    .live-badge {
      display: inline-flex; align-items: center; gap: 7px;
      font-size: 0.78rem; font-weight: 700; letter-spacing: 0.07em;
      color: var(--green);
    }
    .live-dot {
      width: 8px; height: 8px; border-radius: 50%;
      background: var(--green);
      animation: pulse 2s ease-in-out infinite;
    }
    .rp-name { font-size: 24px; font-weight: 500; }
    .rp-desc { font-size: 14px; color: var(--muted); margin-top: 4px; }

    /* ── MINI-PLAYER ── */
    #miniplayer {
      position: fixed; bottom: 0; left: 0; right: 0;
      height: 80px;
      background: #080d13;
      border-top: 1.5px solid var(--border);
      display: flex; align-items: center; gap: 14px;
      padding: 0 18px;
      z-index: 200;
      cursor: pointer;
      user-select: none;
    }
    #mini-art { width: 54px; height: 54px; border-radius: 8px; object-fit: cover; flex-shrink: 0; background: var(--surface); }
    #mini-info { flex: 1; min-width: 0; }
    #mini-pod  { font-size: 1rem; color: var(--muted); white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
    #mini-ep   { font-size: 1.1rem; font-weight: 600; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; margin-top: 2px; }
    #mini-btn-pp {
      width: 54px; height: 54px; border-radius: 50%;
      background: var(--accent); color: #000; font-size: 22px;
      display: flex; align-items: center; justify-content: center;
      flex-shrink: 0;
    }
  </style>
</head>
<body>

<!-- STATUS BAR -->
<div id="statusbar">
  <span id="sb-time" style="font-variant-numeric:tabular-nums">--:--</span>
  <span id="bat-display"></span>
</div>

<div id="app">

  <!-- ─────────────────────────────── -->
  <!-- SCREEN 1 — ACCUEIL             -->
  <!-- ─────────────────────────────── -->
  <div class="screen" id="home">
    <span class="home-brand">Hechicero</span>
    <div class="flags-row">
      <button class="flag-btn" id="btn-fr">
        <span class="flag-svg">
          <svg viewBox="0 0 3 2" xmlns="http://www.w3.org/2000/svg">
            <rect width="1" height="2" x="0" fill="#0055A4"/>

<script>
// ═══════════════════════════════════════
// HELPERS
// ═══════════════════════════════════════
const el = id => document.getElementById(id);

const ALL_SCREENS = ['home','podcasts','radio-catalog','chapters','player','radio-player'];
function show(id) {
  currentScreen = id;
  ALL_SCREENS.forEach(s => el(s).classList.add('hidden'));
  el(id).classList.remove('hidden');
  el('statusbar').classList.remove('hidden');
  updateClock();
  updateMiniPlayer();
}

function updateMiniPlayer() {
  const mp = el('miniplayer');
  const onPlayer = currentScreen === 'player' || currentScreen === 'radio-player';
  const hasMedia = (currentPodcast && currentIdx >= 0) || currentStation;
  if (hasMedia && !onPlayer) {
    mp.classList.remove('hidden');
    document.body.classList.add('has-mini');
    if (currentStation) {
      el('mini-art').src = currentStation.image || '';
      el('mini-pod').textContent = 'EN DIRECT';
      el('mini-ep').textContent  = currentStation.name;
    } else {
      el('mini-art').src = currentPodcast.image || '';
      el('mini-pod').textContent = currentPodcast.titre;
      const items = getDisplayItems(currentPodcast);
      const ch = items[currentIdx];
      el('mini-ep').textContent = ch ? ch.titre : '';
    }
  } else {
    mp.classList.add('hidden');
    document.body.classList.remove('has-mini');
  }
}

function fmtDur(s) {
  if (s === null || s === undefined || s === '') return '--:--';
  if (typeof s === 'string' && s.includes(':')) {
    const p = s.split(':').map(Number);
    s = p.length === 3 ? p[0]*3600 + p[1]*60 + p[2] : p[0]*60 + p[1];
  }
  s = Math.round(+s);
  if (isNaN(s)) return '--:--';
  return Math.floor(s/60) + ':' + String(s%60).padStart(2,'0');
}

function formatMinutes(minutes) {
  const value = Math.round(Number(minutes));
  if (!Number.isFinite(value) || value <= 0) return '—';
  if (value < 60) return `${value}min`;
  const hours = Math.floor(value / 60);
  const remaining = value % 60;
  return `${hours}h${String(remaining).padStart(2, '0')}`;
}

function isPlayingNow() {
  return lastMpdState === 'play';
}

function showBatteryNotice(id, title, message, variant = '', duration = 8000) {
  const node = el(id);
  if (!node) return;
  node.classList.remove('warn', 'critical', 'hidden');
  if (variant) node.classList.add(variant);
  node.innerHTML = `
    <div class="battery-notice-title">${title}</div>
    <div class="battery-notice-msg">${message}</div>
  `;
  if (duration > 0) {
    const timerKey = id === 'battery-popup' ? '__batteryPopupTimer' : '__batteryAlertTimer';
    clearTimeout(window[timerKey]);
    window[timerKey] = setTimeout(() => node.classList.add('hidden'), duration);
  }
}

function hideBatteryNotice(id) {
  const node = el(id);
  if (!node) return;
  node.classList.add('hidden');
}

// ═══════════════════════════════════════
// STATUS BAR
// ═══════════════════════════════════════
function updateClock() {
  el('sb-time').textContent =
    new Date().toLocaleTimeString('fr-FR', { hour: '2-digit', minute: '2-digit' });
}
setInterval(updateClock, 60000);

function renderBattery(pct, charging, minutes) {
  const color = pct > 30 ? '#3dba6a' : pct > 10 ? '#f5a623' : '#e24b4a';
  return `
        <svg width="36" height="18" viewBox="0 0 22 11">
          <rect x="0" y="1" width="19" height="9" rx="2"
            fill="none" stroke="#4a7a9b" stroke-width="1.2"/>
          <rect x="1.5" y="2.5" width="${Math.round(16*pct/100)}"
            height="6" rx="1" fill="${color}"/>
          <rect x="19.5" y="3.5" width="2" height="4" rx="1" fill="#4a7a9b"/>
        </svg>
        <span style="font-size:16px;color:#c8dff0">${pct}%</span>
        <span id="battery-time" style="font-size:16px;color:#7fa8c8">${formatMinutes(minutes)}</span>
        ${charging ? '<span style="color:#f5c842;font-size:16px">⚡</span>' : ''}
      `;
}

// Batterie : essaie navigator.getBattery(), sinon lit status.json (INA219)
function updateBatteryDisplay(pct, charging, minutes) {
  const el = document.getElementById('bat-display');
  if (!el) return;
  el.innerHTML = renderBattery(Math.round(pct), charging, minutes);
}

function fetchBatteryFromStatus() {
  fetch('../status.json', { cache: 'no-store' })
    .then(r => r.json())
    .then(d => {
      const pct = d.battery_percent ?? d.percent ?? d.soc ?? null;
      const charging = d.charging ?? (d.state ? d.state.toLowerCase().includes('charge') && !d.state.toLowerCase().includes('sur batterie') : false);
      if (pct !== null) updateBatteryDisplay(pct, charging, null);
    })
    .catch(() => {});
}

let batterySnapshot = null;
let activeBatteryAlertKey = null;
let pendingResumeTarget = null;
let resumePromptLoaded = false;

function applyBatteryStats(stats) {
  const pct = stats.current_level ?? stats.percent ?? stats.battery_percent ?? null;
  if (pct === null || pct === undefined) return;
  const charging = Boolean(stats.charging ?? (stats.status === 'charging'));
  const rawAutonomy = window.__debugBatteryMinutes ?? stats.estimated_autonomy_minutes;
  const autonomyMinutes = Number(rawAutonomy);
  const chargeMinutes = Number(stats.estimated_charge_time_minutes);
  const displayMinutes = charging ? chargeMinutes : autonomyMinutes;

  updateBatteryDisplay(pct, charging, displayMinutes);

  if (batterySnapshot?.status === 'discharging' && stats.status === 'charging' && Number.isFinite(chargeMinutes) && chargeMinutes > 0) {
    showBatteryNotice('battery-popup', 'Alimentation', `Recharge estimée : ${formatMinutes(chargeMinutes)}`, '', 8000);
  }

  if (charging) {
    activeBatteryAlertKey = null;
    hideBatteryNotice('battery-alert');
  } else if (!isPlayingNow() && Number.isFinite(autonomyMinutes) && autonomyMinutes > 0) {
    if (autonomyMinutes < 10 && activeBatteryAlertKey !== '10') {
      activeBatteryAlertKey = '10';
      showBatteryNotice('battery-alert', 'Batterie faible', 'Il te reste 10 minutes, branche vite ta radio', 'critical', 20000);
    } else if (autonomyMinutes < 30 && activeBatteryAlertKey !== '30') {
      activeBatteryAlertKey = '30';
      showBatteryNotice('battery-alert', 'Batterie faible', 'Il te reste 30 minutes, pense à brancher ta radio', 'warn', 20000);
    }
  }

  batterySnapshot = stats;
}

function fetchBatteryStats() {
  fetch('/index.php?action=battery_data', { cache: 'no-store' })
    .then(r => r.json())
    .then(payload => {
      const stats = payload?.stats;
      if (stats && typeof stats === 'object' && Object.keys(stats).length) {
        applyBatteryStats(stats);
      } else {
        fetchBatteryFromStatus();
      }
    })
    .catch(() => fetchBatteryFromStatus());
}

fetchBatteryStats();
setInterval(fetchBatteryStats, 60000);

// ═══════════════════════════════════════
// RADIO STATIONS — chargées depuis data.json (clé radios)
// ═══════════════════════════════════════
let STATIONS = { fr: [], es: [] };
let currentStation = null;

// ═══════════════════════════════════════
// DATA & API
// ═══════════════════════════════════════
let VOLUME_MAX_SPEAKERS   = 40; // chargé depuis config.json
let VOLUME_MAX_HEADPHONES = 60; // TICKET-031 (GPIO casque)
let currentVolume = 0; // toujours en valeur IHM 0-100%

function ihmToMpd(ihmPct) {
  return Math.round(ihmPct * VOLUME_MAX_SPEAKERS / 100);
}
function mpdToIhm(mpdPct) {
  return Math.min(100, Math.round(mpdPct * 100 / VOLUME_MAX_SPEAKERS));
}
let currentDuration = 0;
let DATA           = null;
let currentPodcast = null;
let currentIdx     = -1;
let selectedLang   = 'fr';
let pollTimer      = null;
let currentScreen  = 'home';
let lastMpdState   = null;
let trackingId        = null;
let trackingPollCount = 0;
let lastElapsed       = 0;
let parentalCfg       = null;
let parentalTimer     = null;
let pendingChimeTouch = false;   // TICKET-073 : touch arrive avant la fin du fetch
let chimeAlreadyPlayed = false;  // TICKET-073 : evite une double lecture

// TICKET-073 : enregistrer le touch AVANT le fetch parental
document.addEventListener('touchstart', () => {
  pendingChimeTouch = true;
}, { once: true });

// Retourne les épisodes dans l'ordre de la série (ep1 en premier)
function getDisplayItems(podcast) {
  if (!podcast) return [];
  const raw = podcast.chapitres || podcast.episodes || [];
  return [...raw].reverse();
}

async function startRadioTracking(st) {
  await endTracking();
  trackingPollCount = 0;
  try {
    const params = new URLSearchParams({
      action: 'start',
      podcast_id: st.id,
      langue: (st.lang || st.langue || 'fr').toLowerCase(),
      is_radio: '1',
      station_name: st.name,
      duration_s: '0',
    });
    const r = await fetch('/tracking.php?' + params);
    const d = await r.json();
    if (d.id) trackingId = d.id;
  } catch (_) {}
}

// ch = objet épisode (pas l'index) pour éviter les problèmes de mapping
async function startTracking(podcast, ch, duration_s) {
  await endTracking();
  trackingPollCount = 0;
  try {
    if (!ch) return;
    const params = new URLSearchParams({
      action: 'start',
      podcast_id: podcast.id,
      episode_id: ch.id || ch.titre || 'unknown',
      langue: (podcast.langue || podcast.lang || podcast.language || 'fr').toLowerCase(),
      is_radio: '0',
      duration_s: String(duration_s || ch.duree || 0),
    });
    const r = await fetch('/tracking.php?' + params);
    const d = await r.json();
    if (d.id) trackingId = d.id;
  } catch (_) {}
}

async function endTracking() {
  if (!trackingId) return;
  const id = trackingId;
  trackingId = null;
  try {
    await fetch(`/tracking.php?action=end&id=${id}&listened_s=${Math.round(lastElapsed)}`);
  } catch (_) {}
}

async function loadData() {
  try {
    const [rData, rCfg] = await Promise.all([
      fetch('data.json',   { cache: 'no-store' }),
      fetch('config.json', { cache: 'no-store' })
    ]);
    if (!rData.ok) throw new Error('data.json introuvable');
    DATA = await rData.json();
    if (rCfg.ok) {
      const cfg = await rCfg.json();
      if (cfg.volume?.speakers_max   != null) VOLUME_MAX_SPEAKERS   = cfg.volume.speakers_max;
      if (cfg.volume?.headphones_max != null) VOLUME_MAX_HEADPHONES = cfg.volume.headphones_max;
    }
    // Construire STATIONS depuis data.json (radios gérées par l'admin)
    if (Array.isArray(DATA.radios) && DATA.radios.length > 0) {
      STATIONS.fr = DATA.radios.filter(r => (r.lang || r.langue || 'fr') === 'fr');
      STATIONS.es = DATA.radios.filter(r => (r.lang || r.langue || 'fr') === 'es');
    }
    checkResumePrompt();
  } catch(e) { console.error('Impossible de charger data.json', e); }
}

function findEpisodeByAudio(audioPath) {
  if (!DATA || !audioPath) return null;
  for (const podcast of DATA.podcasts || []) {
    const items = getDisplayItems(podcast);
    const idx = items.findIndex(ch => ch.audio === audioPath);
    if (idx >= 0) return { podcast, chapter: items[idx], idx };
  }
  return null;
}

function clearResumePrompt() {
  pendingResumeTarget = null;
  el('resume-prompt').classList.add('hidden');
  fetch('/index.php?action=clear_battery_resume').catch(() => {});
}

async function checkResumePrompt() {
  if (resumePromptLoaded || !DATA) return;
  resumePromptLoaded = true;
  try {
    const response = await fetch('/index.php?action=battery_resume', { cache: 'no-store' });
    const session = await response.json();
    if (!session || session.shutdown_reason !== 'battery_critical' || !session.mpd_file) return;
    const target = findEpisodeByAudio(session.mpd_file);
    if (!target) return;
    pendingResumeTarget = { ...target, session };
    el('resume-text').textContent = `Reprendre ${target.chapter.titre} là où tu t'es arrêté ?`;
    el('resume-prompt').classList.remove('hidden');
  } catch (_) {}
}

async function loadParentalConfig() {
  try {
    const r = await fetch('/lecteur/radio.php?action=parental_status');
    parentalCfg = await r.json();
  } catch (_) {
    parentalCfg = { schedule_enabled: false, lang_enabled: false, schedule: {}, languages: ['fr', 'es'] };
  }
  applyParentalRestrictions();
  applySleepConfig(parentalCfg);
  // TICKET-073 : jouer le chime meme si le touch est arrive avant la fin du fetch
  if (parentalCfg.chime_enabled !== false && !chimeAlreadyPlayed) {
    const vol = (parentalCfg.chime_volume ?? 15) / 100;
    if (pendingChimeTouch) {
      // Touch deja arrive -> jouer immediatement
      chimeAlreadyPlayed = true;
      playStartupChime(vol);
    } else {
      // Touch pas encore arrive -> attendre le prochain
      const chimeOnFirstTouch = () => {
        if (!chimeAlreadyPlayed) {
          chimeAlreadyPlayed = true;
          playStartupChime(vol);
        }
      };
      document.addEventListener('touchstart', chimeOnFirstTouch, { once: true });
    }
  }
}

function isNowAllowed() {
  if (!parentalCfg || !parentalCfg.schedule_enabled) return true;
  const now  = new Date();
  const dow  = String(now.getDay());
  const hour = now.getHours();
  const slots = parentalCfg.schedule?.[dow] || [];
  return slots.some(s => {
    const [h0, h1] = String(s).split('-').map(Number);
    return hour >= h0 && hour < h1;
  });
}

function isLangAllowed(lang) {
  if (!parentalCfg || !parentalCfg.lang_enabled) return true;
  return (parentalCfg.languages || ['fr', 'es']).includes(String(lang || 'fr').toLowerCase());
}

function applyParentalRestrictions() {
  const frAllowed = isLangAllowed('fr');
  const esAllowed = isLangAllowed('es');

  // Visuel : grise le drapeau bloqué
  el('btn-fr').classList.toggle('lang-locked', !frAllowed);
  el('btn-es').classList.toggle('lang-locked', !esAllowed);

  // Si la langue active est maintenant bloquée → retour accueil immédiat
  if (selectedLang === 'fr' && !frAllowed) {
    endTracking();
    show('home');
  } else if (selectedLang === 'es' && !esAllowed) {
    endTracking();
    show('home');
  }
}

async function sendRadio(action, params = {}) {
  const url = new URL('radio.php', window.location.href);
  url.searchParams.set('action', action);
  Object.entries(params).forEach(([k, v]) => url.searchParams.set(k, v));
  const r = await fetch(url.toString(), { cache: 'no-store' });
  return r.text();
}

function parseMpd(raw) {
  const s = {};
  (raw || '').split('\n').forEach(l => {
    const i = l.indexOf(': ');
    if (i > -1) s[l.slice(0,i)] = l.slice(i+2).trim();
  });
  return s;
}

async function refreshStatus() {
  try {
    const raw    = await sendRadio('status');
    const status = parseMpd(raw);
    const state  = status.state || 'stop';
    const elapsed  = parseFloat(status.elapsed  || 0);
    lastElapsed = elapsed;
    const duration = parseFloat(status.duration || 0);

    // Auto-next : épisode terminé (play → stop, pas pause)
    if (lastMpdState === 'play' && state === 'stop' && currentPodcast && currentIdx >= 0) {
      const items = getDisplayItems(currentPodcast);
      if (currentIdx < items.length - 1) {
        if (!isNowAllowed()) { show('home'); return; }
        lastMpdState = state;
        playTrack(currentIdx + 1);
        return;
      }
    }
    lastMpdState = state;

    const playing = state === 'play';
    if (playing && trackingId && (++trackingPollCount % 20 === 0)) {
      fetch(`/tracking.php?action=progress&id=${trackingId}&listened_s=${Math.round(elapsed)}`).catch(() => {});
    }
    el('btn-pp').textContent       = playing ? '⏸' : '▶';
    el('ov-icon').textContent      = playing ? '⏸' : '▶';
    el('mini-btn-pp').textContent  = playing ? '⏸' : '▶';
    el('art-overlay').classList.toggle('show', !playing);

    if (duration > 0) {
      currentDuration = duration;
      el('prog-fill').style.width = Math.min(100, elapsed / duration * 100) + '%';
      el('t-elapsed').textContent = fmtDur(elapsed);
      el('t-total').textContent   = fmtDur(duration);
    }

    // Volume bar (MPD → IHM)
    const mpdVol = parseInt(status.volume || 0, 10);
    currentVolume = mpdToIhm(mpdVol);
    document.querySelectorAll('.vol-fill').forEach(node => {
      node.style.width = Math.min(100, currentVolume) + '%';
    });
    document.querySelectorAll('.vol-percent').forEach(node => {
      node.textContent = currentVolume + '%';
    });
    document.querySelectorAll('.btn-vol-up').forEach(node => {
      const atMax = currentVolume >= 100;
      node.style.opacity = atMax ? '0.3' : '1';
      node.style.pointerEvents = atMax ? 'none' : '';
    });

    // Persist progress
    if (currentPodcast && currentIdx >= 0) {
      const items = getDisplayItems(currentPodcast);
      const ch = items[currentIdx];
      if (ch) {
        localStorage.setItem('hech_prog', JSON.stringify({
          podcastId: currentPodcast.id, chapterId: ch.id, position: elapsed,
        }));
      }
    }
  } catch(_) {}
}

    row.innerHTML = `

    list.appendChild(row);

}

function openRadioPlayer(st) {
  currentStation = st;
  currentPodcast = null;   // empêche l'auto-next pendant le clear MPD (TICKET-072 symétrique)
  currentIdx = -1;
  sendRadio('play', { url: st.url });
  startRadioTracking(st);
  // Station image (with fallback handled via onerror in HTML)
  const img = el('rp-art');
  img.style.display = 'block';
  el('rp-art-fallback').style.display = 'none';
  img.src = st.image || '';
  img.alt = st.name;
  el('rp-name').textContent = st.name;
  el('rp-desc').textContent = st.desc;
  el('rp-btn-pp').textContent = '⏸';
  show('radio-player');
  refreshStatus();
}

function updateVolumeBars(ihmPct) {
  document.querySelectorAll('.vol-fill').forEach(node => {
    node.style.width = Math.min(100, ihmPct) + '%';
  });
  document.querySelectorAll('.vol-percent').forEach(node => {
    node.textContent = ihmPct + '%';
  });
  document.querySelectorAll('.btn-vol-up').forEach(node => {
    const atMax = ihmPct >= 100;
    node.style.opacity = atMax ? '0.3' : '1';
    node.style.pointerEvents = atMax ? 'none' : '';
  });
}

async function setVolume(ihmPct) {
  const bounded = Math.max(0, Math.min(100, ihmPct));
  await sendRadio('setvol', { vol: ihmToMpd(bounded) });
  currentVolume = bounded;
  updateVolumeBars(bounded);
  refreshStatus();
}

async function seekCurrent(seconds) {
  await sendRadio('seekcur', { time: seconds });
  refreshStatus();
}

function openPodcast(id) {
  if (!DATA) return;
  currentPodcast = DATA.podcasts.find(p => p.id === id);
  if (!currentPodcast) return;
  el('ch-title').textContent = currentPodcast.titre;
  renderChapters();
  show('chapters');
}

function renderChapters() {
  const list  = el('ep-list');
  list.innerHTML = '';
  const displayItems = getDisplayItems(currentPodcast);
  if (!displayItems.length) {
    list.innerHTML = '<div style="padding:12px;color:var(--muted)">Aucun épisode disponible.</div>';
    return;
  }
  displayItems.forEach((ch, idx) => {
    const row = document.createElement('div');
    row.className = 'ep-row';
    const fallback = currentPodcast.image || '';
    row.innerHTML = `
      <img class="ep-thumb" src="${ch.image || fallback}" onerror="this.onerror=null;this.src='${fallback}'" alt="" loading="lazy" draggable="false">
      <div class="ep-meta">
        <div class="ep-titre">${ch.titre}</div>
        <div class="ep-duree">${fmtDur(ch.duree)}</div>
      </div>`;
    row.addEventListener('click', () => playTrack(idx));
    list.appendChild(row);
  });
}

// ═══════════════════════════════════════
// SCREEN 4 — PLAYER
// ═══════════════════════════════════════
async function playTrack(idx) {
  if (!isNowAllowed()) {
    show('home');
    return;
  }
  const lang = (currentPodcast?.langue || currentPodcast?.lang || currentPodcast?.language || 'fr').toLowerCase();
  if (!isLangAllowed(lang)) {
    show('home');
    return;
  }
  if (!currentPodcast) return;
  const displayItems = getDisplayItems(currentPodcast);
  const ch = displayItems[idx];
  if (!ch) return;
  currentStation = null;  // TICKET-072 : efface la station radio pour le mini-lecteur
  currentIdx = idx;

  el('ctrl-pod').textContent        = currentPodcast.titre;
  el('ctrl-ep').textContent         = ch.titre;
  el('player-back-lbl').textContent = currentPodcast.titre;
  el('player-art').src              = currentPodcast.image;
  el('player-art').alt              = currentPodcast.titre;
  el('prog-fill').style.width       = '0%';
  el('t-elapsed').textContent       = '0:00';
  el('t-total').textContent         = fmtDur(ch.duree);
  el('btn-pp').textContent          = '⏸';
  el('art-overlay').classList.remove('show');

  // Badge numéro d'épisode (extrait du titre ou position dans la série)
  const epMatch = ch.titre && ch.titre.match(/\b(\d+)\b/);
  const epNum = epMatch ? epMatch[1] : String(idx + 1);
  el('ep-num-badge').textContent = epNum;

  await sendRadio('playfile', { path: ch.audio });
  startTracking(currentPodcast, ch, ch.duree || 0);

  // Restore saved position if same episode
  try {
    const saved = JSON.parse(localStorage.getItem('hech_prog') || 'null');
    if (saved && saved.podcastId === currentPodcast.id &&
        saved.chapterId === ch.id && saved.position > 5) {
      const statusRaw = await sendRadio('status');
      const songid    = parseMpd(statusRaw).songid;
      if (songid) await sendRadio('seekid', { id: songid, time: Math.floor(saved.position) });
    }
  } catch(_) {}

  show('player');
  startPoll();
  refreshStatus();
}

function startPoll() {
  stopPoll();
  pollTimer = setInterval(refreshStatus, 3000);
  if (parentalTimer) clearInterval(parentalTimer);
  parentalTimer = setInterval(checkParentalTime, 30000);
}
function stopPoll() {
  if (pollTimer) { clearInterval(pollTimer); pollTimer = null; }
  if (parentalTimer) { clearInterval(parentalTimer); parentalTimer = null; }
}

async function checkParentalTime() {
  await loadParentalConfig();
  if (!isNowAllowed()) {
    if (currentPodcast && currentIdx >= 0) {
      const raw = await sendRadio('status').catch(() => '');
      const st = parseMpd(raw);
      if (st.state === 'stop' || st.state === 'pause') {
        show('home');
      }
    }
  }
}

// ─── Scroll JS universel (touch + souris + VNC, Chromium Pi) ────────────────
(function () {
  let scroller = null, sy = 0, st = 0, moved = false;
  document.addEventListener('pointerdown', e => {
    const s = e.target.closest('.s-body');
    if (!s) return;
    // Laisser les barres de scrubbing gérer elles-mêmes
    if (e.target.closest('.prog-bg, .vol-bar-wrap')) return;
    scroller = s; sy = e.clientY; st = s.scrollTop; moved = false;
  }, true);
  document.addEventListener('pointermove', e => {
    if (!scroller) return;
    const dy = sy - e.clientY;
    if (Math.abs(dy) > 4) { moved = true; e.preventDefault(); scroller.scrollTop = st + dy; }
  });
  document.addEventListener('pointerup',     () => { scroller = null; });
  document.addEventListener('pointercancel', () => { scroller = null; });
  // Annuler le click sur une carte si c'était un scroll
  document.addEventListener('click', e => {
    if (moved) { e.stopPropagation(); e.preventDefault(); moved = false; }
  }, true);
})();

// ─── Pointer Events scrubbing (touch + souris, sans conflit scroll) ──────────
function makeScrubBar(barEl, onPct, refEl) {
  const ref = refEl || barEl;
  function pct(e) {
    const r = ref.getBoundingClientRect();
    return Math.max(0, Math.min(1, (e.clientX - r.left) / r.width));
  }
  barEl.addEventListener('pointerdown', e => {
    barEl.setPointerCapture(e.pointerId);
    onPct(pct(e));
  });
  barEl.addEventListener('pointermove', e => {
    if (e.buttons === 0) return;
    onPct(pct(e));
  });
}
makeScrubBar(el('player-prog-bar'), pct => {
  if (!currentDuration) return;
  seekCurrent(Math.round(pct * currentDuration));
});
const pvb = el('player-vol-bar');
makeScrubBar(pvb, pct => setVolume(Math.round(pct * 100)), pvb.querySelector('.vol-bar-bg'));

// ═══════════════════════════════════════
// SON DE DÉMARRAGE (Web Audio API)
// ═══════════════════════════════════════
function playStartupChime(volume = 0.12) {
  if (volume <= 0) return;
  try {
    const ctx = new (window.AudioContext || window.webkitAudioContext)();

    // Reverb artificiel : delay + feedback léger
    const delay = ctx.createDelay(0.4);
    delay.delayTime.value = 0.18;
    const feedback = ctx.createGain();
    feedback.gain.value = 0.28;
    delay.connect(feedback);
    feedback.connect(delay);

    // Master envelope : attaque douce, longue queue
    const master = ctx.createGain();
    master.gain.setValueAtTime(0, ctx.currentTime);
    master.gain.linearRampToValueAtTime(volume, ctx.currentTime + 0.12);
    master.gain.setValueAtTime(volume, ctx.currentTime + 0.6);
    master.gain.exponentialRampToValueAtTime(0.0001, ctx.currentTime + 3.2);
    master.connect(delay);
    delay.connect(ctx.destination);
    master.connect(ctx.destination);

    // Accord chaud : C4 – G4 – E5 – C5 (quinte + tierce, ouvert et spatial)
    const NOTES = [
      { freq: 261.63, delay: 0.00, gain: 0.55 },  // C4 — fondamentale
      { freq: 392.00, delay: 0.06, gain: 0.40 },  // G4 — quinte
      { freq: 523.25, delay: 0.12, gain: 0.30 },  // C5 — octave
      { freq: 659.25, delay: 0.18, gain: 0.20 },  // E5 — tierce haute
    ];
    NOTES.forEach(({ freq, delay: d, gain }) => {
      const osc = ctx.createOscillator();
      const g   = ctx.createGain();
      osc.type = 'sine';
      osc.frequency.value = freq;
      osc.detune.value = (Math.random() - 0.5) * 4; // légère chaleur
      g.gain.value = gain;
      osc.connect(g);
      g.connect(master);
      osc.start(ctx.currentTime + d);
      osc.stop(ctx.currentTime + 3.5);
    });
  } catch (_) {}
}

// ÉCRAN DE VEILLE
// ═══════════════════════════════════════
let SLEEP_DELAY  = 15000;  // mis à jour depuis la config
let SLEEP_MODE   = 'retro'; // 'classic'|'classic_clock'|'retro'|'retro_clock'|'modern'|'modern_clock'
let sleepTimer = null;
const getSleepOverlay = () => document.getElementById('sleep-overlay');
const getSleepClock   = () => document.getElementById('sleep-clock');
const getSleepBrand   = () => document.getElementById('sleep-brand');

function normalizeSleepMode(m) {
  if (m === 'both')  return 'retro_clock';
  if (m === 'brand') return 'retro';
  if (m === 'clock') return 'retro_clock';
  return m || 'retro';
}

function applySleepConfig(cfg) {
  if (!cfg) return;
  const enabled = !!(cfg.sleep_enabled ?? true);
  SLEEP_DELAY = Number(cfg.sleep_delay ?? 15) * 1000;
  SLEEP_MODE  = normalizeSleepMode(cfg.sleep_mode);
  const hasClock = SLEEP_MODE.endsWith('_clock');
  const theme = SLEEP_MODE.replace('_clock', ''); // 'classic'|'retro'|'modern'
  const overlay = getSleepOverlay();
  overlay.classList.remove('classic', 'retro', 'modern');
  overlay.classList.add(theme);
  // Gradient gold/chrome sur le logo via classe utilitaire
  const brand = getSleepBrand();
  brand.className = theme === 'retro' ? 'gv-gold' : theme === 'modern' ? 'gv-chrome' : '';
  getSleepClock().style.display = hasClock ? '' : 'none';
  if (!enabled) {
    clearTimeout(sleepTimer);
    overlay.classList.remove('active');
  } else {
    resetSleepTimer();
  }
}

function updateSleepClock() {
  if (!getSleepOverlay().classList.contains('active')) return;
  if (!SLEEP_MODE.endsWith('_clock')) return;
  const now = new Date();
  const h   = String(now.getHours()).padStart(2, '0');
  const m   = String(now.getMinutes()).padStart(2, '0');
  // Le span hérite du gradient background-clip du parent #sleep-clock
  getSleepClock().innerHTML = '<span class="clock-time">' + h + ':' + m + '</span>';
}

function activateSleep() {
  getSleepOverlay().classList.add('active');
  updateSleepClock();
}

function wakeUp(e) {
  if (getSleepOverlay().classList.contains('active')) {
    e.stopPropagation();
    e.preventDefault();
    getSleepOverlay().classList.remove('active');
  }
  resetSleepTimer();
}

function resetSleepTimer() {
  clearTimeout(sleepTimer);
  sleepTimer = setTimeout(activateSleep, SLEEP_DELAY);
}

// Toute interaction RÉELLE réinitialise le timer
// ⚠ pointermove exclut : sur Pi kiosk, le curseur fantôme génère des events en permanence
['pointerdown', 'touchstart', 'click', 'keydown'].forEach(evt =>
  document.addEventListener(evt, wakeUp, { capture: true, passive: false })
);

// Horloge de veille mise à jour chaque minute
setInterval(updateSleepClock, 10000);

// Démarrage du timer
resetSleepTimer();
