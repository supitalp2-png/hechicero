<!doctype html>
<html lang="fr">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <title>Hechicero</title>
  <link rel="preload" href="../fonts/GreatVibes-Regular.woff2" as="font" type="font/woff2" crossorigin>
  <style>
    /* ── VARIABLES ── */
    :root {
      --bg: #0d1117;
      --surface: #0f1e2e;
      --border: #1e3a5f;
      --accent: #00c8ff;
      --accent-radio: #c8a050;
      --text: #e6eef6;
      --muted: #7fa8c8;
      --green: #3dba6a;
      --sb-h: 32px;
    }

    /* ── RESET ── */
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
    html, body {
      width: 100%; height: 100%;
      font-family: system-ui, -apple-system, "Segoe UI", Roboto, "Helvetica Neue", Arial, sans-serif;
      background: var(--bg);
      color: var(--text);
      overflow: hidden;
    }
    button { cursor: pointer; font-family: inherit; border: none; background: none; color: inherit; }
    img { -webkit-user-drag: none; user-drag: none; user-select: none; }
    .hidden { display: none !important; }

    /* ── STATUS BAR ── */
    #statusbar {
      position: fixed; top: 0; left: 0; right: 0;
      height: var(--sb-h);
      background: #080d13;
      display: flex; align-items: center; justify-content: space-between;
      padding: 0 14px;
      font-size: 0.78rem; color: var(--muted);
      z-index: 100;
    }
    #sb-time    { font-size: 20px; font-weight: 600; }
    #bat-display { font-size: 18px; }
    #sb-battery { display: flex; align-items: center; gap: 5px; }

    /* ── APP CONTAINER ── */
    #app { position: fixed; inset: 0; }

    /* ── SCREENS ── */
    .screen {
      position: absolute; inset: 0;
      display: flex; flex-direction: column;
      padding-top: var(--sb-h);
      box-sizing: border-box;
    }

    /* ── BACK BUTTON ── */
    .btn-back {
      display: inline-flex; align-items: center; gap: 4px;
      height: 52px; padding: 0 18px 0 6px;
      border-radius: 26px;
      background: var(--surface); border: 1.5px solid var(--border);
      color: var(--text); font-size: 1rem;
      flex-shrink: 0;
    }
    .btn-back .chev {
      width: 28px; height: 28px; border-radius: 50%;
      display: flex; align-items: center; justify-content: center;
      color: var(--accent); font-size: 1.15rem; font-weight: 700;
    }

    /* ── SCREEN HEADER ── */
    .s-header {
      display: flex; align-items: center; gap: 10px;
      padding: 10px 14px; flex-shrink: 0;
    }
    .s-header .s-title {
      font-size: 1.1rem; font-weight: 600;
      white-space: nowrap; overflow: hidden; text-overflow: ellipsis;
      flex: 1;
    }

    /* ── SCROLL AREA ── */
    .s-body {
      flex: 1; overflow-y: scroll; overflow-x: hidden; padding: 6px 14px 14px;
      touch-action: none; /* scroll 100% géré par JS Pointer Events */
      scrollbar-width: none;
    }
    .s-body::-webkit-scrollbar { display: none; }
    body.has-mini .s-body { padding-bottom: 84px; }

    /* ══════════════════════════════ */
    /* SCREEN 1 — HOME               */
    /* ══════════════════════════════ */
    #home {
      align-items: center; justify-content: center; gap: 36px;
    }
    .home-brand {
      font-family: 'Great Vibes', 'Palatino Linotype', Palatino, serif;
      font-size: clamp(48px, 10vw, 90px); font-weight: 400;
      background: linear-gradient(180deg,
        #7a4e08 0%,#c88820 12%,#f0cc58 26%,#fff098 40%,
        #f0cc50 54%,#c08018 65%,#eec850 76%,#d09828 88%,#7a4e08 100%);
      -webkit-background-clip: text; -webkit-text-fill-color: transparent; background-clip: text;
    }
    .flags-row { display: flex; gap: 28px; align-items: center; justify-content: center; }
    .flag-btn {
      display: flex; flex-direction: column; align-items: center; gap: 12px;
      min-width: 200px; min-height: 140px;
      background: var(--surface); border: 2px solid var(--border);
      border-radius: 20px; padding: 18px 20px;
      font-size: 18px; font-weight: 600;
      transition: border-color 150ms, transform 120ms;
    }
    .flag-btn:active { transform: scale(0.96); }
    .flag-btn:hover  { border-color: var(--accent); }
    .lang-locked { opacity: 0.35; pointer-events: none; filter: grayscale(1); }
    /* ── Écran de veille ── */
    @font-face {
      font-family: 'Great Vibes';
      src: url('../fonts/GreatVibes-Regular.ttf') format('truetype');
      font-weight: normal; font-style: normal; font-display: block;
    }
    /* Gradient or réutilisé */
    .gv-gold {
      background: linear-gradient(180deg,
        #7a4e08 0%,#c88820 12%,#f0cc58 26%,#fff098 40%,
        #f0cc50 54%,#c08018 65%,#eec850 76%,#d09828 88%,#7a4e08 100%);
      -webkit-background-clip: text; -webkit-text-fill-color: transparent; background-clip: text;
    }
    .gv-chrome {
      background: linear-gradient(180deg,
        #383838 0%,#7a7a7a 12%,#d4d4d4 25%,#ffffff 38%,
        #d0d0d0 52%,#888888 65%,#e4e4e4 76%,#b8b8b8 88%,#484848 100%);
      -webkit-background-clip: text; -webkit-text-fill-color: transparent; background-clip: text;
    }
    #sleep-overlay {
      display: none; position: fixed; inset: 0; z-index: 9999;
      align-items: center; justify-content: center; cursor: pointer;
      background-image: repeating-linear-gradient(
        0deg, transparent, transparent 2px, rgba(0,0,0,.07) 2px, rgba(0,0,0,.07) 3px);
    }
    #sleep-overlay.active { display: flex; }
    /* Thème Rétro Or */
    #sleep-overlay.retro  { background-color: #070503; }
    /* Thème Chrome */
    #sleep-overlay.modern { background-color: #040608; }
    /* Thème Classique */
    #sleep-overlay.classic { background-color: #050810; }
    /* Halo radial */
    #sleep-glow {
      position: absolute; inset: 0; pointer-events: none;
    }
    #sleep-overlay.retro  #sleep-glow { background: radial-gradient(ellipse 55% 45% at 50% 50%, rgba(110,65,8,.28), transparent 65%); }
    #sleep-overlay.modern #sleep-glow { background: radial-gradient(ellipse 55% 45% at 50% 50%, rgba(30,45,80,.26), transparent 65%); }
    #sleep-overlay.classic #sleep-glow { background: radial-gradient(ellipse 55% 45% at 50% 50%, rgba(20,30,60,.22), transparent 65%); }
    /* Cadre */
    #sleep-frame {
      position: absolute; inset: 5%; pointer-events: none;
    }
    #sleep-overlay.retro  #sleep-frame { border: 1px solid rgba(140,95,18,.40); }
    #sleep-overlay.modern #sleep-frame { border: 1px solid rgba(90,100,130,.36); }
    #sleep-overlay.classic #sleep-frame { border: 1px solid rgba(255,255,255,.08); }
    /* Centre */
    #sleep-center {
      display: grid; place-items: center; position: relative; z-index: 2;
    }
    /* Logo glow (couche floue derrière) */
    #sleep-brand-glow {
      grid-area: 1/1;
      font-family: 'Great Vibes', 'Palatino Linotype', Palatino, serif;
      font-size: clamp(80px, 13vw, 145px); font-weight: 400; white-space: nowrap;
      filter: blur(22px); user-select: none; pointer-events: none;
    }
    #sleep-overlay.retro  #sleep-brand-glow { color: rgba(210,140,12,.35); }
    #sleep-overlay.modern #sleep-brand-glow { color: rgba(150,170,220,.25); }
    #sleep-overlay.classic #sleep-brand-glow { color: rgba(200,210,255,.12); }
    /* Logo net */
    #sleep-brand {
      grid-area: 1/1;
      font-family: 'Great Vibes', 'Palatino Linotype', Palatino, serif;
      font-size: clamp(80px, 13vw, 145px); font-weight: 400; white-space: nowrap;
    }
    #sleep-overlay.classic #sleep-brand {
      font-family: inherit; font-size: clamp(24px, 5vw, 48px);
      letter-spacing: 0.55em; color: rgba(255,255,255,0.90);
      text-transform: uppercase; font-weight: 200;
      -webkit-text-fill-color: unset; background: none;
    }
    /* Ligne décorative sous le logo */
    #sleep-rule {
      position: absolute; z-index: 2;
      top: calc(50% + clamp(50px, 8vw, 88px));
      left: 50%; transform: translateX(-50%);
      width: 280px; height: 1px; pointer-events: none;
    }
    #sleep-overlay.retro  #sleep-rule { background: linear-gradient(90deg, transparent, rgba(200,136,32,.6), transparent); }
    #sleep-overlay.modern #sleep-rule { background: linear-gradient(90deg, transparent, rgba(140,160,210,.5), transparent); }
    #sleep-overlay.classic #sleep-rule { background: linear-gradient(90deg, transparent, rgba(255,255,255,.2), transparent); }
    /* Horloge */
    #sleep-clock {
      position: absolute; z-index: 2;
      top: calc(50% + clamp(70px, 11vw, 120px));
      left: 50%; transform: translateX(-50%);
      white-space: nowrap;
    }
    #sleep-clock .clock-time {
      font-family: 'Great Vibes', 'Palatino Linotype', Palatino, serif;
      font-size: clamp(36px, 6vw, 72px); font-weight: 400;
    }
    #sleep-overlay.classic #sleep-clock .clock-time {
      font-family: inherit; font-size: clamp(20px, 4vw, 42px);
      letter-spacing: 0.3em; color: rgba(255,255,255,0.65);
      text-transform: uppercase; font-weight: 200;
      -webkit-text-fill-color: unset; background: none;
    }

    .ep-num-badge {
      position: absolute; bottom: 8px; right: 10px;
      background: rgba(0,0,0,0.52); color: rgba(255,255,255,0.78);
      font-size: 28px; font-weight: 700; padding: 2px 10px;
      border-radius: 6px; letter-spacing: -1px;
      pointer-events: none; backdrop-filter: blur(3px);
    }
    /* Favoris (TICKET-046) — cœur qui se colle sur la jaquette/icône de
       l'épisode mis en favori. Caché par défaut, affiché via .is-fav posé
       sur le conteneur (.ep-thumb-wrap ou #art-box, tous deux déjà en
       position:relative). Pas de son, confirmé par Thomas. Le petit "pop"
       (favPop) ne rejoue que quand .is-fav passe de absent à présent — un
       simple classList.toggle() qui ne change rien (déjà favori) ne remet
       pas l'animation à zéro, donc pas de à-coup au polling périodique
       (fetchFavoris, toutes les 4s).*/
    .fav-heart {
      position: absolute; top: 8px; left: 8px;
      width: 46px; height: 46px; border-radius: 50%;
      background: rgba(0,0,0,0.45); backdrop-filter: blur(3px);
      display: none; align-items: center; justify-content: center;
      font-size: 26px; line-height: 1; color: #ff5577;
      text-shadow: 0 0 8px rgba(255,85,119,0.85);
      pointer-events: none;
    }
    .is-fav .fav-heart {
      display: flex;
      animation: favPop 600ms cubic-bezier(.34,1.56,.64,1);
    }
    #art-box .fav-heart { width: 68px; height: 68px; font-size: 38px; top: 12px; left: 12px; }
    @keyframes favPop {
      0%   { transform: scale(0) rotate(-20deg);  opacity: 0; }
      45%  { transform: scale(1.35) rotate(10deg); opacity: 1; }
      70%  { transform: scale(0.88) rotate(-5deg); }
      100% { transform: scale(1) rotate(0deg); }
    }
    .flag-svg { width: 120px; height: 80px; border-radius: 8px; overflow: hidden; }
    .flag-svg svg { width: 100%; height: 100%; display: block; }

    /* ══════════════════════════════ */
    /* SCREEN — CHAMBRE (TICKET-112)  */
    /* Domotique lampe + volet. Tout est scopé sous #chambre / .ch-* pour ne  */
    /* jamais collisionner avec les IDs courts du prototype chambre.html.     */
    /* Accent cyan dédié (--ch-cyan), distinct de l'accent doré de l'app.     */
    /* ══════════════════════════════ */
    #chambre { --ch-cyan: #00c8ff; }
    /* La grille tient dans la hauteur visible au-dessus du mini-lecteur, sans
       scroll (UX enfant) : cartes centrées, gros éléments tactiles calibrés
       pour ~460px de hauteur utile (1024×600 − statusbar − mini-lecteur). */
    #chambre .s-body { display: flex; align-items: center; }
    .ch-status { font-size: 0.95rem; color: var(--muted); flex-shrink: 0; }
    .ch-status.off { color: #ff6b6b; }
    .ch-wrap {
      display: flex; gap: 22px; flex-wrap: wrap; align-items: stretch;
      justify-content: center; width: 100%; padding: 4px;
    }
    .ch-card {
      flex: 1 1 340px; max-width: 470px;
      background: var(--surface); border: 1.5px solid var(--border);
      border-radius: 18px; padding: 18px 20px;
      /* Colonne : en-tête en haut, contenu centré — garantit deux cartes de
         même taille et un rendu équilibré (retour Thomas 2026-07-24). */
      display: flex; flex-direction: column;
    }
    .ch-head {
      display: flex; align-items: center; gap: 12px; margin-bottom: 10px;
    }
    .ch-row { flex: 1; }
    .ch-title { font-size: 1.5rem; font-weight: 600; margin-right: auto; }
    .ch-val { font-size: 2.4rem; font-weight: 700; color: var(--ch-cyan); font-variant-numeric: tabular-nums; }
    .ch-badge {
      font-size: 0.85rem; padding: 4px 14px; border-radius: 20px;
      background: rgba(0,200,255,.15); color: var(--ch-cyan);
      visibility: hidden; white-space: nowrap;
    }
    .ch-row { display: flex; gap: 18px; align-items: center; justify-content: center; }
    .ch-col { display: flex; flex-direction: column; align-items: center; gap: 10px; }
    .ch-tap { cursor: pointer; -webkit-tap-highlight-color: transparent; }
    .ch-tap:active { transform: scale(0.94); }
    /* Icônes tactiles agrandies (cibles généreuses pour un enfant) */
    .ch-icon-bulb  { width: 150px; height: auto; display: block; }
    .ch-icon-volet { width: 178px; height: auto; display: block; }
    .ch-hint { font-size: 0.95rem; color: var(--muted); }
    .ch-end  { font-size: 0.95rem; color: var(--muted); }
    /* Repères soleil du curseur lampe (grand soleil en haut = fort, petit en
       bas = doux), teinte chaude façon appli Legrand. */
    .ch-sun { display: block; color: #e0b878; }
    .ch-sun-lg { width: 36px; height: 36px; }
    .ch-sun-sm { width: 24px; height: 24px; color: #b89968; }
    /* Curseurs verticaux épais à gros pouce rond — faciles à attraper au doigt,
       dans l'esprit des grosses commandes du lecteur. Rotation -90° = vertical
       (haut = 100 %, bas = 0 %). */
    .ch-slider-col { justify-content: center; gap: 8px; }
    .ch-vbox { width: 64px; height: 186px; display: flex; align-items: center; justify-content: center; }
    .ch-vbox input {
      -webkit-appearance: none; appearance: none;
      width: 186px; height: 14px; margin: 0; border-radius: 8px;
      background: var(--border); transform: rotate(-90deg); cursor: pointer;
    }
    .ch-vbox input::-webkit-slider-thumb {
      -webkit-appearance: none; appearance: none;
      width: 46px; height: 46px; border-radius: 50%;
      background: var(--ch-cyan); border: 3px solid #0c1014;
      box-shadow: 0 2px 8px rgba(0,0,0,0.4);
    }
    .ch-vbox input::-moz-range-thumb {
      width: 46px; height: 46px; border: 3px solid #0c1014; border-radius: 50%;
      background: var(--ch-cyan);
    }
    /* Toast Chambre indisponible (TICKET-112) */
    .ch-toast {
      position: fixed; top: 50%; left: 50%; transform: translate(-50%, -50%);
      z-index: 600; padding: 20px 30px; border-radius: 18px;
      background: rgba(15, 24, 34, 0.97); border: 1.5px solid #00c8ff;
      color: var(--text); font-size: 1.4rem; font-weight: 600;
      box-shadow: 0 18px 60px rgba(0,0,0,0.45); backdrop-filter: blur(10px);
      text-align: center; pointer-events: none;
    }
    .ch-toast.hidden { display: none; }

    /* ══════════════════════════════ */
    /* SCREEN 2 — PODCASTS GRID      */
    /* ══════════════════════════════ */
    #pod-grid {
      display: grid;
      grid-template-columns: repeat(auto-fill, minmax(180px, 1fr));
      gap: 16px;
    }
    .pod-card {
      position: relative;
      background: var(--surface); border: 1.5px solid var(--border);
      border-radius: 16px; overflow: hidden; cursor: pointer;
      transition: border-color 130ms, transform 130ms;
    }
    .pod-card:active { transform: scale(0.97); }
    .pod-card:hover  { border-color: var(--accent); }
    .pod-card img    { width: 100%; aspect-ratio: 1/1; object-fit: cover; display: block; }
    .pod-label       { padding: 10px 10px; font-size: 1.1rem; font-weight: 600; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }

    /* Webradio tile */
    .pod-card.webradio           { background: #1a1208; border-color: #3d2a08; }
    .pod-card.webradio:hover     { border-color: var(--accent-radio); }
    .pod-card.webradio .pod-label{ color: var(--accent-radio); }
    .webradio-art {
      width: 100%; aspect-ratio: 1/1;
      display: flex; align-items: center; justify-content: center;
      background: #120d04;
    }

    /* ══════════════════════════════ */
    /* MODE NOËL (TICKET-079)        */
    /* Actif décembre uniquement (getMonth()===11), override ?noel=1/0.   */
    /* Zéro dépendance réseau/CDN — tout est inline (CSS/SVG/JS).         */
    /* ══════════════════════════════ */
    /* Neige : overlay global (fixed), visible sur tous les écrans y compris l'écran de veille
       (z-index au-dessus de #sleep-overlay, 9999) */
    #noel-snow {
      position: fixed; inset: 0; overflow: hidden;
      pointer-events: none; z-index: 10050;
    }
    .noel-flake {
      position: absolute; top: -24px;
      color: #eef6ff; opacity: 0.85; line-height: 1;
      text-shadow: 0 0 4px rgba(180,220,255,0.6);
      animation-name: noel-fall;
      animation-timing-function: linear;
      animation-iteration-count: infinite;
      will-change: transform;
    }
    @keyframes noel-fall {
      from { transform: translate3d(0, -24px, 0); }
      to   { transform: translate3d(var(--drift, 0px), 110vh, 0); }
    }
    /* Bonnet de Noël — plus grand, franchement incliné (coin haut-gauche des jaquettes) */
    .noel-hat {
      position: absolute; top: 0; left: 0;
      width: 62px; height: 62px;
      transform: rotate(-42deg);
      transform-origin: 65% 65%;
      pointer-events: none; z-index: 2;
      filter: drop-shadow(0 2px 4px rgba(0,0,0,.55));
    }
    .noel-hat.noel-hat-sm { width: 46px; height: 46px; }
    /* Traîneau : rennes en tête (x haut, sens du déplacement), traîneau tiré derrière */
    #noel-sled {
      position: fixed; top: 8%; left: -340px;
      width: 320px; pointer-events: none; z-index: 9000;
      opacity: 0;
    }
    #noel-sled.noel-sled-run {
      animation: noel-sled-fly 10s linear;
    }
    @keyframes noel-sled-fly {
      0%   { opacity: 0; transform: translateX(0); }
      6%   { opacity: 1; }
      94%  { opacity: 1; }
      100% { opacity: 0; transform: translateX(calc(100vw + 340px)); }
    }
    /* Guirlande lumineuse — câble en chaînette (cosh) + ampoules clignotantes, en haut de tous
       les écrans y compris l'écran de veille (z-index au-dessus de #sleep-overlay, 9999) */
    #noel-garland {
      position: fixed; top: var(--sb-h); left: 0; right: 0;
      width: 100%; height: 34px;
      pointer-events: none; z-index: 10040;
    }
    .noel-bulb {
      filter: drop-shadow(0 0 3px currentColor) drop-shadow(0 0 6px currentColor);
      animation-name: noel-twinkle;
      animation-timing-function: ease-in-out;
      animation-iteration-count: infinite;
    }
    @keyframes noel-twinkle {
      0%, 100% { opacity: 0.4; }
      50%      { opacity: 1; }
    }

    /* ══════════════════════════════ */
    /* MODE ANNIVERSAIRE (TICKET-079bis) */
    /* Actif le 20 novembre uniquement (getMonth()===10 && getDate()===20),  */
    /* override ?anniv=1/0. Zéro dépendance réseau/CDN.                     */
    /* Réutilise la même courbe en chaînette que la guirlande de Noël       */
    /* (fonctions catenaryY/catenaryPoint, génériques).                     */
    /* ══════════════════════════════ */
    /* Confettis : overlay global, visible partout y compris l'écran de veille */
    #anniv-confetti {
      position: fixed; inset: 0; overflow: hidden;
      pointer-events: none; z-index: 10050;
    }
    .anniv-confetti-piece {
      position: absolute; top: -16px;
      opacity: 0.9; border-radius: 1px;
      animation-name: anniv-confetti-fall;
      animation-timing-function: linear;
      animation-iteration-count: infinite;
      will-change: transform;
    }
    @keyframes anniv-confetti-fall {
      from { transform: translate3d(0, -16px, 0) rotate(0deg); }
      to   { transform: translate3d(var(--drift, 0px), 110vh, 0) rotate(var(--spin, 360deg)); }
    }
    /* Chapeau de fête — même principe que le bonnet de Noël (coin incliné des jaquettes) */
    .anniv-hat {
      position: absolute; top: 0; left: 0;
      width: 62px; height: 62px;
      transform: rotate(-42deg);
      transform-origin: 65% 65%;
      pointer-events: none; z-index: 2;
      filter: drop-shadow(0 2px 4px rgba(0,0,0,.55));
    }
    .anniv-hat.anniv-hat-sm { width: 46px; height: 46px; }
    /* Banderole "Joyeux Anniversaire / Feliz Cumpleaños" — traverse l'écran de temps en
       temps, cachée pendant la veille (même logique que le traîneau de Noël) */
    #anniv-banner {
      position: fixed; top: 14%; left: -820px;
      width: max-content; white-space: nowrap;
      pointer-events: none; z-index: 9000;
      opacity: 0;
    }
    #anniv-banner.anniv-banner-run {
      animation: anniv-banner-fly 10s linear;
    }
    @keyframes anniv-banner-fly {
      0%   { opacity: 0; transform: translateX(0); }
      6%   { opacity: 1; }
      94%  { opacity: 1; }
      100% { opacity: 0; transform: translateX(calc(100vw + 820px)); }
    }
    .anniv-banner-ribbon {
      position: relative;
      background: linear-gradient(135deg, #8b2fa0, #c23fae 55%, #8b2fa0);
      border: 2px solid #f0cc58;
      border-radius: 10px;
      padding: 16px 40px;
      box-shadow: 0 8px 24px rgba(0,0,0,.45);
    }
    .anniv-banner-ribbon::before, .anniv-banner-ribbon::after {
      content: ''; position: absolute; top: 0; width: 0; height: 0;
      border-top: 26px solid transparent; border-bottom: 26px solid transparent;
    }
    .anniv-banner-ribbon::before { left: -20px; border-right: 20px solid #6f2380; }
    .anniv-banner-ribbon::after  { right: -20px; border-left: 20px solid #6f2380; }
    .anniv-banner-text {
      font-family: 'Great Vibes', 'Palatino Linotype', Palatino, serif;
      font-size: 46px; font-weight: 400; white-space: nowrap;
    }
    /* Guirlande de fanions — même câble en chaînette que la guirlande de Noël, avec des
       petits drapeaux triangulaires à la place des ampoules. overflow:visible car les
       fanions pendent sous la courbe et dépassent légèrement la hauteur du viewBox. */
    #anniv-garland {
      position: fixed; top: var(--sb-h); left: 0; right: 0;
      width: 100%; height: 34px; overflow: visible;
      pointer-events: none; z-index: 10040;
    }
    .anniv-flag {
      transform-box: fill-box; transform-origin: 50% 0%;
      animation-name: anniv-flag-sway;
      animation-timing-function: ease-in-out;
      animation-iteration-count: infinite;
    }
    @keyframes anniv-flag-sway {
      0%, 100% { transform: rotate(-5deg); }
      50%      { transform: rotate(5deg); }
    }

    /* ══════════════════════════════ */
    /* SCREEN 3a — RADIO CATALOG     */
    /* ══════════════════════════════ */
    .radio-list { display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 12px; width: 100%; box-sizing: border-box; }
    .radio-row {
      position: relative;
      display: flex; align-items: center; gap: 14px;
      background: var(--surface); border: 1.5px solid var(--border);
      border-radius: 14px; padding: 12px 14px;
      min-height: 80px; cursor: pointer;
      transition: border-color 120ms;
    }
    .radio-row .fav-heart { width: 26px; height: 26px; font-size: 15px; top: 4px; left: 4px; }
    .radio-row:hover { border-color: var(--accent-radio); }
    .radio-dot {
      width: 10px; height: 10px; border-radius: 50%;
      background: var(--green); flex-shrink: 0;
      animation: pulse 2s ease-in-out infinite;
    }
    @keyframes pulse {
      0%, 100% { opacity: 1; transform: scale(1); }
      50%       { opacity: 0.35; transform: scale(0.7); }
    }
    .radio-info      { flex: 1; min-width: 0; }
    .radio-name      { font-weight: 600; font-size: 1.1rem; }
    .radio-desc      { font-size: 1rem; color: var(--muted); margin-top: 2px; }
    .btn-play-radio  {
      width: 40px; height: 40px; border-radius: 50%;
      background: var(--accent); color: #000; font-size: 0.95rem;
      display: flex; align-items: center; justify-content: center;
      flex-shrink: 0; pointer-events: none;
    }

    /* ══════════════════════════════ */
    /* SCREEN 3b — CHAPTERS          */
    /* ══════════════════════════════ */
    .ep-list { display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 12px; width: 100%; box-sizing: border-box; }
    .ep-row {
      display: flex; align-items: stretch; gap: 0;
      background: var(--surface); border: 1.5px solid var(--border);
      border-radius: 16px; overflow: hidden; cursor: pointer;
      transition: border-color 130ms, transform 130ms;
      min-height: 143px;
    }
    .ep-row:active { transform: scale(0.97); }
    .ep-row:hover  { border-color: var(--accent); }
    /* Petit espace entre saisons (TICKET-104) — grid-column: 1/-1 pour occuper
       toute la largeur de la grille 2 colonnes, sinon la marge ne s'aligne pas
       proprement selon la colonne où tombe le changement de saison. */
    .ep-season-divider { grid-column: 1 / -1; height: 14px; }
    .ep-thumb-wrap { position: relative; flex-shrink: 0; }
    .ep-thumb      { width: 143px; min-width: 143px; height: 143px; object-fit: cover; display: block; flex-shrink: 0; }
    .ep-meta       { flex: 1; min-width: 0; padding: 12px 14px; display: flex; flex-direction: column; justify-content: center; }
    .ep-titre      { font-weight: 600; font-size: 1rem; overflow: hidden; display: -webkit-box; -webkit-line-clamp: 3; -webkit-box-orient: vertical; }
    .ep-duree      { font-size: 0.9rem; color: var(--muted); margin-top: 6px; flex-shrink: 0; }
    .radio-thumb {
      width: 52px; height: 52px; border-radius: 8px;
      object-fit: cover; flex-shrink: 0;
    }

    /* ══════════════════════════════ */
    /* SCREEN 4 — PLAYER             */
    /* ══════════════════════════════ */
    #player-inner {
      flex: 1; display: flex; min-height: calc(100vh - var(--sb-h)); align-items: center;
    }
    /* Left: artwork */
    .art-wrap {
      width: 45%; display: flex; align-items: center; justify-content: center;
      padding: 14px;
    }
    .art-box {
      position: relative; width: 100%; max-width: 310px;
      aspect-ratio: 1/1; border-radius: 16px; overflow: hidden; cursor: pointer;
    }
    .art-box img { width: 100%; height: 100%; object-fit: cover; display: block; }
    .art-overlay {
      position: absolute; inset: 0;
      background: rgba(0,0,0,0.38);
      display: flex; align-items: center; justify-content: center;
      opacity: 0; transition: opacity 170ms;
    }
    .art-box:hover .art-overlay { opacity: 1; }
    .art-overlay.show             { opacity: 1; }
    .ov-icon {
      width: 64px; height: 64px; border-radius: 50%;
      background: rgba(0,0,0,0.52);
      display: flex; align-items: center; justify-content: center;
      font-size: 1.8rem; color: #fff;
    }
    /* Right: controls */
    .ctrl-wrap {
      flex: 1; display: flex; flex-direction: column; justify-content: center;
      padding: 24px 20px 24px 8px; gap: 18px; min-width: 0;
    }
    .ctrl-pod-name { font-size: 1rem; color: var(--muted); white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
    .ctrl-ep-name  { font-size: 1.2rem; font-weight: 500; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
    /* Progress */
    .prog-wrap { display: flex; flex-direction: column; gap: 5px; }
    .prog-bg   { height: 44px; position: relative; cursor: pointer; touch-action: none; }
    .prog-bg::before {
      content: ''; position: absolute; inset: 12px 0;
      background: var(--border); border-radius: 10px; pointer-events: none;
    }
    .prog-fill {
      position: absolute; left: 0; top: 12px; bottom: 12px; width: 0%;
      background: var(--accent); border-radius: 10px;
      transition: width 1s linear; pointer-events: none;
    }
    .prog-fill { height: 20px; width: 0%; background: var(--accent); border-radius: 10px; transition: width 1s linear; }
    .prog-times { display: flex; justify-content: space-between; font-size: 1rem; color: var(--muted); font-variant-numeric: tabular-nums; }
    /* Buttons row */
    .ctrl-btns { display: flex; align-items: center; justify-content: center; gap: 16px; }
    .btn-prev, .btn-next {
      width: 80px; height: 80px; border-radius: 50%;
      background: var(--surface); border: 1.5px solid var(--border);
      display: flex; align-items: center; justify-content: center; font-size: 28px;
    }
    .btn-pp {
      width: 96px; height: 96px; border-radius: 50%;
      background: var(--accent); border: 2px solid var(--accent);
      color: #000; font-size: 36px;
      display: flex; align-items: center; justify-content: center;
      transition: transform 100ms;
    }
    .btn-pp:active { transform: scale(0.92); }
    /* Volume */
    .vol-row { display: flex; gap: 10px; align-items: center; justify-content: center; }
    .btn-vol {
      background: var(--surface); border: 1.5px solid var(--border);
      border-radius: 14px; height: 80px; min-width: 80px; padding: 0 14px; font-size: 24px;
      display: flex; align-items: center; justify-content: center;
    }
    .btn-vol:active { background: var(--border); }
    .vol-bar-wrap { display: flex; align-items: center; gap: 8px; flex: 1; min-width: 0; }
    .vol-bar-bg   { flex: 1; height: 44px; position: relative; cursor: pointer; touch-action: none; }
    .vol-bar-bg::before {
      content: ''; position: absolute; inset: 12px 0;
      background: var(--border); border-radius: 10px; pointer-events: none;
    }
    .vol-bar-fill {
      position: absolute; left: 0; top: 12px; bottom: 12px; width: 0%;
      background: var(--accent); border-radius: 10px;
      transition: width 300ms ease; pointer-events: none;
    }
    .vol-pct      { font-size: 1rem; color: var(--muted); min-width: 40px; text-align: right; font-variant-numeric: tabular-nums; }

    .battery-notice {
      position: fixed;
      left: 50%;
      transform: translateX(-50%);
      z-index: 500;
      min-width: min(92vw, 520px);
      max-width: min(92vw, 520px);
      background: rgba(15, 30, 46, 0.96);
      border: 1.5px solid var(--border);
      border-radius: 16px;
      box-shadow: 0 18px 60px rgba(0, 0, 0, 0.35);
      padding: 14px 18px;
      color: var(--text);
      backdrop-filter: blur(10px);
    }
    #battery-popup { top: 56px; }
    #resume-prompt { top: 56px; }
    #battery-alert {
      bottom: 96px;
      min-width: min(92vw, 640px);
      max-width: min(92vw, 640px);
    }
    .battery-notice.warn { border-color: rgba(245, 166, 35, 0.55); }
    .battery-notice.critical { border-color: rgba(226, 75, 74, 0.72); background: rgba(64, 20, 22, 0.96); }
    .battery-notice-title { font-size: 0.9rem; color: var(--muted); margin-bottom: 4px; }
    .battery-notice-msg { font-size: 1.12rem; font-weight: 600; }
    .resume-actions {
      display: flex;
      gap: 10px;
      margin-top: 12px;
      justify-content: flex-end;
    }
    .resume-btn {
      border-radius: 12px;
      padding: 10px 14px;
      border: 1.5px solid var(--border);
      background: var(--surface);
      color: var(--text);
      font-size: 1rem;
      font-weight: 600;
    }
    .resume-btn.primary {
      background: var(--accent);
      border-color: var(--accent);
      color: #03111b;
    }

    @media (max-width: 640px) {
      #battery-alert { bottom: 88px; }
      .resume-actions { flex-direction: column; }
      .resume-btn { width: 100%; }
    }

    /* ══════════════════════════════ */
    /* SCREEN 5 — RADIO PLAYER       */
    /* ══════════════════════════════ */
    #rp-inner { flex: 1; display: flex; min-height: calc(100vh - var(--sb-h)); align-items: center; }
    .rp-art-box {
      position: relative; width: 100%; max-width: 310px;
      aspect-ratio: 1/1; border-radius: 16px; overflow: hidden;
    }
    .rp-art-box .fav-heart { width: 68px; height: 68px; font-size: 38px; top: 12px; left: 12px; }
    .rp-art-box img { width: 100%; height: 100%; object-fit: cover; display: block; }
    .rp-art-fallback {
      width: 100%; height: 100%;
      display: flex; align-items: center; justify-content: center;
      background: #120d04;
    }
    .live-badge {
      display: inline-flex; align-items: center; gap: 7px;
      font-size: 0.78rem; font-weight: 700; letter-spacing: 0.07em;
      color: var(--green);
    }
    .live-dot {
      width: 8px; height: 8px; border-radius: 50%;
      background: var(--green);
      animation: pulse 2s ease-in-out infinite;
    }
    .rp-name { font-size: 24px; font-weight: 500; }
    .rp-desc { font-size: 14px; color: var(--muted); margin-top: 4px; }

    /* ── MINI-PLAYER ── */
    #miniplayer {
      position: fixed; bottom: 0; left: 0; right: 0;
      height: 80px;
      background: #080d13;
      border-top: 1.5px solid var(--border);
      display: flex; align-items: center; gap: 14px;
      padding: 0 18px;
      z-index: 200;
      cursor: pointer;
      user-select: none;
    }
    #mini-art { width: 54px; height: 54px; border-radius: 8px; object-fit: cover; flex-shrink: 0; background: var(--surface); }
    #mini-info { flex: 1; min-width: 0; }
    #mini-pod  { font-size: 1rem; color: var(--muted); white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
    #mini-ep   { font-size: 1.1rem; font-weight: 600; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; margin-top: 2px; }
    #mini-btn-pp {
      width: 54px; height: 54px; border-radius: 50%;
      background: var(--accent); color: #000; font-size: 22px;
      display: flex; align-items: center; justify-content: center;
      flex-shrink: 0;
    }
    /* ⚠️ TEMPORAIRE — bascule HP/casque avant câblage LM393 (TICKET-031) */
    #mini-btn-output {
      height: 24px; padding: 0 10px; border-radius: 12px;
      background: var(--surface); border: 1px solid var(--border);
      color: var(--muted);
      display: flex; align-items: center;
      transition: background 0.25s, border-color 0.25s, color 0.25s;
    }
    #mini-btn-output svg { width: 16px; height: 16px; }
    #mini-btn-output.casque-actif {
      background: color-mix(in srgb, var(--accent) 14%, transparent);
      border-color: var(--accent);
      color: var(--accent);
    }
  </style>
</head>
<body>

<!-- STATUS BAR -->
<div id="statusbar">
  <span id="sb-time" style="font-variant-numeric:tabular-nums">--:--</span>
  <!-- ⚠️ TEMPORAIRE — bascule HP/casque avant câblage LM393 (TICKET-031) -->
  <button id="mini-btn-output" title="Haut-parleurs actifs">
    <svg id="ico-hp" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
      <polygon points="11 5 6 9 2 9 2 15 6 15 11 19 11 5"/>
      <path d="M15.54 8.46a5 5 0 0 1 0 7.07"/>
    </svg>
    <svg id="ico-casque" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" class="hidden">
      <path d="M3 18v-6a9 9 0 0 1 18 0v6"/>
      <path d="M21 19a2 2 0 0 1-2 2h-1a2 2 0 0 1-2-2v-3a2 2 0 0 1 2-2h3z"/>
      <path d="M3 19a2 2 0 0 0 2 2h1a2 2 0 0 0 2-2v-3a2 2 0 0 0-2-2H3z"/>
    </svg>
  </button>
  <span id="bat-display"></span>
</div>

<div id="app">

  <!-- ─────────────────────────────── -->
  <!-- SCREEN 1 — ACCUEIL             -->
  <!-- ─────────────────────────────── -->
  <div class="screen" id="home">
    <span class="home-brand">Hechicero</span>
    <div class="flags-row">
      <button class="flag-btn" id="btn-fr">
        <span class="flag-svg">
          <svg viewBox="0 0 3 2" xmlns="http://www.w3.org/2000/svg">
            <rect width="1" height="2" x="0" fill="#0055A4"/>
            <rect width="1" height="2" x="1" fill="#FFFFFF"/>
            <rect width="1" height="2" x="2" fill="#EF4135"/>
          </svg>
        </span>
        Français
      </button>
      <button class="flag-btn" id="btn-es">
        <span class="flag-svg">
          <svg viewBox="0 0 3 2" xmlns="http://www.w3.org/2000/svg">
            <rect width="3" height="1"   y="0"   fill="#FFD100"/>
            <rect width="3" height="0.5" y="1"   fill="#0033A0"/>
            <rect width="3" height="0.5" y="1.5" fill="#CE1126"/>
          </svg>
        </span>
        Español
      </button>
    </div>
  </div>

  <!-- ─────────────────────────────── -->
  <!-- SCREEN 2 — GRILLE PODCASTS     -->
  <!-- ─────────────────────────────── -->
  <div class="screen has-sb hidden" id="podcasts">
    <div class="s-header">
      <button class="btn-back" id="back-home"><span class="chev">‹</span>Accueil</button>
      <span class="s-title" id="pod-header">Podcasts</span>
    </div>
    <div class="s-body">
      <div id="pod-grid"></div>
    </div>
  </div>

  <!-- ─────────────────────────────── -->
  <!-- SCREEN 3a — CATALOGUE RADIO    -->
  <!-- ─────────────────────────────── -->
  <div class="screen has-sb hidden" id="radio-catalog">
    <div class="s-header">
      <button class="btn-back" id="back-pods-radio"><span class="chev">‹</span>Podcasts</button>
      <span class="s-title" id="radio-title">Radios</span>
    </div>
    <div class="s-body">
      <div id="radio-list" class="radio-list"></div>
    </div>
  </div>

  <!-- ─────────────────────────────── -->
  <!-- SCREEN 3b — LISTE ÉPISODES     -->
  <!-- ─────────────────────────────── -->
  <div class="screen has-sb hidden" id="chapters">
    <div class="s-header">
      <button class="btn-back" id="back-pods-ch"><span class="chev">‹</span>Podcasts</button>
      <span class="s-title" id="ch-title">Épisodes</span>
    </div>
    <div class="s-body">
      <div id="ep-list" class="ep-list"></div>
    </div>
  </div>

  <!-- ─────────────────────────────── -->
  <!-- SCREEN — FAVORIS (TICKET-046)  -->
  <!-- ─────────────────────────────── -->
  <div class="screen has-sb hidden" id="favoris">
    <div class="s-header">
      <button class="btn-back" id="back-favoris"><span class="chev">‹</span>Accueil</button>
      <span class="s-title">Mes préférés</span>
    </div>
    <div class="s-body">
      <div id="fav-list" class="ep-list"></div>
    </div>
  </div>

  <!-- ─────────────────────────────── -->
  <!-- SCREEN — CHAMBRE (TICKET-112)  -->
  <!-- domotique lampe + volet via passerelle 192.168.1.3:8000 -->
  <!-- ─────────────────────────────── -->
  <div class="screen has-sb hidden" id="chambre">
    <div class="s-header">
      <button class="btn-back" id="back-chambre"><span class="chev">‹</span>Retour</button>
      <span class="s-title">Chambre</span>
      <span class="ch-status" id="ch-status">Connexion…</span>
    </div>
    <div class="s-body">
      <div class="ch-wrap">

        <!-- Lumière -->
        <div class="ch-card">
          <div class="ch-head">
            <span class="ch-title">Lumière</span>
            <span class="ch-val" id="ch-lumOut">–</span>
          </div>
          <div class="ch-row">
            <div class="ch-col">
              <svg class="ch-tap ch-icon-bulb" id="ch-bulbBtn" viewBox="0 0 120 130" role="button" aria-label="Allumer ou éteindre">
                <circle id="ch-halo" cx="60" cy="52" r="40" fill="#ffd873" opacity="0.4"/>
                <path id="ch-bulb" d="M60 16 a30 30 0 0 1 30 30 c0 14 -9 22 -15 30 l-30 0 c-6 -8 -15 -16 -15 -30 a30 30 0 0 1 30 -30 z" fill="#3a3f45" stroke="#5a6068" stroke-width="1.5"/>
                <rect x="47" y="90" width="26" height="8" rx="2" fill="#5a6068"/>
                <rect x="49" y="100" width="22" height="7" rx="2" fill="#5a6068"/>
                <rect x="52" y="109" width="16" height="7" rx="2" fill="#5a6068"/>
              </svg>
              <div class="ch-hint">appuyer = on / off</div>
            </div>
            <div class="ch-col ch-slider-col">
              <!-- Repères "grand soleil / petit soleil" façon appli Legrand
                   (lampe uniquement) — plus parlant qu'un % pour un enfant. -->
              <svg class="ch-sun ch-sun-lg" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" aria-label="Plus fort">
                <circle cx="12" cy="12" r="5"/>
                <path d="M12 1v3M12 20v3M1 12h3M20 12h3"/>
              </svg>
              <div class="ch-vbox"><input type="range" id="ch-lum" min="1" max="100" step="1" value="50" aria-label="Intensité"></div>
              <svg class="ch-sun ch-sun-sm" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" aria-label="Plus doux">
                <circle cx="12" cy="12" r="3.6"/>
                <path d="M12 2.5v3M12 18.5v3M2.5 12h3M18.5 12h3"/>
              </svg>
            </div>
          </div>
        </div>

        <!-- Volet -->
        <div class="ch-card">
          <div class="ch-head">
            <span class="ch-title">Volet</span>
            <span class="ch-badge" id="ch-moving">en mouvement</span>
            <span class="ch-val" id="ch-posOut">–</span>
          </div>
          <div class="ch-row">
            <div class="ch-col">
              <svg class="ch-tap ch-icon-volet" id="ch-voletBtn" viewBox="0 0 260 300" role="button" aria-label="Ouvrir ou fermer">
                <rect x="20" y="20" width="220" height="240" rx="6" fill="#123a4f"/>
                <rect x="20" y="20" width="220" height="240" rx="6" fill="none" stroke="#2b556b" stroke-width="2"/>
                <line x1="130" y1="20" x2="130" y2="260" stroke="#2b556b" stroke-width="3"/>
                <line x1="20" y1="140" x2="240" y2="140" stroke="#2b556b" stroke-width="3"/>
                <g id="ch-slats"></g>
                <rect x="14" y="14" width="232" height="252" rx="8" fill="none" stroke="#3a3f45" stroke-width="6"/>
                <rect x="30" y="262" width="200" height="14" rx="3" fill="#3a3f45"/>
              </svg>
              <div class="ch-hint">appuyer = ouvre / ferme</div>
            </div>
            <div class="ch-col ch-slider-col">
              <span class="ch-end">↑ ouvert</span>
              <div class="ch-vbox"><input type="range" id="ch-pos" min="0" max="100" step="1" value="0" aria-label="Position"></div>
              <span class="ch-end">↓ fermé</span>
            </div>
          </div>
        </div>

      </div>
    </div>
  </div>

  <!-- ─────────────────────────────── -->
  <!-- SCREEN 4 — LECTEUR             -->
  <!-- ─────────────────────────────── -->
  <div class="screen has-sb hidden" id="player">
    <div class="s-header">
      <button class="btn-back" id="back-ch"><span class="chev">‹</span><span id="player-back-lbl">Épisodes</span></button>
    </div>
    <div id="player-inner">
      <!-- Artwork -->
      <div class="art-wrap">
        <div class="art-box" id="art-box">
          <img id="player-art" src="" alt="">
          <div class="art-overlay" id="art-overlay">
            <div class="ov-icon" id="ov-icon">▶</div>
          </div>
          <span class="ep-num-badge" id="ep-num-badge"></span>
          <span class="fav-heart">♥</span>

<script>
// ═══════════════════════════════════════
// HELPERS
// ═══════════════════════════════════════
const el = id => document.getElementById(id);

const ALL_SCREENS = ['home','podcasts','radio-catalog','chapters','favoris','chambre','player','radio-player'];
function show(id) {
  currentScreen = id;
  ALL_SCREENS.forEach(s => el(s).classList.add('hidden'));
  el(id).classList.remove('hidden');
  el('statusbar').classList.remove('hidden');
  updateClock();
  updateMiniPlayer();
}

function updateMiniPlayer() {
  const mp = el('miniplayer');
  const onPlayer = currentScreen === 'player' || currentScreen === 'radio-player';
  const hasMedia = (currentPodcast && currentIdx >= 0) || currentStation;
  if (hasMedia && !onPlayer) {
    mp.classList.remove('hidden');
    document.body.classList.add('has-mini');
    if (currentStation) {
      el('mini-art').src = currentStation.image || '';
      el('mini-pod').textContent = 'EN DIRECT';
      el('mini-ep').textContent  = currentStation.name;
    } else {
      el('mini-art').src = currentPodcast.image || '';
      el('mini-pod').textContent = currentPodcast.titre;
      const items = getDisplayItems(currentPodcast);
      const ch = items[currentIdx];
      el('mini-ep').textContent = ch ? ch.titre : '';
    }
  } else {
    mp.classList.add('hidden');
    document.body.classList.remove('has-mini');
  }
}

function fmtDur(s) {
  if (s === null || s === undefined || s === '') return '--:--';
  if (typeof s === 'string' && s.includes(':')) {
    const p = s.split(':').map(Number);
    s = p.length === 3 ? p[0]*3600 + p[1]*60 + p[2] : p[0]*60 + p[1];
  }
  s = Math.round(+s);
  if (isNaN(s)) return '--:--';
  return Math.floor(s/60) + ':' + String(s%60).padStart(2,'0');
}

function formatMinutes(minutes) {
  const value = Math.round(Number(minutes));
  if (!Number.isFinite(value) || value <= 0) return '—';
  if (value < 60) return `${value}min`;
  const hours = Math.floor(value / 60);
  const remaining = value % 60;
  return `${hours}h${String(remaining).padStart(2, '0')}`;
}

function isPlayingNow() {
  return lastMpdState === 'play';
}

function showBatteryNotice(id, title, message, variant = '', duration = 8000) {
  const node = el(id);
  if (!node) return;
  node.classList.remove('warn', 'critical', 'hidden');
  if (variant) node.classList.add(variant);
  node.innerHTML = `
    <div class="battery-notice-title">${title}</div>
    <div class="battery-notice-msg">${message}</div>
  `;
  if (duration > 0) {
    const timerKey = id === 'battery-popup' ? '__batteryPopupTimer' : '__batteryAlertTimer';
    clearTimeout(window[timerKey]);
    window[timerKey] = setTimeout(() => node.classList.add('hidden'), duration);
  }
}

function hideBatteryNotice(id) {
  const node = el(id);
  if (!node) return;
  node.classList.add('hidden');
}

// ═══════════════════════════════════════
// STATUS BAR
// ═══════════════════════════════════════
function updateClock() {
  el('sb-time').textContent =
    new Date().toLocaleTimeString('fr-FR', { hour: '2-digit', minute: '2-digit' });
}
setInterval(updateClock, 60000);

function renderBattery(pct, charging, minutes) {
  const color = pct > 30 ? '#3dba6a' : pct > 10 ? '#f5a623' : '#e24b4a';
  return `
        <svg width="36" height="18" viewBox="0 0 22 11">
          <rect x="0" y="1" width="19" height="9" rx="2"
            fill="none" stroke="#4a7a9b" stroke-width="1.2"/>
          <rect x="1.5" y="2.5" width="${Math.round(16*pct/100)}"
            height="6" rx="1" fill="${color}"/>
          <rect x="19.5" y="3.5" width="2" height="4" rx="1" fill="#4a7a9b"/>
        </svg>
        <span style="font-size:16px;color:#c8dff0">${pct}%</span>
        <span id="battery-time" style="font-size:16px;color:#7fa8c8">${formatMinutes(minutes)}</span>
        ${charging ? '<span style="color:#f5c842;font-size:16px">⚡</span>' : ''}
      `;
}

// Batterie : essaie navigator.getBattery(), sinon lit status.json (INA219)
function updateBatteryDisplay(pct, charging, minutes) {
  const el = document.getElementById('bat-display');
  if (!el) return;
  el.innerHTML = renderBattery(Math.round(pct), charging, minutes);
}

function fetchBatteryFromStatus() {
  fetch('../status.json', { cache: 'no-store' })
    .then(r => r.json())
    .then(d => {
      const pct = d.battery_percent ?? d.percent ?? d.soc ?? null;
      const charging = d.charging ?? (d.state ? d.state.toLowerCase().includes('charge') && !d.state.toLowerCase().includes('sur batterie') : false);
      if (pct !== null) updateBatteryDisplay(pct, charging, null);
    })
    .catch(() => {});
}

let batterySnapshot = null;
let activeBatteryAlertKey = null;
let pendingResumeTarget = null;
let resumePromptLoaded = false;

// Favoris (TICKET-046) — Set de clés "podcastId/episodeId" pour un lookup
// O(1) au rendu des badges cœur. LAST_FAVORIS_LIST garde la version enrichie
// (titre/image/podcast) pour l'écran dédié, évite un aller-retour serveur
// supplémentaire entre fetchFavoris() et renderFavoris().
let FAVORIS_SET = new Set();
let LAST_FAVORIS_LIST = [];
let lastUiRequestTs = null;

// Navigation "au sein des favoris" (dernière évolution TICKET-046) — quand
// un morceau ou une webradio est lancé depuis l'écran favoris, suivant/
// précédent doivent naviguer dans CETTE liste plutôt que dans le podcast
// d'origine (ou pas du tout, pour une webradio hors de ce contexte, qui n'a
// normalement pas de notion de suivant/précédent). favNavQueue = snapshot de
// LAST_FAVORIS_LIST au moment du clic (ordre stable pendant la navigation,
// même si la liste réelle change entre-temps) ; remis à null dès qu'on
// relance quelque chose depuis un écran normal (chapitres, catalogue radio).
// Ne concerne que les boutons suivant/précédent À L'ÉCRAN — les boutons
// physiques GPIO gardent leur comportement actuel (scope podcast uniquement).
let favNavQueue = null;
let favNavIdx = -1;

// Écran Chambre (TICKET-112) — mémorise l'écran d'où on est venu pour y
// revenir à la fermeture (le déclencheur GPIO23 peut être pressé depuis
// n'importe quel écran, contrairement aux favoris). La logique domotique
// (fetch passerelle) est branchée en phase 2 dans openChambre/closeChambre.
let chambrePrevScreen = 'home';

function applyBatteryStats(stats) {
  const pct = stats.current_level ?? stats.percent ?? stats.battery_percent ?? null;
  if (pct === null || pct === undefined) return;
  const charging = Boolean(stats.charging ?? (stats.status === 'charging'));
  const rawAutonomy = window.__debugBatteryMinutes
    ?? stats.estimated_autonomy_minutes_live
    ?? stats.estimated_autonomy_minutes;
  const autonomyMinutes = Number(rawAutonomy);
  const chargeMinutes = Number(stats.estimated_charge_time_minutes_live ?? stats.estimated_charge_time_minutes);
  const displayMinutes = charging ? chargeMinutes : autonomyMinutes;

  updateBatteryDisplay(pct, charging, displayMinutes);

  if (batterySnapshot?.status === 'discharging' && stats.status === 'charging' && Number.isFinite(chargeMinutes) && chargeMinutes > 0) {
    showBatteryNotice('battery-popup', 'Alimentation', `Recharge estimée : ${formatMinutes(chargeMinutes)}`, '', 8000);
  }

  if (charging) {
    activeBatteryAlertKey = null;
    hideBatteryNotice('battery-alert');
  } else if (!isPlayingNow() && Number.isFinite(autonomyMinutes) && autonomyMinutes > 0) {
    if (autonomyMinutes < 10 && activeBatteryAlertKey !== '10') {
      activeBatteryAlertKey = '10';
      showBatteryNotice('battery-alert', 'Batterie faible', 'Il te reste 10 minutes, branche vite ta radio', 'critical', 20000);
    } else if (autonomyMinutes < 30 && activeBatteryAlertKey !== '30') {
      activeBatteryAlertKey = '30';
      showBatteryNotice('battery-alert', 'Batterie faible', 'Il te reste 30 minutes, pense à brancher ta radio', 'warn', 20000);
    }
  }

  batterySnapshot = stats;
}

function fetchBatteryStats() {
  fetch('/index.php?action=battery_data', { cache: 'no-store' })
    .then(r => r.json())
    .then(payload => {
      const stats = payload?.stats;
      if (stats && typeof stats === 'object' && Object.keys(stats).length) {
        applyBatteryStats(stats);
      } else {
        fetchBatteryFromStatus();
      }
    })
    .catch(() => fetchBatteryFromStatus());
}

fetchBatteryStats();
setInterval(fetchBatteryStats, 60000);

// ═══════════════════════════════════════
// RADIO STATIONS — chargées depuis data.json (clé radios)
// ═══════════════════════════════════════
let STATIONS = { fr: [], es: [] };
let currentStation = null;

// ═══════════════════════════════════════
// DATA & API
// ═══════════════════════════════════════
let VOLUME_MAX_SPEAKERS   = 40; // chargé depuis config.json
let VOLUME_MAX_HEADPHONES = 60; // TICKET-031 (GPIO casque)
let currentVolume = 0; // toujours en valeur IHM 0-100%

function currentVolumeMax() {
  return audioMode === 'casque' ? VOLUME_MAX_HEADPHONES : VOLUME_MAX_SPEAKERS;
}
function ihmToMpd(ihmPct) {
  return Math.round(ihmPct * currentVolumeMax() / 100);
}
function mpdToIhm(mpdPct) {
  return Math.min(100, Math.round(mpdPct * 100 / currentVolumeMax()));
}
let currentDuration = 0;
let DATA           = null;
let currentPodcast = null;
let currentIdx     = -1;
let selectedLang   = 'fr';
let pollTimer      = null;
let currentScreen  = 'home';
let lastMpdState   = null;
let lastElapsed       = 0;
let parentalCfg       = null;
let parentalTimer     = null;
let pendingChimeTouch = false;   // TICKET-073 : touch arrive avant la fin du fetch
let chimeAlreadyPlayed = false;  // TICKET-073 : evite une double lecture

// TICKET-073 : enregistrer le touch AVANT le fetch parental
document.addEventListener('touchstart', () => {
  pendingChimeTouch = true;
}, { once: true });

// Retourne les épisodes dans l'ordre de la série (ep1 en premier).
// L'ingest (rss_ingest/parser.py, TICKET-103bis, 2026-07-09) trie désormais
// les épisodes chronologiquement (plus ancien -> plus récent) directement
// dans data.json : plus besoin de reverse() ici (l'ordre du flux RSS brut
// n'était pas fiable sur toute sa longueur — saisons multiples, republications
// en lot — cf. bug TINA).
function getDisplayItems(podcast) {
  if (!podcast) return [];
  return [...(podcast.chapitres || podcast.episodes || [])];
}


async function loadData() {
  try {
    const [rData, rCfg] = await Promise.all([
      fetch('data.json',   { cache: 'no-store' }),
      fetch('config.json', { cache: 'no-store' })
    ]);
    if (!rData.ok) throw new Error('data.json introuvable');
    DATA = await rData.json();
    if (rCfg.ok) {
      const cfg = await rCfg.json();
      if (cfg.volume?.speakers_max   != null) VOLUME_MAX_SPEAKERS   = cfg.volume.speakers_max;
      if (cfg.volume?.headphones_max != null) VOLUME_MAX_HEADPHONES = cfg.volume.headphones_max;
    }
    // Construire STATIONS depuis data.json (radios gérées par l'admin)
    if (Array.isArray(DATA.radios) && DATA.radios.length > 0) {
      STATIONS.fr = DATA.radios.filter(r => (r.lang || r.langue || 'fr') === 'fr');
      STATIONS.es = DATA.radios.filter(r => (r.lang || r.langue || 'fr') === 'es');
    }
    checkResumePrompt();
  } catch(e) { console.error('Impossible de charger data.json', e); }
}

function findEpisodeByAudio(audioPath) {
  if (!DATA || !audioPath) return null;
  for (const podcast of DATA.podcasts || []) {
    const items = getDisplayItems(podcast);
    const idx = items.findIndex(ch => ch.audio === audioPath);
    if (idx >= 0) return { podcast, chapter: items[idx], idx };
  }
  return null;
}

// ═══════════════════════════════════════
// TICKET-114 — Rafraîchissement automatique du catalogue
// ═══════════════════════════════════════
// Problème : après un ingest ou un ajout via l'admin, il fallait recharger
// Chromium à la main pour voir les nouveaux podcasts.
// Cause exacte : loadData() était bien rappelé toutes les 5 min, mais rien ne
// re-rendait l'écran DÉJÀ affiché. goToPodcasts() était le seul endroit qui
// enchaînait chargement puis rendu — donc tant que l'enfant ne quittait pas la
// grille pour y revenir, rien ne changeait, même après des heures.
let lastCatalogVersion = null;

// Compare la signature {mtime, size} de data.json (action data_version de
// radio.php : deux stat(), pas les ~700 Ko du catalogue) et ne recharge que si
// elle a bougé.
async function pollCatalogVersion() {
  try {
    const r = await fetch('radio.php?action=data_version', { cache: 'no-store' });
    if (!r.ok) return;
    const v = await r.json();
    const sig = `${v.mtime}:${v.size}`;
    if (lastCatalogVersion === null) { lastCatalogVersion = sig; return; } // 1re passe : on mémorise seulement
    if (sig === lastCatalogVersion) return;
    lastCatalogVersion = sig;
    await refreshCatalogInPlace();
  } catch (e) {
    // PHP ou réseau indisponible : on retentera au tick suivant, sans bruit.
  }
}

// Recharge data.json ET re-rend l'écran visible, en préservant l'état de
// lecture. Remplace les appels « à l'aveugle » à loadData().
async function refreshCatalogInPlace() {
  // ⚠️ Précaution 1 — même famille de piège que TICKET-108 : l'ingest insère
  // les nouveaux épisodes EN TÊTE de liste. Après rechargement, currentIdx
  // désignerait un autre épisode et next/prev partiraient sur le mauvais. On
  // ré-ancre donc sur le CHEMIN AUDIO, seul identifiant stable à travers un
  // rechargement du catalogue.
  const anchorAudio = (currentPodcast && currentIdx >= 0)
    ? (getDisplayItems(currentPodcast)[currentIdx]?.audio || null)
    : null;
  const browsedPodcastId = currentPodcast?.id || null;

  await loadData();

  // Réattacher la référence d'objet : DATA a été remplacé, currentPodcast
  // pointerait sinon sur l'ancien objet, orphelin.
  if (browsedPodcastId) {
    const again = (DATA?.podcasts || []).find(p => p.id === browsedPodcastId);
    if (again) currentPodcast = again;
  }
  if (anchorAudio) {
    const found = findEpisodeByAudio(anchorAudio);
    if (found) { currentPodcast = found.podcast; currentIdx = found.idx; }
  }

  // ⚠️ Précaution 2 — on ne re-rend JAMAIS un écran de lecture : un ingest qui
  // se termine en arrière-plan ne doit pas faire clignoter la lecture en cours.
  if (currentScreen === 'player' || currentScreen === 'radio-player') return;

  if      (currentScreen === 'podcasts')      renderPodcasts();
  else if (currentScreen === 'chapters')      renderChapters();
  else if (currentScreen === 'favoris')       renderFavoris();
  else if (currentScreen === 'radio-catalog') openRadioCatalog();
}

function clearResumePrompt() {
  pendingResumeTarget = null;
  el('resume-prompt').classList.add('hidden');
  fetch('/index.php?action=clear_battery_resume').catch(() => {});
}

async function checkResumePrompt() {
  if (resumePromptLoaded || !DATA) return;
  resumePromptLoaded = true;
  try {
    const response = await fetch('/index.php?action=battery_resume', { cache: 'no-store' });
    const session = await response.json();
    if (!session || session.shutdown_reason !== 'battery_critical' || !session.mpd_file) return;
    const target = findEpisodeByAudio(session.mpd_file);
    if (!target) return;
    pendingResumeTarget = { ...target, session };
    el('resume-text').textContent = `Reprendre ${target.chapter.titre} là où tu t'es arrêté ?`;
    el('resume-prompt').classList.remove('hidden');
  } catch (_) {}
}

// ═══════════════════════════════════════
// FAVORIS (TICKET-046)
// ═══════════════════════════════════════
// Format de clé aligné sur favori_key() côté radio.php — préfixé par type
// ("episode:podcastId/episodeId" ou "radio:radioId") pour que les deux
// espaces de noms ne puissent jamais entrer en collision.
function episodeFavKey(podcastId, episodeId) { return 'episode:' + podcastId + '/' + episodeId; }
function radioFavKey(radioId) { return 'radio:' + radioId; }

function isFavoriEpisode(podcastId, episodeId) {
  return FAVORIS_SET.has(episodeFavKey(podcastId, episodeId));
}

function isFavoriRadio(radioId) {
  return FAVORIS_SET.has(radioFavKey(radioId));
}

// Applique/retire la classe .is-fav sur tous les éléments déjà rendus qui
// portent un data-fav-key (jaquette lecteur, lignes de la liste d'épisodes,
// écran favoris) — évite de devoir re-render toute la liste juste pour
// rafraîchir un cœur après un appui sur le bouton physique.
function applyFavoriBadges() {
  document.querySelectorAll('[data-fav-key]').forEach(node => {
    node.classList.toggle('is-fav', FAVORIS_SET.has(node.dataset.favKey));
  });
}

async function fetchFavoris() {
  try {
    const r = await fetch('/lecteur/radio.php?action=get_favoris', { cache: 'no-store' });
    const d = await r.json();
    if (!d.ok) return;
    LAST_FAVORIS_LIST = d.favoris || [];
    // f.key vient tel quel du serveur (déjà au bon format préfixé par
    // type) — pas de reconstruction côté client, une seule source de vérité
    // pour le format de clé.
    FAVORIS_SET = new Set(LAST_FAVORIS_LIST.map(f => f.key));
    applyFavoriBadges();
  } catch (_) {}
}

function renderFavoris() {
  const list = el('fav-list');
  list.innerHTML = '';
  if (!LAST_FAVORIS_LIST.length) {
    list.innerHTML = '<div style="padding:12px;color:var(--muted)">Pas encore de favoris — appuie sur le bouton ♥ pendant une histoire que tu adores !</div>';
    return;
  }
  LAST_FAVORIS_LIST.forEach(f => {
    const row = document.createElement('div');
    row.className = 'ep-row';
    row.innerHTML = `
      <div class="ep-thumb-wrap is-fav" data-fav-key="${f.key}">
        <img class="ep-thumb" src="${f.image || ''}" alt="" loading="lazy" draggable="false">
        <span class="fav-heart">♥</span>
      </div>
      <div class="ep-meta">
        <div class="ep-titre">${f.titre}</div>
        <div class="ep-duree">${f.podcast_titre}</div>
      </div>`;
    row.addEventListener('click', () => {
      favNavQueue = LAST_FAVORIS_LIST.slice();
      favNavIdx = favNavQueue.findIndex(x => x.key === f.key);
      playFavItem(f);
    });
    list.appendChild(row);
  });
}

async function openFavoris() {
  await fetchFavoris();
  renderFavoris();
  show('favoris');
}

// ═══════════════════════════════════════
// ÉCRAN CHAMBRE (TICKET-112) — domotique
// ═══════════════════════════════════════
// Phase 1 : navigation seule (ouvrir/fermer). Le branchement de la passerelle
// (fetch lampe/volet à l'ouverture, arrêt à la fermeture) est ajouté en
// phase 2 dans startChambre()/stopChambre(), appelés ici.
// Sonde /health avec timeout court — sert de garde d'accès (l'écran ne
// s'ouvre QUE si la passerelle répond, demande Thomas) et de moniteur en
// continu (refermeture auto si elle tombe pendant l'usage).
async function chGatewayHealthy() {
  try {
    const ctrl = new AbortController();
    const t = setTimeout(() => ctrl.abort(), 2500);
    const r = await fetch(CH_GW + '/health', { cache: 'no-store', signal: ctrl.signal });
    clearTimeout(t);
    if (!r.ok) return false;
    const d = await r.json();
    return !!d.ok;
  } catch (e) { return false; }
}

function chShowToast(msg) {
  const el0 = el('ch-toast');
  el0.textContent = msg;
  el0.classList.remove('hidden');
  clearTimeout(window.__chToastTimer);
  window.__chToastTimer = setTimeout(() => el0.classList.add('hidden'), 2000);
}

// Ouverture GARDÉE : on n'ouvre l'écran que si la passerelle répond. Sinon,
// bref message et on reste où on est (demande Thomas 2026-07-24).
async function requestOpenChambre() {
  if (await chGatewayHealthy()) openChambre();
  else chShowToast('Chambre indisponible');
}

function openChambre() {
  if (currentScreen === 'chambre') return;
  chambrePrevScreen = currentScreen;
  show('chambre');
  startChambre();
}
// Réveil de la veille "navigateur" (#sleep-overlay) — un appui GPIO ne génère
// pas de click/keydown, donc l'overlay ne se lèverait pas tout seul. (Le
// réveil de la dalle physiquement éteinte, lui, est déclenché côté
// buttons_daemon.py via screen_dpms.sh — le navigateur ne peut pas piloter
// wlr-randr.) On lève l'overlay et on réarme le timer de veille.
function chWakeBrowserVeille() {
  const ov = getSleepOverlay();
  if (ov && ov.classList.contains('active')) ov.classList.remove('active');
  resetSleepTimer('gpio_chambre');
}
function closeChambre() {
  stopChambre();
  const back = ALL_SCREENS.includes(chambrePrevScreen) && chambrePrevScreen !== 'chambre'
    ? chambrePrevScreen : 'home';
  show(back);
}
// Bascule pour le bouton physique GPIO23 (phase 3) : referme si on y est déjà,
// sinon ouvre — mais l'ouverture est gardée par /health (requestOpenChambre).
function toggleChambre() {
  if (currentScreen === 'chambre') closeChambre();
  else requestOpenChambre();
}
// ── Domotique Chambre (phase 2) — transposé de web/chambre.html ──────────
// Adresse de la passerelle. PAS un secret : simple IP LAN, aucun token ni
// entity_id Netatmo côté navigateur (la passerelle détient seule ces infos).
const CH_GW = 'http://192.168.1.3:8000';

let chActive = false;      // écran Chambre ouvert (les fetch/animations ne tournent QUE dans ce cas)
let chWired  = false;      // listeners DOM attachés une seule fois
let chLampOn = false, chLastLum = 100;
let chDispP = 0, chSrvP = 0, chTargetP = 0, chSrvMoving = false;
let chAnim = null, chFastPoll = null, chReconcile = null, chLumTimer = null, chPosTimer = null, chHealthPoll = null;

function chSetStatus(txt, off) {
  const s = el('ch-status');
  if (!s) return;
  s.textContent = txt;
  s.classList.toggle('off', !!off);
}

// Appel passerelle avec timeout dur (6s) — un Internet coupé ou une passerelle
// éteinte ne doit JAMAIS geler l'IHM : on abandonne et on bascule "hors ligne".
async function chApi(path, method = 'GET', body) {
  const opt = { method, headers: {} };
  if (body) { opt.headers['Content-Type'] = 'application/json'; opt.body = JSON.stringify(body); }
  const ctrl = new AbortController();
  const t = setTimeout(() => ctrl.abort(), 6000);
  opt.signal = ctrl.signal;
  try {
    const r = await fetch(CH_GW + path, opt);
    clearTimeout(t);
    if (!r.ok) throw new Error('HTTP ' + r.status);
    chSetStatus('Passerelle connectée');
    return await r.json();
  } catch (e) {
    clearTimeout(t);
    chSetStatus('Passerelle hors ligne', true);
    throw e;
  }
}

// Éteinte = ampoule grise, pas de halo. Allumée = ampoule jaune + halo dont
// la taille/opacité suit l'intensité (spec Thomas 2026-07-24). Lit l'état
// (chLampOn) et la valeur du curseur.
function chDrawLum() {
  const v = +el('ch-lum').value, halo = el('ch-halo'), bulb = el('ch-bulb');
  if (chLampOn) {
    el('ch-lumOut').textContent = v + ' %';
    bulb.setAttribute('fill', '#ffd34d');
    halo.setAttribute('opacity', (0.15 + v / 100 * 0.75).toFixed(2));
    halo.setAttribute('r', (28 + v / 100 * 26).toFixed(0));
  } else {
    el('ch-lumOut').textContent = 'éteinte';
    bulb.setAttribute('fill', '#3a3f45');
    halo.setAttribute('opacity', '0');
  }
}

// Volet : dispP = position affichée (lissée), chSrvP = position passerelle,
// chTargetP = consigne curseur. La passerelle estime la position en temps réel
// pendant la manœuvre (Netatmo ne la remonte qu'en fin de course).
const CH_topY = 22, CH_fullH = 236, CH_left = 22, CH_right = 238, CH_nSlats = 14, CH_gap = 236 / 14;
function chDrawVolet() {
  el('ch-posOut').textContent = Math.round(chDispP) + ' %';
  const closedFrac = (100 - chDispP) / 100, coverH = CH_fullH * closedFrac;
  let s = '';
  if (coverH > 1) {
    // Lamelles baissées depuis le haut. Toujours dessinées (y compris volet
    // fermé à 0 %) : à la fermeture, les lamelles se resserrent et
    // s'assombrissent — vrai rendu de volet baissé plutôt qu'un aplat sombre
    // qui faisait "boîte vide" (retour Thomas 2026-07-24). Au minimum une
    // lamelle dès qu'il y a de la couverture, pour ne jamais afficher un
    // cadre vide.
    const covered = Math.max(1, Math.round(CH_nSlats * closedFrac)), openness = chDispP / 100;
    const sy = Math.max(2.5, CH_gap * (1 - openness * 0.7));
    const lg = Math.round(40 + openness * 110);
    const col = 'rgb(' + lg + ',' + (lg + 14) + ',' + (lg + 24) + ')';
    for (let i = 0; i < covered; i++) {
      const cy = CH_topY + CH_gap * i + CH_gap / 2;
      s += '<rect x="' + CH_left + '" y="' + (cy - sy / 2) + '" width="' + (CH_right - CH_left) + '" height="' + sy.toFixed(1) + '" rx="1.5" fill="' + col + '" stroke="#0f1a22" stroke-width="0.6"/>';
    }
  }
  el('ch-slats').innerHTML = s;
  el('ch-moving').style.visibility = chSrvMoving ? 'visible' : 'hidden';
}

async function chPollOnce() {
  try {
    const d = await chApi('/volet');
    chSrvP = d.position; chSrvMoving = !!d.moving;
    if (!chSrvMoving) chDrawVolet();
  } catch (e) {}
}

// Pendant une manœuvre, on interroge /volet souvent (gratuit côté passerelle,
// qui estime sans taper Netatmo).
//
// ⚠️ Le BSO Netatmo annonce `moving:false` TROP TÔT, à une position
// intermédiaire fausse (ex. 53 % alors qu'il finit à 100 %) — feedback peu
// fiable, cf. docs/95 §8. On ne s'arrête donc PAS au premier `moving:false` :
// on continue de suivre tant que la position rapportée n'est pas proche de la
// consigne (chTargetP), avec un plafond de sécurité (~40 s). Sans ça, l'IHM
// se figeait sur la position intermédiaire jusqu'au recalage tardif (ou un
// rechargement de page) — bug constaté le 2026-07-24.
function chStartTracking() {
  clearInterval(chFastPoll); clearTimeout(chReconcile);
  chSrvMoving = true; chDrawVolet();
  const started = Date.now();
  chFastPoll = setInterval(async () => {
    if (!chActive) { clearInterval(chFastPoll); return; }
    await chPollOnce();
    const nearTarget = Math.abs(chSrvP - chTargetP) <= 3;
    const timedOut = Date.now() - started > 40000;
    // Vrai arrêt = la passerelle dit "arrêté" ET on est bien arrivé à la
    // consigne. Sinon (arrêt annoncé mais loin de la cible), on continue.
    if ((!chSrvMoving && nearTarget) || timedOut) {
      clearInterval(chFastPoll);
      // Un dernier recalage tardif, au cas où Netatmo affine encore après coup.
      chReconcile = setTimeout(() => { if (chActive) chPollOnce(); }, 20000);
    }
  }, 700);
}

function chCommandVolet(pos) {
  chTargetP = pos; el('ch-pos').value = pos; chSrvMoving = true; chDrawVolet();
  chApi('/volet', 'POST', { position: pos }).then(chStartTracking).catch(() => {});
}

// Listeners attachés une seule fois (les éléments existent toujours dans le
// DOM, l'écran est juste masqué/affiché).
function chWire() {
  if (chWired) return;
  chWired = true;

  const L = el('ch-lum');
  // Bouger le curseur allume TOUJOURS la lampe à la valeur choisie (même si
  // elle était éteinte) ; au plus bas = intensité minimale, pas éteinte.
  L.addEventListener('input', () => {
    const v = +L.value; chLampOn = true; chLastLum = v; chDrawLum();
    clearTimeout(chLumTimer);
    chLumTimer = setTimeout(() => chApi('/lampe', 'POST', { on: true, brightness: v }).catch(() => {}), 350);
  });
  // Appui sur l'ampoule = allume/éteint. À l'allumage, dernière intensité.
  el('ch-bulbBtn').addEventListener('click', async () => {
    chLampOn = !chLampOn;
    if (chLampOn) {
      const v = chLastLum > 0 ? chLastLum : 100; L.value = v; chDrawLum();
      chApi('/lampe', 'POST', { on: true, brightness: v }).catch(() => {});
    } else {
      chDrawLum();
      chApi('/lampe', 'POST', { on: false }).catch(() => {});
    }
  });

  const P = el('ch-pos');
  // Le curseur = la CONSIGNE. On ne le resynchronise jamais sur la position
  // réelle (celle-ci est montrée par l'animation du volet + le grand chiffre) :
  // il ne bouge que quand l'utilisateur le manipule ou via chCommandVolet.
  P.addEventListener('input', () => {
    chTargetP = +P.value; chSrvMoving = true; chDrawVolet();
    clearTimeout(chPosTimer);
    chPosTimer = setTimeout(() => chCommandVolet(chTargetP), 300);
  });
  // Toggle volet (spec Thomas) : ouvert (100 %) → 0 ; sinon (fermé OU
  // intermédiaire) → 100. Donc depuis un état intermédiaire, 1er appui = 100,
  // appui suivant = 0. On décide sur la CONSIGNE (chTargetP = position
  // initiale puis dernière commande), pas sur la position mesurée : le retour
  // de position réelle du BSO n'est pas fiable (cf. docs/95 §8), la consigne
  // rend le toggle déterministe.
  el('ch-voletBtn').addEventListener('click', () => {
    chCommandVolet(chTargetP >= 100 ? 0 : 100);
  });
}

// Ouverture de l'écran : on câble (1x), on lance la boucle d'animation du
// volet, et on récupère l'état réel lampe + volet. Rien de tout ça ne tourne
// tant que l'écran n'est pas ouvert (kiosque qui boote passerelle éteinte OK,
// et quota Netatmo préservé).
async function startChambre() {
  chActive = true;
  chWire();
  chSetStatus('Connexion…');

  clearInterval(chAnim);
  chAnim = setInterval(() => {
    if (!chActive) { clearInterval(chAnim); return; }
    if (Math.abs(chDispP - chSrvP) > 0.3) {
      chDispP += (chSrvP > chDispP ? 1 : -1) * Math.min(1.5, Math.abs(chSrvP - chDispP));
      chDrawVolet();
    }
  }, 40);

  try {
    const l = await chApi('/lampe');
    chLampOn = !!l.on;
    chLastLum = (l.brightness > 0) ? l.brightness : 100;
    el('ch-lum').value = chLampOn ? (l.brightness > 0 ? l.brightness : chLastLum) : chLastLum;
    chDrawLum();
  } catch (e) { chLampOn = false; chDrawLum(); }
  try {
    const d = await chApi('/volet');
    chSrvP = chDispP = chTargetP = d.position; chSrvMoving = !!d.moving;
    el('ch-pos').value = d.position; chDrawVolet();
    if (chSrvMoving) chStartTracking();
  } catch (e) { chDrawVolet(); }

  // Moniteur d'accès : tant que l'écran est ouvert, on vérifie que la
  // passerelle répond ; si elle tombe, on referme automatiquement (demande
  // Thomas — "accessible seulement si la passerelle répond", strict). /health
  // ne touche pas Netatmo, donc ce polling ne consomme pas de quota.
  clearInterval(chHealthPoll);
  chHealthPoll = setInterval(async () => {
    if (!chActive) { clearInterval(chHealthPoll); return; }
    if (!(await chGatewayHealthy())) {
      if (chActive && currentScreen === 'chambre') { chShowToast('Chambre indisponible'); closeChambre(); }
    }
  }, 5000);
}

// Fermeture : on coupe tout (aucun appel réseau ni animation en arrière-plan
// quand l'écran n'est pas visible — quota Netatmo + non-régression).
function stopChambre() {
  chActive = false;
  clearInterval(chAnim); chAnim = null;
  clearInterval(chFastPoll); chFastPoll = null;
  clearInterval(chHealthPoll); chHealthPoll = null;
  clearTimeout(chReconcile); chReconcile = null;
  clearTimeout(chLumTimer); chLumTimer = null;
  clearTimeout(chPosTimer); chPosTimer = null;
}

// Montre/cache les boutons précédent/suivant du lecteur radio — inexistants
// avant cette évolution (une webradio browsée normalement n'a pas de notion
// de "suivant"), affichés seulement en navigation favoris.
function updateFavNavButtons() {
  const active = !!favNavQueue;
  el('rp-btn-prev').classList.toggle('hidden', !active);
  el('rp-btn-next').classList.toggle('hidden', !active);
}

// Lance un élément de favNavQueue (épisode ou webradio) — factorisé pour
// être appelé aussi bien au clic initial sur l'écran favoris qu'au
// suivant/précédent pendant la navigation dans cette liste.
function playFavItem(f) {
  updateFavNavButtons();
  syncNavContextToServer(); // pour que le bouton physique reprenne au bon endroit ensuite
  if (f.type === 'radio') {
    const lang = (STATIONS.fr.find(s => s.url === f.url)) ? 'fr' : 'es';
    const station = (STATIONS[lang] || []).find(s => s.url === f.url) || { id: f.radio_id, name: f.titre, url: f.url, image: f.image, desc: '' };
    openRadioPlayer(station);
    return;
  }
  const podcast = DATA?.podcasts?.find(p => p.id === f.podcast_id);
  if (!podcast) return;
  const items = getDisplayItems(podcast);
  const idx = items.findIndex(ch => ch.id === f.episode_id);
  if (idx < 0) return;
  currentPodcast = podcast;
  playTrack(idx);
}

// Pousse le contexte de navigation favoris côté serveur (data/nav_context.json)
// — nécessaire pour que le bouton physique GPIO17/27 (qui appelle
// next_episode/prev_episode directement, sans passer par ce JS) sache lui
// aussi qu'on navigue dans les favoris plutôt que dans le podcast d'origine.
// Sans ça, seul le tap écran aurait le comportement demandé.
async function syncNavContextToServer() {
  try {
    if (!favNavQueue || favNavIdx < 0 || !favNavQueue[favNavIdx]) {
      await fetch('/lecteur/radio.php?action=set_nav_context&mode=normal', { cache: 'no-store' });
      return;
    }
    const params = new URLSearchParams();
    params.set('action', 'set_nav_context');
    params.set('mode', 'favoris');
    params.set('active', favNavQueue[favNavIdx].key);
    favNavQueue.forEach(f => params.append('keys[]', f.key));
    await fetch('/lecteur/radio.php?' + params.toString(), { cache: 'no-store' });
  } catch (_) {}
}

// Resynchronise favNavQueue/favNavIdx à partir de ce que le serveur renvoie
// (now_playing) — nécessaire dans l'autre sens : si c'est le bouton
// PHYSIQUE qui a avancé dans les favoris, ce JS doit le savoir pour que les
// boutons à l'écran (et rp-btn-prev/next) continuent correctement depuis
// cette position. Reconstruit les objets complets à partir de
// LAST_FAVORIS_LIST (déjà tenu à jour par fetchFavoris, 1s) plutôt que de
// dupliquer ici la logique d'enrichissement de get_favoris.
function syncFavNavFromServer(d) {
  if (d.nav_mode === 'favoris' && Array.isArray(d.nav_keys) && d.nav_keys.length) {
    const queue = d.nav_keys.map(k => LAST_FAVORIS_LIST.find(f => f.key === k)).filter(Boolean);
    if (queue.length === d.nav_keys.length) {
      favNavQueue = queue;
      favNavIdx = queue.findIndex(f => f.key === d.nav_active);
    }
  } else if (d.nav_mode === 'normal' && favNavQueue) {
    favNavQueue = null;
    favNavIdx = -1;
  }
  updateFavNavButtons();
}

// Resynchronise l'affichage du lecteur radio sans relancer la lecture (déjà
// en cours) — utilisé quand le bouton physique navigue vers une webradio
// pendant la navigation favoris, cf. syncNowPlaying().
function syncRadioDisplay(radioId, titre) {
  const station = (STATIONS.fr || []).find(s => s.id === radioId) || (STATIONS.es || []).find(s => s.id === radioId) || null;
  currentPodcast = null;
  currentIdx = -1;

    el('rp-art').alt = station.name;
