// Bouton favori GPIO16 (maintien) — écrit une demande d'ouverture d'écran
// côté serveur (data/ui_request.json), pas de canal direct process Python ->
// navigateur. lastUiRequestTs === null sert de garde au tout premier poll :
// évite qu'une vieille demande déjà présente au démarrage (avant reboot,
// etc.) ne rouvre l'écran favoris tout seule au chargement de la page.
async function pollUiRequest() {
  try {
    const r = await fetch('/lecteur/radio.php?action=get_ui_request', { cache: 'no-store' });
    const d = await r.json();
    if (lastUiRequestTs === null) { lastUiRequestTs = d.ts || 0; return; }
    if (d.ts && d.ts !== lastUiRequestTs) {
      lastUiRequestTs = d.ts;
      if (d.screen === 'favoris') openFavoris();
      else if (d.screen === 'chambre') {
        // En sortie de veille, on veut MONTRER la Chambre (pas la refermer par
        // toggle si on y était déjà avant l'endormissement). Hors veille, vrai
        // toggle. Dans les deux cas, l'OUVERTURE reste gardée par /health
        // (requestOpenChambre) — l'écran ne s'ouvre que si la passerelle répond.
        const wasVeille = !!getSleepOverlay()?.classList.contains('active');
        chWakeBrowserVeille();
        if (currentScreen === 'chambre') {
          if (!wasVeille) closeChambre();  // déjà dessus, pas en veille → referme
        } else {
          requestOpenChambre();            // ouverture gardée
        }
      }
    }
  } catch (_) {}
}

async function loadParentalConfig() {
  try {
    const r = await fetch('/lecteur/radio.php?action=parental_status');
    parentalCfg = await r.json();
  } catch (_) {
    parentalCfg = { schedule_enabled: false, lang_enabled: false, schedule: {}, languages: ['fr', 'es'] };
  }
  applyParentalRestrictions();
  applySleepConfig(parentalCfg);
  // TICKET-073 : jouer le chime meme si le touch est arrive avant la fin du fetch
  if (parentalCfg.chime_enabled !== false && !chimeAlreadyPlayed) {
    const vol = (parentalCfg.chime_volume ?? 15) / 100;
    if (pendingChimeTouch) {
      // Touch deja arrive -> jouer immediatement
      chimeAlreadyPlayed = true;
      playStartupChime(vol);
    } else {
      // Touch pas encore arrive -> attendre le prochain
      const chimeOnFirstTouch = () => {
        if (!chimeAlreadyPlayed) {
          chimeAlreadyPlayed = true;
          playStartupChime(vol);
        }
      };
      document.addEventListener('touchstart', chimeOnFirstTouch, { once: true });
    }
  }
}

function isNowAllowed() {
  if (!parentalCfg || !parentalCfg.schedule_enabled) return true;
  const now  = new Date();
  const dow  = String(now.getDay());
  const hour = now.getHours();
  const slots = parentalCfg.schedule?.[dow] || [];
  return slots.some(s => {
    const [h0, h1] = String(s).split('-').map(Number);
    return hour >= h0 && hour < h1;
  });
}

function isLangAllowed(lang) {
  if (!parentalCfg || !parentalCfg.lang_enabled) return true;
  return (parentalCfg.languages || ['fr', 'es']).includes(String(lang || 'fr').toLowerCase());
}

function applyParentalRestrictions() {
  const frAllowed = isLangAllowed('fr');
  const esAllowed = isLangAllowed('es');

  // Visuel : grise le drapeau bloqué
  el('btn-fr').classList.toggle('lang-locked', !frAllowed);
  el('btn-es').classList.toggle('lang-locked', !esAllowed);

  // Si la langue active est maintenant bloquée → retour accueil immédiat
  if (selectedLang === 'fr' && !frAllowed) {
    show('home');
  } else if (selectedLang === 'es' && !esAllowed) {
    show('home');
  }
}

async function sendRadio(action, params = {}) {
  const url = new URL('radio.php', window.location.href);
  url.searchParams.set('action', action);
  Object.entries(params).forEach(([k, v]) => url.searchParams.set(k, v));
  const r = await fetch(url.toString(), { cache: 'no-store' });
  return r.text();
}

function parseMpd(raw) {
  const s = {};
  (raw || '').split('\n').forEach(l => {
    const i = l.indexOf(': ');
    if (i > -1) s[l.slice(0,i)] = l.slice(i+2).trim();
  });
  return s;
}

async function refreshStatus() {
  // La resynchro HP/casque (syncAudioMode) tourne dans sa propre boucle
  // rapide (setInterval global, 300ms) — pas ici, pour rester réactive même
  // hors écran lecteur et indépendamment du cycle 3s de refreshStatus.
  try {
    const raw    = await sendRadio('status');
    const status = parseMpd(raw);
    const state  = status.state || 'stop';
    const elapsed  = parseFloat(status.elapsed  || 0);
    lastElapsed = elapsed;
    const duration = parseFloat(status.duration || 0);

    // Auto-next : épisode terminé (play → stop, pas pause)
    if (lastMpdState === 'play' && state === 'stop' && currentPodcast && currentIdx >= 0) {
      const items = getDisplayItems(currentPodcast);
      if (currentIdx < items.length - 1) {
        if (!isNowAllowed()) { show('home'); return; }
        lastMpdState = state;
        playTrack(currentIdx + 1);
        return;
      }
    }
    lastMpdState = state;

    applyPlaybackIcons(state === 'play');

    if (duration > 0) {
      currentDuration = duration;
      el('prog-fill').style.width = Math.min(100, elapsed / duration * 100) + '%';
      el('t-elapsed').textContent = fmtDur(elapsed);
      el('t-total').textContent   = fmtDur(duration);
    }

    // Volume bar (MPD → IHM)
    const mpdVol = parseInt(status.volume || 0, 10);
    currentVolume = mpdToIhm(mpdVol);
    document.querySelectorAll('.vol-fill').forEach(node => {
      node.style.width = Math.min(100, currentVolume) + '%';
    });
    document.querySelectorAll('.vol-percent').forEach(node => {
      node.textContent = currentVolume + '%';
    });
    document.querySelectorAll('.btn-vol-up').forEach(node => {
      const atMax = currentVolume >= 100;
      node.style.opacity = atMax ? '0.3' : '1';
      node.style.pointerEvents = atMax ? 'none' : '';
    });

    // Persist progress
    if (currentPodcast && currentIdx >= 0) {
      const items = getDisplayItems(currentPodcast);
      const ch = items[currentIdx];
      if (ch) {
        localStorage.setItem('hech_prog', JSON.stringify({
          podcastId: currentPodcast.id, chapterId: ch.id, position: elapsed,
        }));
      }
    }

    await syncNowPlaying();
  } catch(_) {}
}

// Resynchronise currentPodcast/currentIdx (et l'affichage titre/jaquette/
// badge) sur l'épisode réellement en cours de lecture côté MPD — nécessaire
// car un bouton physique GPIO next/précédent (TICKET-091) change la piste
// sans passer par playTrack(). Ne relance jamais playfile ici : la piste
// visée est déjà en cours de lecture, on aligne juste l'affichage (même
// principe que syncAudioMode() pour TICKET-031).
async function syncNowPlaying() {
  try {
    const r = await fetch('/lecteur/radio.php?action=now_playing', { cache: 'no-store' });
    const d = await r.json();
    if (!d.ok || !DATA) return; // rien de reconnu en cours, MPD à l'arrêt, etc.

    // Contexte favoris (TICKET-046) — dans les deux sens : que le suivant/
    // précédent ait été déclenché par le bouton physique ou par ce JS, les
    // deux doivent finir d'accord sur où on en est dans la liste.
    syncFavNavFromServer(d);

    if (d.type === 'radio') {
      if (currentStation?.id === d.radio_id) return; // déjà synchro
      syncRadioDisplay(d.radio_id, d.titre);
      // Ne bascule l'écran que si on est déjà sur un des deux écrans de
      // lecture (jamais depuis un écran de navigation/menu) — évite
      // d'arracher l'enfant d'un écran qu'il est en train de parcourir.
      if (currentScreen === 'player' || currentScreen === 'radio-player') show('radio-player');
      return;
    }

    if (currentPodcast?.id === d.podcast_id && currentIdx === d.idx) return; // déjà synchro

    const podcast = DATA.podcasts?.find(p => p.id === d.podcast_id);
    if (!podcast) return;
    const items = getDisplayItems(podcast);
    const ch = items[d.idx];
    if (!ch) return;

    currentStation = null;
    currentPodcast = podcast;
    currentIdx     = d.idx;

    el('ctrl-pod').textContent        = podcast.titre;
    el('ctrl-ep').textContent         = ch.titre;
    el('player-back-lbl').textContent = podcast.titre;
    el('player-art').src              = ch.image || podcast.image;
    el('player-art').alt              = podcast.titre;
    el('t-total').textContent         = fmtDur(ch.duree);
    const epMatch = ch.titre && ch.titre.match(/\b(\d+)\b/);
    el('ep-num-badge').textContent = epMatch ? epMatch[1] : String(d.idx + 1);

    // Cœur favori (TICKET-046) — piste changée par un bouton physique
    // (next/précédent), même resynchro que le reste de cet écran.
    const favKey = episodeFavKey(podcast.id, ch.id);
    el('art-box').dataset.favKey = favKey;
    el('art-box').classList.toggle('is-fav', FAVORIS_SET.has(favKey));

    if (currentScreen === 'player' || currentScreen === 'radio-player') show('player');
  } catch (_) {}
}

// Guirlande lumineuse — câble tendu entre deux points = une chaînette, y = cosh(x)
// (Thomas s'en souvenait bien). x normalisé entre -1 et 1 sur toute la largeur,
// y = cosh(x) est minimal au centre (0 → cosh(0)=1, point le plus bas du câble) et
// maximal aux bords (±1 → cosh(1)≈1.543, points d'accroche) — converti en coordonnées
// SVG (y vers le bas) puis mis à l'échelle sur la hauteur du viewBox. Hauteur de
// viewBox volontairement faible (34) par rapport à la largeur (1000) pour un rendu
// "tendu" plutôt qu'un gros U mou.
const NOEL_GARLAND_COLORS = ['#3dba6a', '#f5c842', '#f5a623', '#00c8ff', '#e24b4a'];
// Chaînette (câble tendu entre deux points, y = cosh(x)) — géométrie générique
// partagée par la guirlande de Noël (ampoules) et la guirlande anniversaire (fanions).
const GARLAND_W = 1000;
const GARLAND_H = 26; // affaissement max en unités de viewBox (viewBox total: 34)

function catenaryY(xNorm) {
  const coshMax = Math.cosh(1);
  return GARLAND_H * (coshMax - Math.cosh(xNorm)) / (coshMax - 1);
}
function catenaryPoint(xNorm) {
  return { x: (xNorm + 1) / 2 * GARLAND_W, y: catenaryY(xNorm) };
}
// Construit le tracé (attribut "d") du câble : nombreux points échantillonnés le long
// de la chaînette reliés par des segments (courbe assez plate pour rester lisse même
// en lignes droites). Partagé par les deux guirlandes.
function catenaryWireD() {
  const SAMPLES = 60;
  let d = '';
  for (let i = 0; i < SAMPLES; i++) {
    const xNorm = -1 + (2 * i) / (SAMPLES - 1);
    const p = catenaryPoint(xNorm);
    d += (i === 0 ? 'M' : ' L') + p.x.toFixed(1) + ',' + p.y.toFixed(1);
  }
  return d;
}

function initNoelGarland() {
  const bulbsGroup = document.getElementById('noel-garland-bulbs');
  const wire   = document.getElementById('noel-garland-wire');
  const wireHl = document.getElementById('noel-garland-wire-hl');
  if (!bulbsGroup || !wire || bulbsGroup.childElementCount) return;

  const d = catenaryWireD();
  wire.setAttribute('d', d);
  if (wireHl) wireHl.setAttribute('d', d);

  // Ampoules : réparties le long de la même courbe, légèrement en retrait des deux
  // points d'accroche (x = ±1 exactement).
  const BULBS = 24;
  for (let i = 0; i < BULBS; i++) {
    const xNorm = -0.94 + (1.88 * i) / (BULBS - 1);
    const p = catenaryPoint(xNorm);
    const c = document.createElementNS('http://www.w3.org/2000/svg', 'circle');
    c.setAttribute('cx', p.x.toFixed(1));
    c.setAttribute('cy', p.y.toFixed(1));
    c.setAttribute('r', 4.5);
    const color = NOEL_GARLAND_COLORS[i % NOEL_GARLAND_COLORS.length];
    c.setAttribute('fill', color);
    c.style.color = color; // pour currentColor dans le filter drop-shadow (glow)
    c.classList.add('noel-bulb');
    c.style.animationDuration = (1.6 + Math.random() * 0.9) + 's';
    c.style.animationDelay = '-' + (Math.random() * 2) + 's';
    bulbsGroup.appendChild(c);
  }
}

function initAnnivGarland() {
  const flagsGroup = document.getElementById('anniv-garland-flags');

  const d = catenaryWireD();

  // Fanions : petits triangles suspendus sous la courbe, répartis comme les ampoules
  // de la guirlande de Noël.
  const FLAGS = 22;
  for (let i = 0; i < FLAGS; i++) {
    const xNorm = -0.92 + (1.84 * i) / (FLAGS - 1);
    const p = catenaryPoint(xNorm);
    const poly = document.createElementNS('http://www.w3.org/2000/svg', 'polygon');

                (p.x + 9).toFixed(1) + ',' + p.y.toFixed(1) + ' ' +
                p.x.toFixed(1) + ',' + (p.y + 15).toFixed(1);
    poly.setAttribute('points', pts);
    poly.setAttribute('fill', ANNIV_COLORS[i % ANNIV_COLORS.length]);
    poly.classList.add('anniv-flag');
    poly.style.animationDuration = (2.2 + Math.random() * 1.2) + 's';
    poly.style.animationDelay = '-' + (Math.random() * 2) + 's';
    flagsGroup.appendChild(poly);
  }
}

function renderPodcasts() {
  const grid = el('pod-grid');
  grid.innerHTML = '';
  if (!DATA) return;

  const lang = selectedLang.toLowerCase();

  // Sécurité : si la langue active est bloquée, retour accueil (ne pas afficher la grille)
  if (!isLangAllowed(lang)) { show('home'); return; }

  const list = DATA.podcasts.filter(p =>
    (p.langue || p.lang || p.language || '').toLowerCase() === lang
  );

  list.forEach(p => {
    const c = document.createElement('div');
    c.className = 'pod-card';
    c.innerHTML = `<img src="${p.image}" alt="${p.titre}" loading="lazy" draggable="false"><div class="pod-label">${p.titre}</div>${NOEL_ACTIVE ? NOEL_HAT_SVG : ''}${ANNIV_ACTIVE ? ANNIV_HAT_SVG : ''}`;
    c.addEventListener('click', () => openPodcast(p.id));
    grid.appendChild(c);
  });

function renderChapters() {
  const list  = el('ep-list');
  list.innerHTML = '';
  // Capture le podcast réellement parcouru ici (TICKET-108, 2026-07-18) :
  // currentPodcast est aussi utilisé par syncNowPlaying() (toutes les 3s, cf.
  // refreshStatus) pour refléter ce qui joue *réellement* sur MPD — si cette
  // resynchro tombe pendant que l'enfant regarde la liste d'épisodes d'un
  // autre podcast, currentPodcast est silencieusement réécrit et un tap sur
  // une ligne lance alors le mauvais épisode (bug : clic sur un épisode de
  // Tina qui lance un épisode des Odyssées). On fige donc la référence ici,
  // au moment du rendu, et on la réaffirme juste avant playTrack().
  const browsedPodcast = currentPodcast;
  const displayItems = getDisplayItems(browsedPodcast);
  if (!displayItems.length) {
    list.innerHTML = '<div style="padding:12px;color:var(--muted)">Aucun épisode disponible.</div>';
    return;
  }
  let prevSeason;
  displayItems.forEach((ch, idx) => {
    // Petit espace entre saisons (TICKET-104) : seulement si l'ingest a pu
    // détecter une saison (itunes:season du flux ou motif de titre "N/M") —
    // sinon pas de séparation (ex: Professeur Caillou, Bestioles n'ont pas
    // de saison détectable, pas de heuristique par date, cf. décision Thomas
    // 2026-07-09 : ça ne marche pas pour les podcasts à sortie irrégulière).
    if (ch.saison && idx > 0 && ch.saison !== prevSeason) {
      const divider = document.createElement('div');
      divider.className = 'ep-season-divider';
      list.appendChild(divider);
    }
    prevSeason = ch.saison;

    const row = document.createElement('div');
    row.className = 'ep-row';
    const fallback = browsedPodcast.image || '';
    const favKey = episodeFavKey(browsedPodcast.id, ch.id);
    row.innerHTML = `
      <div class="ep-thumb-wrap ${FAVORIS_SET.has(favKey) ? 'is-fav' : ''}" data-fav-key="${favKey}">
        <img class="ep-thumb" src="${ch.image || fallback}" onerror="this.onerror=null;this.src='${fallback}'" alt="" loading="lazy" draggable="false">
        ${NOEL_ACTIVE ? noelHatMarkup('noel-hat-sm') : ''}
        ${ANNIV_ACTIVE ? annivHatMarkup('anniv-hat-sm') : ''}
        <span class="fav-heart">♥</span>
      </div>
      <div class="ep-meta">
        <div class="ep-titre">${ch.titre}</div>
        <div class="ep-duree">${fmtDur(ch.duree)}</div>
      </div>`;
    row.addEventListener('click', () => {
      favNavQueue = null; favNavIdx = -1; updateFavNavButtons(); syncNavContextToServer(); // quitte la navigation favoris (voir plus haut)
      currentPodcast = browsedPodcast; // réaffirme la cible au clic (voir note ci-dessus)
      playTrack(idx);
    });
    list.appendChild(row);
  });
}

async function playTrack(idx) {
  if (!isNowAllowed()) {
    show('home');
    return;
  }
  const lang = (currentPodcast?.langue || currentPodcast?.lang || currentPodcast?.language || 'fr').toLowerCase();
  if (!isLangAllowed(lang)) {
    show('home');
    return;
  }
  if (!currentPodcast) return;
  const displayItems = getDisplayItems(currentPodcast);
  const ch = displayItems[idx];
  if (!ch) return;
  currentStation = null;  // TICKET-072 : efface la station radio pour le mini-lecteur
  currentIdx = idx;

  el('ctrl-pod').textContent        = currentPodcast.titre;
  el('ctrl-ep').textContent         = ch.titre;
  el('player-back-lbl').textContent = currentPodcast.titre;
  el('player-art').src              = ch.image || currentPodcast.image;
  el('player-art').alt              = currentPodcast.titre;
  el('prog-fill').style.width       = '0%';
  el('t-elapsed').textContent       = '0:00';
  el('t-total').textContent         = fmtDur(ch.duree);
  el('btn-pp').textContent          = '⏸';
  el('art-overlay').classList.remove('show');

  // Badge numéro d'épisode (extrait du titre ou position dans la série)
  const epMatch = ch.titre && ch.titre.match(/\b(\d+)\b/);
  const epNum = epMatch ? epMatch[1] : String(idx + 1);
  el('ep-num-badge').textContent = epNum;

  // Cœur favori (TICKET-046) — data-fav-key permet à applyFavoriBadges() de
  // le tenir à jour ensuite (ex: bouton physique appuyé pendant l'écoute).
  const favKey = episodeFavKey(currentPodcast.id, ch.id);
  el('art-box').dataset.favKey = favKey;
  el('art-box').classList.toggle('is-fav', FAVORIS_SET.has(favKey));

  await sendRadio('playfile', { path: ch.audio });

  // Restore saved position if same episode
  try {
    const saved = JSON.parse(localStorage.getItem('hech_prog') || 'null');
    if (saved && saved.podcastId === currentPodcast.id &&
        saved.chapterId === ch.id && saved.position > 5) {
      const statusRaw = await sendRadio('status');
      const songid    = parseMpd(statusRaw).songid;
      if (songid) await sendRadio('seekid', { id: songid, time: Math.floor(saved.position) });
    }
  } catch(_) {}

  show('player');
  startPoll();
  refreshStatus();
}

function startPoll() {
  stopPoll();
  pollTimer = setInterval(refreshStatus, 3000);
  if (parentalTimer) clearInterval(parentalTimer);
  parentalTimer = setInterval(checkParentalTime, 30000);
}
function stopPoll() {
  if (pollTimer) { clearInterval(pollTimer); pollTimer = null; }
  if (parentalTimer) { clearInterval(parentalTimer); parentalTimer = null; }
}

// ── Sortie audio HP / Casque ──────────────────────────────
// TICKET-031 — bouton physique GPIO + IHM tactile doivent se comporter
// identiquement. Le volume mémorisé par mode et la séquence "volume d'abord,
// sortie ensuite" sont gérés côté serveur (radio.php, data/audio_output_state.json)
// — pas ici — pour que n'importe quel déclencheur (tap écran, bouton GPIO,
// future détection auto du casque) produise le même résultat, y compris
// l'affichage : voir syncAudioMode() appelé en boucle par refreshStatus().
let audioMode = 'hp'; // 'hp' | 'casque' — reflète l'état serveur, pas une source de vérité locale

function updateOutputBtn() {
  const btn = el('mini-btn-output');
  if (!btn) return;
  if (audioMode === 'casque') {
    btn.classList.add('casque-actif');
    el('ico-hp').classList.add('hidden');
    el('ico-casque').classList.remove('hidden');
    btn.title = 'Casque actif — tap pour revenir aux haut-parleurs';
  } else {
    btn.classList.remove('casque-actif');
    el('ico-hp').classList.remove('hidden');
    el('ico-casque').classList.add('hidden');
    btn.title = 'Haut-parleurs actifs — tap pour le casque';
  }
}

// Icônes play/pause — factorisé pour être appelé à la fois par refreshStatus()
// (cycle 3s, avec le reste : progression, volume, persistance) et par
// syncPlaybackState() (cycle rapide 300ms) qui ne sert qu'à réduire la latence
// perçue quand la lecture est basculée par un bouton physique GPIO plutôt que
// par un tap écran — même principe que syncAudioMode() pour la sortie HP/casque.
function applyPlaybackIcons(playing) {
  el('btn-pp').textContent       = playing ? '⏸' : '▶';
  el('ov-icon').textContent      = playing ? '⏸' : '▶';
  el('mini-btn-pp').textContent  = playing ? '⏸' : '▶';
  el('rp-btn-pp').textContent    = playing ? '⏸' : '▶';
  el('art-overlay').classList.toggle('show', !playing);
}

async function syncPlaybackState() {
  try {
    const raw = await sendRadio('status');
    const state = parseMpd(raw).state || 'stop';
    applyPlaybackIcons(state === 'play');
  } catch (_) {}
}

// Applique le volume renvoyé par le serveur à l'affichage IHM sans repasser
// par setVolume() (qui enverrait une commande MPD redondante — le serveur a
// déjà réglé le volume au bon niveau pendant la bascule).
function applyVolumeDisplay(ihmPct) {
  if (ihmPct == null) return;
  currentVolume = Math.max(0, Math.min(100, Math.round(ihmPct)));
  document.querySelectorAll('.vol-fill').forEach(node => {
    node.style.width = Math.min(100, currentVolume) + '%';
  });
  document.querySelectorAll('.vol-percent').forEach(node => {
    node.textContent = currentVolume + '%';
  });
}

async function toggleOutput(e) {
  e.stopPropagation();
  const target = audioMode === 'hp' ? 'casque' : 'hp';
  // Mise à jour optimiste de l'icône — la confirmation/volume arrive juste après
  audioMode = target;
  updateOutputBtn();
  try {
    const raw = await sendRadio('set_output', { mode: target });
    const d = JSON.parse(raw);
    audioMode = d.mode || target;
    updateOutputBtn();
    applyVolumeDisplay(d.volume_pct);
  } catch (_) {}
}

// Resynchronise l'IHM sur l'état réel serveur — nécessaire car la bascule
// peut être déclenchée ailleurs que par ce tap (bouton physique GPIO, plus
// tard détection auto du casque). Appelé par refreshStatus() (toutes les 3s).
async function syncAudioMode() {
  try {
    const r = await fetch('/lecteur/radio.php?action=get_output', { cache: 'no-store' });
    const d = await r.json();
    const mode = d.mode || 'hp';
    if (mode !== audioMode) {
      audioMode = mode;
      updateOutputBtn();
    }
    applyVolumeDisplay(d.volume_pct);
  } catch (_) {}
}

async function initAudioMode() {
  await syncAudioMode();
}

      const st = parseMpd(raw);
      if (st.state === 'stop' || st.state === 'pause') {
        show('home');
      }
    }
  }
}

// ─── Scroll JS universel (touch + souris + VNC, Chromium Pi) ────────────────
(function () {
  let scroller = null, sy = 0, st = 0, moved = false;
  document.addEventListener('pointerdown', e => {
    const s = e.target.closest('.s-body');
    if (!s) return;
    // Laisser les barres de scrubbing et les cibles tactiles gérer elles-mêmes
    // (progression, volume, curseurs Chambre .ch-vbox, et icônes tap .ch-tap
    // lampe/volet) — sinon le scroll JS capte le geste et, au moindre
    // mouvement du doigt (>4px), annule le click : le tap volet "ne marche pas".
    if (e.target.closest('.prog-bg, .vol-bar-wrap, .ch-vbox, .ch-tap')) return;
    scroller = s; sy = e.clientY; st = s.scrollTop; moved = false;
  }, true);
  document.addEventListener('pointermove', e => {
    if (!scroller) return;
    const dy = sy - e.clientY;
    if (Math.abs(dy) > 4) { moved = true; e.preventDefault(); scroller.scrollTop = st + dy; }
  });
  document.addEventListener('pointerup',     () => { scroller = null; });
  document.addEventListener('pointercancel', () => { scroller = null; });
  // Annuler le click sur une carte si c'était un scroll
  document.addEventListener('click', e => {
    if (moved) { e.stopPropagation(); e.preventDefault(); moved = false; }
  }, true);
})();

// ─── Pointer Events scrubbing (touch + souris, sans conflit scroll) ──────────
function makeScrubBar(barEl, onPct, refEl) {
  const ref = refEl || barEl;
  function pct(e) {
    const r = ref.getBoundingClientRect();
    return Math.max(0, Math.min(1, (e.clientX - r.left) / r.width));
  }
  barEl.addEventListener('pointerdown', e => {
    barEl.setPointerCapture(e.pointerId);
    onPct(pct(e));
  });
  barEl.addEventListener('pointermove', e => {
    if (e.buttons === 0) return;
    onPct(pct(e));
  });
}
makeScrubBar(el('player-prog-bar'), pct => {
  if (!currentDuration) return;
  seekCurrent(Math.round(pct * currentDuration));
});

makeScrubBar(pvb, pct => setVolume(Math.round(pct * 100)), pvb.querySelector('.vol-bar-bg'));

// ═══════════════════════════════════════
// SON DE DÉMARRAGE (Web Audio API)
// ═══════════════════════════════════════
function playStartupChime(volume = 0.12) {
  if (volume <= 0) return;
  try {
    const ctx = new (window.AudioContext || window.webkitAudioContext)();

    // Reverb artificiel : delay + feedback léger
    const delay = ctx.createDelay(0.4);
    delay.delayTime.value = 0.18;
    const feedback = ctx.createGain();
    feedback.gain.value = 0.28;
    delay.connect(feedback);
    feedback.connect(delay);

    // Master envelope : attaque douce, longue queue
    const master = ctx.createGain();
    master.gain.setValueAtTime(0, ctx.currentTime);
    master.gain.linearRampToValueAtTime(volume, ctx.currentTime + 0.12);
    master.gain.setValueAtTime(volume, ctx.currentTime + 0.6);
    master.gain.exponentialRampToValueAtTime(0.0001, ctx.currentTime + 3.2);
    master.connect(delay);
    delay.connect(ctx.destination);
    master.connect(ctx.destination);

    // Accord chaud : C4 – G4 – E5 – C5 (quinte + tierce, ouvert et spatial)
    const NOTES = [
      { freq: 261.63, delay: 0.00, gain: 0.55 },  // C4 — fondamentale
      { freq: 392.00, delay: 0.06, gain: 0.40 },  // G4 — quinte
      { freq: 523.25, delay: 0.12, gain: 0.30 },  // C5 — octave
      { freq: 659.25, delay: 0.18, gain: 0.20 },  // E5 — tierce haute
    ];
    NOTES.forEach(({ freq, delay: d, gain }) => {
      const osc = ctx.createOscillator();
      const g   = ctx.createGain();
      osc.type = 'sine';
      osc.frequency.value = freq;
      osc.detune.value = (Math.random() - 0.5) * 4; // légère chaleur
      g.gain.value = gain;
      osc.connect(g);
      g.connect(master);
      osc.start(ctx.currentTime + d);
      osc.stop(ctx.currentTime + 3.5);
    });
  } catch (_) {}
}

// ═══════════════════════════════════════
// ═══════════════════════════════════════
// ÉCRAN DE VEILLE
// ═══════════════════════════════════════
let SLEEP_DELAY  = 15000;  // mis à jour depuis la config
let SLEEP_MODE   = 'retro'; // 'classic'|'classic_clock'|'retro'|'retro_clock'|'modern'|'modern_clock'
let sleepTimer = null;
const getSleepOverlay = () => document.getElementById('sleep-overlay');
const getSleepClock   = () => document.getElementById('sleep-clock');
const getSleepBrand   = () => document.getElementById('sleep-brand');

function normalizeSleepMode(m) {
  if (m === 'both')  return 'retro_clock';
  if (m === 'brand') return 'retro';
  if (m === 'clock') return 'retro_clock';
  return m || 'retro';
}

// TICKET-102 (récidive 2026-07-08 soir) — traceur temporaire écran de veille.
// Envoie un événement horodaté à radio.php (action=sleep_log), qui l'ajoute
// en append dans data/sleep_debug.log sur le Pi (consultable en direct via
// `tail -f ~/hechicero/data/sleep_debug.log` en SSH). But : capturer ce qui
// réinitialise réellement le timer de veille au moment exact où le bug se
// reproduit (bug revu plusieurs fois, cause jamais confirmée — on arrête de
// deviner après coup) plutôt que de re-diagnostiquer à l'aveugle. Fire-and-
// forget : ne doit jamais bloquer ni faire planter l'appelant.
let lastResetAt = null; // horodatage JS du dernier reset, pour logguer le delta observé
function logSleepEvent(event, extra) {
  try {
    const params = new URLSearchParams({ action: 'sleep_log', event, extra: extra ?? '' });
    fetch('/lecteur/radio.php?' + params.toString(), { cache: 'no-store' }).catch(() => {});
  } catch (_) {}
}

let SLEEP_ENABLED = true;
let sleepConfigInitialized = false; // faux jusqu'au 1er applySleepConfig() réussi

function applySleepConfig(cfg) {
  if (!cfg) return;
  const enabled  = !!(cfg.sleep_enabled ?? true);
  const newDelay = Number(cfg.sleep_delay ?? 15) * 1000;
  const newMode  = normalizeSleepMode(cfg.sleep_mode);
  // BUG TROUVE (2026-07-09, via le tracer sleep_log -- TICKET-102) : cette
  // fonction est appelee par des refresh PERIODIQUES sans rapport avec une
  // vraie activite utilisateur -- checkParentalTime() toutes les 30s (verif
  // horaires parentaux) et la resynchro admin toutes les 5 min. Avant ce
  // fix, resetSleepTimer() etait appele a CHAQUE appel, donc des que
  // sleep_delay (config admin) depassait 30s, le timer d'inactivite etait
  // perpetuellement repousse par le check parental avant d'avoir une chance
  // d'atteindre son delai -- l'ecran de veille ne pouvait alors JAMAIS se
  // declencher naturellement, peu importe l'inactivite reelle. Confirme par
  // les logs : reset_timer source=config_reload ms_since_last_reset=30000
  // en boucle avec delay_ms=120000 (120s configure, jamais atteint).
  // Fix : ne resynchroniser (et donc reset le timer) QUE si la config a
  // reellement change depuis le dernier appel, ou au tout premier chargement
  // -- un refresh qui ne change rien ne doit pas repousser l'inactivite.
  const changed = !sleepConfigInitialized
    || enabled  !== SLEEP_ENABLED
    || newDelay !== SLEEP_DELAY
    || newMode  !== SLEEP_MODE;

  SLEEP_ENABLED = enabled;
  SLEEP_DELAY   = newDelay;
  SLEEP_MODE    = newMode;
  sleepConfigInitialized = true;

  const hasClock = SLEEP_MODE.endsWith('_clock');
  const theme = SLEEP_MODE.replace('_clock', ''); // 'classic'|'retro'|'modern'
  const overlay = getSleepOverlay();
  overlay.classList.remove('classic', 'retro', 'modern');
  overlay.classList.add(theme);
  // Gradient gold/chrome sur le logo via classe utilitaire
  const brand = getSleepBrand();
  brand.className = theme === 'retro' ? 'gv-gold' : theme === 'modern' ? 'gv-chrome' : '';
  getSleepClock().style.display = hasClock ? '' : 'none';
  logSleepEvent('apply_sleep_config', `enabled=${enabled} delay_ms=${SLEEP_DELAY} mode=${SLEEP_MODE} changed=${changed}`);
  if (!enabled) {
    clearTimeout(sleepTimer);
    overlay.classList.remove('active');
  } else if (changed) {
    resetSleepTimer('config_reload');
  }
}

function updateSleepClock() {
  if (!getSleepOverlay().classList.contains('active')) return;
  if (!SLEEP_MODE.endsWith('_clock')) return;
  const now = new Date();
  const h   = String(now.getHours()).padStart(2, '0');
  const m   = String(now.getMinutes()).padStart(2, '0');
  // Le span hérite du gradient background-clip du parent #sleep-clock
  getSleepClock().innerHTML = '<span class="clock-time">' + h + ':' + m + '</span>';
}

function activateSleep() {
  const wasActive = getSleepOverlay().classList.contains('active');
  getSleepOverlay().classList.add('active');
  updateSleepClock();
  logSleepEvent('activate_sleep', `already_active=${wasActive}`);
}

function wakeUp(e) {
  const wasActive = getSleepOverlay().classList.contains('active');
  if (wasActive) {
    e.stopPropagation();
    e.preventDefault();
    getSleepOverlay().classList.remove('active');
  }
  logSleepEvent('wake_up', `event_type=${e.type} was_active=${wasActive}`);
  resetSleepTimer(`wake_up:${e.type}`);
}

function resetSleepTimer(source) {
  const now = performance.now();
  const sinceLast = lastResetAt == null ? -1 : Math.round(now - lastResetAt);
  lastResetAt = now;
  logSleepEvent('reset_timer', `source=${source ?? '?'} ms_since_last_reset=${sinceLast} delay_ms=${SLEEP_DELAY}`);
  clearTimeout(sleepTimer);
  sleepTimer = setTimeout(activateSleep, SLEEP_DELAY);
}

// Toute interaction RÉELLE réinitialise le timer
// ⚠ pointermove exclu : curseur fantôme sur Pi kiosk
// ⚠ touchstart/pointerdown exclus : écran CTP génère des touchstart fantômes sans touchend
//    → jamais de click synthétisé → 'click' filtre naturellement les faux events
['click', 'keydown'].forEach(evt =>
  document.addEventListener(evt, wakeUp, { capture: true, passive: false })
);

// Horloge de veille mise à jour chaque minute
setInterval(updateSleepClock, 10000);

// Démarrage du timer
resetSleepTimer('page_load');
logSleepEvent('page_load', `sleep_delay_default_ms=${SLEEP_DELAY}`);

// ── Battement de cœur du kiosque (TICKET-127) ─────────────────────────────
// Le 2026-08-17, la page a cessé d'exécuter du JavaScript entre 07:52:48 et
// 07:57:48 en laissant l'overlay de veille comme dernière image peinte :
// écran noir figé, tactile sans effet, alors que MPD et les boutons GPIO
// allaient bien (ils ne passent pas par la page) et que wlr-randr annonçait
// `Enabled: yes`. Impossible de dater la mort, ni de savoir dans quel état
// l'IHM était juste avant.
//
// Preuve que le JS s'était bien arrêté, et pas seulement le réseau : la
// boucle de 5 min (bas de fichier) appelle loadParentalConfig(), qui appelle
// applySleepConfig() **hors du try/catch** — même fetch en échec, la ligne
// apply_sleep_config partait quand même. Son silence ne peut donc venir que
// de l'arrêt de l'exécution.
//
// ⚠️ RÈGLE ABSOLUE (zone Z4, piège de TICKET-102) : ce battement ne doit
// JAMAIS appeler resetSleepTimer() ni toucher au timer de veille. Une boucle
// périodique plus courte que sleep_delay qui réarme le compte à rebours
// empêche l'écran de s'endormir pour toujours — c'est exactement ce que
// checkParentalTime() faisait à 30 s. Ici : un fetch, rien d'autre.
// Vérification associée : après cet ajout, l'overlay doit toujours
// s'afficher au bout de sleep_delay (120 s) d'inactivité réelle.
const KIOSK_BEAT_MS = 15000;
const pageLoadedAt = Date.now();
let kioskBeats = 0;
function kioskHeartbeat() {
  try {
    kioskBeats += 1;
    const params = new URLSearchParams({
      action:     'kiosk_beat',
      overlay:    getSleepOverlay()?.classList.contains('active') ? '1' : '0',
      screen:     currentScreen ?? '?',
      page_age_s: String(Math.round((Date.now() - pageLoadedAt) / 1000)),
      beats:      String(kioskBeats),
      mpd_state:  lastMpdState ?? '?',
    });
    // Fire-and-forget, comme logSleepEvent : ne doit jamais bloquer ni lever.
    fetch('/lecteur/radio.php?' + params.toString(), { cache: 'no-store' }).catch(() => {});
  } catch (_) {}
}
kioskHeartbeat();                          // un premier battement immédiat au chargement
setInterval(kioskHeartbeat, KIOSK_BEAT_MS);

// INIT
// ═══════════════════════════════════════

// Force le chargement de Great Vibes avant que le screensaver s'active
(new FontFace('Great Vibes', "url('../fonts/GreatVibes-Regular.ttf')")).load()
  .then(f => document.fonts.add(f))
  .catch(() => {});

show('home');
loadParentalConfig();
loadData();
fetchFavoris();
initAudioMode();
if (NOEL_ACTIVE) { initNoelSnow(); initNoelSled(); initNoelGarland(); initNoelPlayerHat(); }
if (ANNIV_ACTIVE) { initAnnivConfetti(); initAnnivBanner(); initAnnivGarland(); initAnnivPlayerHat(); }
// Resynchro rapide et globale (pas seulement écran lecteur) — un
// basculement déclenché ailleurs (bouton physique GPIO) doit se refléter
// à l'écran quasi instantanément, pas au bout de plusieurs secondes.
// 100ms (pas 300ms) : resserré le 2026-07-08 pour améliorer la réactivité
// perçue des boutons physiques — ça reste du polling (pas un vrai push),
// mais à cette cadence la latence n'est plus perceptible à l'œil.
setInterval(syncAudioMode, 100);
setInterval(syncPlaybackState, 100);

// Favoris (TICKET-046) — deux boucles globales, indépendantes de l'écran
// affiché (un appui sur le bouton physique peut arriver de n'importe où) :
// pollUiRequest (1s) détecte l'appui long -> ouverture écran favoris ;
// fetchFavoris détecte le tap -> ajout/retrait d'un favori. Resserré à 1s
// (au lieu de 4s au départ) — Thomas trouvait le délai d'apparition du cœur
// trop long ; le bouton physique ne notifie pas directement le navigateur
// (process séparé), donc le polling est la seule façon de le savoir.
setInterval(pollUiRequest, 1000);
setInterval(fetchFavoris, 1000);

// ── Rafraîchissement périodique de la config admin (toutes les 5 min)
// Répercute sans redémarrage les changements de veille, contrôle parental et radios ajoutées.
// TICKET-114 : le tick appelle refreshCatalogInPlace() et non plus loadData()
// — c'est ce dernier, qui chargeait sans jamais re-rendre, qui était le trou.
setInterval(() => { loadParentalConfig(); refreshCatalogInPlace(); }, 5 * 60 * 1000);

// TICKET-114 — détection rapide d'un catalogue modifié (ingest nocturne, ajout
// depuis l'admin). Polling à 10 s sur une réponse de quelques octets ; le
// rechargement complet n'a lieu que quand la signature a réellement changé.
setInterval(pollCatalogVersion, 10000);
</script>
