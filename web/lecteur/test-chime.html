<!DOCTYPE html>
<html>
<head><meta charset="utf-8"><title>Test chime</title>
<style>
  body { background:#111; display:flex; flex-direction:column; align-items:center; justify-content:center; gap:1.2rem; min-height:100vh; margin:0; font-family:sans-serif; color:#ccc; padding:2rem 0; box-sizing:border-box; }
  button { font-size:1.4rem; padding:1.2rem 2.5rem; border-radius:1rem; border:none; cursor:pointer; width:360px; text-align:left; }
  .label { font-size:0.75rem; display:block; color:#888; margin-top:2px; }
  h2 { color:#555; font-size:0.85rem; letter-spacing:0.1em; text-transform:uppercase; margin:0.5rem 0 0; }
</style>
</head>
<body>

<h2>▸ Toutes les versions — choisis ton préférée</h2>

<button style="background:#444;color:#fff" onclick="play1()">
  1 — Version originale
  <span class="label">Sinus · C4–G4–C5–E5 · court</span>
</button>

<button style="background:#1a3a2a;color:#adf" onclick="play2()">
  2 — C3 base, graves forts
  <span class="label">Triangle · C3–G3–E4–B4–D5 · gains originaux · "trop grave"</span>
</button>

<button style="background:#1a2a3a;color:#adf" onclick="play3()">
  3 — C3 base, hautes renforcées
  <span class="label">Triangle · C3 discret + E4–B4–D5 forts · version actuelle</span>
</button>

<button style="background:#2a1a3a;color:#caf" onclick="play4()">
  4 — E3 base
  <span class="label">Triangle · E3–G3–C4–E4–B4</span>
</button>

<button style="background:#3a2a1a;color:#fca" onclick="play5()">
  5 — G3 base
  <span class="label">Triangle · G3–C4–E4–B4–D5</span>
</button>

<button style="background:#3a1a1a;color:#faa" onclick="play6()">
  6 — C4 base
  <span class="label">Triangle · C4–E4–G4–B4–D5 · "trop haut"</span>
</button>

<button style="background:#0a1a0a;color:#8fa" onclick="play7()">
  7 — Très grave (C2)
  <span class="label">Sine basses + triangle aigus · C2–G2–C3–G3–E4 · orgue profond</span>
</button>

<script>
// ── Moteur commun
function playChime(notes, opts) {
  const volume  = opts.volume  ?? 0.14;
  const attack  = opts.attack  ?? 0.25;
  const hold    = opts.hold    ?? 0.8;
  const tail    = opts.tail    ?? 4.5;
  const delTime = opts.delTime ?? 0.28;
  const fbGain  = opts.fbGain  ?? 0.38;
  const detune  = opts.detune  ?? 4;
  const type    = opts.type    ?? 'triangle';

  try {
    const ctx = new AudioContext();
    const delay = ctx.createDelay(0.6);
    delay.delayTime.value = delTime;
    const fb = ctx.createGain();
    fb.gain.value = fbGain;
    delay.connect(fb); fb.connect(delay);

    const master = ctx.createGain();
    master.gain.setValueAtTime(0, ctx.currentTime);
    master.gain.linearRampToValueAtTime(volume, ctx.currentTime + attack);
    master.gain.setValueAtTime(volume, ctx.currentTime + hold);
    master.gain.exponentialRampToValueAtTime(0.0001, ctx.currentTime + tail);
    master.connect(delay); delay.connect(ctx.destination); master.connect(ctx.destination);

    notes.forEach(({ freq, d, g }) => {
      const detuneVals = detune > 0 ? [-detune, +detune] : [0];
      detuneVals.forEach(dt => {
        const osc = ctx.createOscillator();
        const gn  = ctx.createGain();
        osc.type = type;
        osc.frequency.value = freq;
        osc.detune.value = dt;
        gn.gain.value = g * (detune > 0 ? 0.6 : 1);
        osc.connect(gn); gn.connect(master);
        osc.start(ctx.currentTime + d);
        osc.stop(ctx.currentTime + tail + 0.5);
      });
    });
  } catch(e) { alert(e.message); }
}

// 1 — Original (sines)
function play1() {
  playChime([
    { freq: 261.63, d: 0.00, g: 0.55 },
    { freq: 392.00, d: 0.06, g: 0.40 },
    { freq: 523.25, d: 0.12, g: 0.30 },
    { freq: 659.25, d: 0.18, g: 0.20 },
  ], { type:'sine', detune:0, attack:0.12, hold:0.6, tail:3.2, delTime:0.18, fbGain:0.28, volume:0.15 });
}

// 2 — C3 base, gains originaux ("trop grave")
function play2() {
  playChime([
    { freq: 130.81, d: 0.00, g: 0.60 },  // C3
    { freq: 196.00, d: 0.10, g: 0.50 },  // G3
    { freq: 329.63, d: 0.20, g: 0.40 },  // E4
    { freq: 493.88, d: 0.30, g: 0.28 },  // B4
    { freq: 587.33, d: 0.40, g: 0.18 },  // D5
  ], {});
}

// 3 — C3 base, hautes renforcées (version actuelle)
function play3() {
  playChime([
    { freq: 130.81, d: 0.00, g: 0.35 },  // C3 discret
    { freq: 196.00, d: 0.10, g: 0.40 },  // G3
    { freq: 329.63, d: 0.20, g: 0.50 },  // E4 fort
    { freq: 493.88, d: 0.30, g: 0.38 },  // B4 fort
    { freq: 587.33, d: 0.40, g: 0.28 },  // D5 fort
  ], {});
}

// 4 — E3 base
function play4() {
  playChime([
    { freq: 164.81, d: 0.00, g: 0.50 },  // E3
    { freq: 196.00, d: 0.12, g: 0.40 },  // G3
    { freq: 261.63, d: 0.22, g: 0.35 },  // C4
    { freq: 329.63, d: 0.32, g: 0.28 },  // E4
    { freq: 493.88, d: 0.42, g: 0.18 },  // B4
  ], {});
}

// 5 — G3 base
function play5() {
  playChime([
    { freq: 196.00, d: 0.00, g: 0.55 },  // G3
    { freq: 261.63, d: 0.12, g: 0.45 },  // C4
    { freq: 329.63, d: 0.22, g: 0.38 },  // E4
    { freq: 493.88, d: 0.32, g: 0.25 },  // B4
    { freq: 587.33, d: 0.42, g: 0.16 },  // D5
  ], {});
}

// 7 — Très grave (C2) : sine pour les basses, triangle pour les aigus
function play7() {
  try {
    const ctx = new AudioContext();
    const delay = ctx.createDelay(0.8);
    delay.delayTime.value = 0.35;
    const fb = ctx.createGain();
    fb.gain.value = 0.42;
    delay.connect(fb); fb.connect(delay);

    const master = ctx.createGain();
    master.gain.setValueAtTime(0, ctx.currentTime);
    master.gain.linearRampToValueAtTime(0.13, ctx.currentTime + 0.4);
    master.gain.setValueAtTime(0.13, ctx.currentTime + 1.0);
    master.gain.exponentialRampToValueAtTime(0.0001, ctx.currentTime + 6.0);
    master.connect(delay); delay.connect(ctx.destination); master.connect(ctx.destination);

    const NOTES = [
      { freq:  65.41, d: 0.00, g: 0.70, type: 'sine'     },  // C2 — sub-basse
      { freq:  98.00, d: 0.10, g: 0.60, type: 'sine'     },  // G2 — basse
      { freq: 130.81, d: 0.20, g: 0.50, type: 'sine'     },  // C3 — médium grave
      { freq: 196.00, d: 0.30, g: 0.38, type: 'triangle' },  // G3 — transition
      { freq: 329.63, d: 0.40, g: 0.25, type: 'triangle' },  // E4 — halo lumineux
    ];

    NOTES.forEach(({ freq, d, g, type }) => {
      [-3, +3].forEach(dt => {
        const osc = ctx.createOscillator();
        const gn  = ctx.createGain();
        osc.type = type;
        osc.frequency.value = freq;
        osc.detune.value = dt;
        gn.gain.value = g * 0.6;
        osc.connect(gn); gn.connect(master);
        osc.start(ctx.currentTime + d);
        osc.stop(ctx.currentTime + 7.0);
      });
    });
  } catch(e) { alert(e.message); }
}

// 6 — C4 base ("trop haut")
function play6() {
  playChime([
    { freq: 261.63, d: 0.00, g: 0.60 },  // C4
    { freq: 329.63, d: 0.10, g: 0.50 },  // E4
    { freq: 392.00, d: 0.20, g: 0.40 },  // G4
    { freq: 493.88, d: 0.30, g: 0.28 },  // B4
    { freq: 587.33, d: 0.40, g: 0.18 },  // D5
  ], {});
}
</script>
</body>
</html>
