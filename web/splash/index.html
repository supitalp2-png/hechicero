<!doctype html>
<html lang="fr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=1024, initial-scale=1.0">
<title>Hechicero</title>
<style>
@font-face {
  font-family: 'Great Vibes';
  src: url('../fonts/GreatVibes-Regular.woff2') format('woff2');
  font-weight: normal;
  font-style: normal;
  font-display: swap;
}
*, *::before, *::after { margin: 0; padding: 0; box-sizing: border-box; }
html, body {
  width: 100%; height: 100%;
  background: #040608;
  overflow: hidden;
}
#splash {
  width: 100%; height: 100%;
  display: flex;
  align-items: center;
  justify-content: center;
  position: relative;
  opacity: 0;
  animation: fade-in 0.9s ease 0.3s forwards;
  background-image: repeating-linear-gradient(
    0deg, transparent, transparent 2px,
    rgba(0,0,0,.07) 2px, rgba(0,0,0,.07) 3px
  );
}
@keyframes fade-in { to { opacity: 1; } }
.glow {
  position: absolute; inset: 0;
  background: radial-gradient(ellipse 55% 45% at 50% 50%,
    rgba(30,45,80,.28), transparent 65%);
  pointer-events: none;
}
.frame {
  position: absolute; inset: 5%;
  border: 1px solid rgba(90,100,130,.40);
  pointer-events: none;
}
.center {
  display: grid;
  place-items: center;
  position: relative;
  z-index: 2;
}
.logo-glow {
  grid-area: 1/1;
  font-family: 'Great Vibes', 'Palatino Linotype', Palatino, serif;
  font-size: clamp(60px, 14vw, 145px);
  font-weight: 400;
  white-space: nowrap;
  color: rgba(160,180,220,.32);
  filter: blur(22px);
  pointer-events: none;
  user-select: none;
}
.logo {
  grid-area: 1/1;
  font-family: 'Great Vibes', 'Palatino Linotype', Palatino, serif;
  font-size: clamp(60px, 14vw, 145px);
  font-weight: 400;
  white-space: nowrap;
  background: linear-gradient(180deg,
    #383838 0%, #7a7a7a 12%, #d4d4d4 25%, #ffffff 38%,
    #d0d0d0 52%, #888888 65%, #e4e4e4 76%, #b8b8b8 88%, #484848 100%
  );
  -webkit-background-clip: text;
  -webkit-text-fill-color: transparent;
  background-clip: text;
}
</style>
</head>
<body>
<div id="splash">
  <div class="glow"></div>
  <div class="frame"></div>
  <div class="center">
    <div class="logo-glow">Hechicero</div>
    <div class="logo">Hechicero</div>
  </div>
</div>
<script>
  setTimeout(function() {
    var s = document.getElementById('splash');
    s.style.transition = 'opacity 0.6s ease';
    s.style.opacity = '0';
    setTimeout(function() { window.location.replace('/lecteur'); }, 650);
  }, 2800);
</script>
</body>
</html>
